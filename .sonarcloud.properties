# Configuracao de analise do SonarCloud (lida pela analise automatica do app no GitHub).
#
# Contexto: quatro arquivos deste repositorio sao GERADOS pelo robo de
# sincronizacao de schema (workflow types-sync) a partir do banco vivo.
# Por natureza, eles repetem estruturas (mesmas chaves JSON, mesmos blocos de
# tabela/coluna), o que derruba a metrica de linhas duplicadas do portao
# (new_duplicated_lines_density) sem indicar defeito de codigo. Foi exatamente
# o que aconteceu no PR #1281: 13.6% de duplicacao com ZERO issues apontados.
#
# O que este arquivo faz, com precisao (medido no SonarCloud apos o merge):
#
#   sonar.exclusions -> tira supabase/schema-manifest.json de TODA a analise
#   (duplicacao, issues e varredura de segredos). Esse padrao ja existia no
#   painel do SonarCloud e foi preservado aqui porque este arquivo SUBSTITUI a
#   configuracao da UI: manter o manifesto fora da analise continua necessario,
#   porque o JSON gerado (986 KB de definicoes de policy) dispara falso
#   positivo de segredo. Consequencia aceita: esse arquivo nao e analisado.
#
#   sonar.cpd.exclusions -> tira os quatro gerados APENAS da deteccao de
#   copia/cola (CPD). Destes, TRES seguem integralmente dentro da analise de
#   bugs, vulnerabilidades e seguranca: supabase/schema-catalog.json,
#   src/integrations/supabase/types.ts e scripts/db-audit/grants-baseline.json.
#
# Efeito medido no PR #1281: duplicacao de 13.6% para 0.0% e portao aprovado,
# sem queda de ncloc do projeto na main (nenhum arquivo saiu da analise por
# causa desta PR).

# Mantido do painel: o arquivo versionado substitui a configuracao da UI,
# entao o que ja existia aqui continua valendo.
sonar.exclusions=supabase/schema-manifest.json

# Arquivos gerados pelo robo: fora da metrica de duplicacao (CPD).
sonar.cpd.exclusions=supabase/schema-catalog.json,supabase/schema-manifest.json,src/integrations/supabase/types.ts,scripts/db-audit/grants-baseline.json
