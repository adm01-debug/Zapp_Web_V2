# Excecoes de verify_jwt. Regra: so entra aqui quem NAO tem como enviar um JWT
# do Supabase — servicos externos (webhooks) ou APIs com autenticacao propria.
# Ferramenta administrativa NUNCA entra: o front chama via
# supabase.functions.invoke, que ja manda o JWT da sessao.

[functions.evolution-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.gmail-webhook]
verify_jwt = false

[functions.gmail-cron-sync]
verify_jwt = false

[functions.elevenlabs-webhook]
verify_jwt = false

# Kill switch: endpoint legado preservado somente para responder 410 sem tocar
# em banco, Evolution ou credenciais. Nao reativar sem ADR, credenciais hashadas,
# escopo por tenant e rate limit distribuido.
[functions.public-api]
verify_jwt = false

# Login server-side (ADR-006): decide lockout antes/depois do GoTrue; nao existe sessao ainda.
[functions.auth-login]
verify_jwt = false

# Catálogo de produtos — edge-only; endpoint e service role via Supabase Secrets.
# verify_jwt=true é o default do CLI; declarado aqui para documentação explícita.
[functions.promogifts-catalog]
verify_jwt = true

# Entrega de mensagens sai do navegador apenas pela fila/RPC atomica. A funcao
# valida novamente o JWT e deriva o agente da sessao antes de obter um lease.
[functions.message-delivery]
verify_jwt = true

# Gateway com autenticacao interna obrigatoria: JWT de usuario/service_role ou
# x-cron-secret para o worker. verify_jwt=false permite o cron externo; a funcao
# rejeita qualquer requisicao antes de consultar o CRM quando nenhum deles existe.
[functions.crm-integration]
verify_jwt = false

[functions.csp-report]
verify_jwt = false
