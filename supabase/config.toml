# Excecoes de verify_jwt. Regra: so entra aqui quem NAO tem como enviar um JWT
# do Supabase — servicos externos (webhooks) ou APIs com autenticacao propria.
# Ferramenta administrativa NUNCA entra: o front chama via
# supabase.functions.invoke, que ja manda o JWT da sessao.

[functions.evolution-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.gmail-webhook]
verify_jwt = false

[functions.gmail-cron-sync]
verify_jwt = false

[functions.elevenlabs-webhook]
verify_jwt = false

# Autenticacao propria via header x-api-key (retorna 401 sem ele).
[functions.public-api]
verify_jwt = false

# Pre-login: chamado antes de existir sessao (verifica bloqueio de conta).
[functions.check-account-lock]
verify_jwt = false

# Pre-login: registra tentativa falha antes de existir sessao.
[functions.record-failed-login]
verify_jwt = false

# Login server-side (ADR-006): decide lockout antes/depois do GoTrue; nao existe sessao ainda.
[functions.auth-login]
verify_jwt = false

# Catálogo de produtos — edge-only; endpoint e service role via Supabase Secrets.
# verify_jwt=true é o default do CLI; declarado aqui para documentação explícita.
[functions.promogifts-catalog]
verify_jwt = true

[functions.csp-report]
verify_jwt = false
