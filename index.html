<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZAPP WEB</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical fonts for faster LCP -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          
          var skin = localStorage.getItem('theme-custom-colors');
          if (skin) {
            var c = JSON.parse(skin);
            if (c.v === 5) {
              var root = document.documentElement;
              if (c.cssVarsCache) {
                for (var k in c.cssVarsCache) root.style.setProperty('--' + k, c.cssVarsCache[k]);
              }
              if (c.borderRadius != null) {
                root.style.setProperty('--radius', (c.borderRadius / 16) + 'rem');
              }
            } else {
              localStorage.removeItem('theme-custom-colors');
            }
          }
        } catch(e) {
          console.error('[BOOT] Theme init failed:', e);
        }
      })();
    </script>
    <script>
      try { sessionStorage.removeItem('zapp-preview-boot-retry-done'); } catch(e) {}
    </script>
    <script>
      // Boot diagnostic – captures any error before React mounts and surfaces
      // a visible reason if mount doesn't happen within the timeout.
      (function() {
        var deadline = Date.now() + 8000;
        var interval = setInterval(function() {
          if (document.getElementById('root') && document.getElementById('root').firstChild) {
            clearInterval(interval);
            return;
          }
          if (Date.now() > deadline) {
            clearInterval(interval);
            var errs = (window.__bootErrors || []).map(function(e) { return e; }).join('\n');
            var root = document.getElementById('root');
            if (!root) return;
            root.innerHTML = ''
            + '<div style="min-height:100vh;background:#030712;color:#e5e7eb;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:24px;overflow:auto;">'
            + '<h1 style="color:#f87171;font-size:20px;margin:0 0 8px;">&#9888;&#65039; Falha ao inicializar o app</h1>'
            + '<p style="color:#9ca3af;font-size:13px;margin:0 0 16px;">O React n\u00e3o montou em 8s. Detalhes abaixo:</p>'
            + '<div style="background:#0f172a;border:1px solid #1f2937;border-radius:8px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;color:#fca5a5;">'
            + (errs || '(sem erros capturados — verifique o console)')
            + '</div>'
            + '<button onclick="location.reload()" style="margin-top:16px;background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;">Recarregar</button>'
            + '</div>';
          }
        }, 500);

        window.__bootErrors = window.__bootErrors || [];
        window.onerror = function(msg, src, line, col, err) {
          window.__bootErrors.push(
            '[JS] ' + msg + (src ? ' @ ' + src + ':' + line : '')
          );
        };
        window.addEventListener('unhandledrejection', function(ev) {
          var reason = ev.reason;
          window.__bootErrors.push(
            '[Promise] ' + (reason && reason.stack ? reason.stack : String(reason))
          );
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
