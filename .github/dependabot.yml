# Dependabot configuration file
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Bun dependencies: keep bun.lock synchronized with package.json.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    reviewers:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "⬆️ deps:"
    groups:
      # Group minor and patch updates together
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major upgrades require a dedicated compatibility plan and full gates.
    # This restriction applies only to version updates; security updates remain eligible.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    reviewers:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "⬆️ ci:"
