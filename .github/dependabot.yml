# Dependabot configuration file
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Bun dependencies: keep bun.lock synchronized with package.json.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    # E76 (auditoria de GitHub Actions, 2026-09-26): "reviewers" nao aparece
    # em nenhuma PR aberta do Dependabot nem em logs — a chave foi deprecada
    # pelo GitHub (Settings -> Code security -> Dependabot -> auto-assign
    # substitui). "assignees" e o campo ativo equivalente.
    assignees:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "⬆️ deps:"
    # Keep updates independent so failures map to one dependency/changelog.
    # The open PR limit bounds review load without hiding regressions in a batch.
    # Major upgrades require a dedicated compatibility plan and full gates.
    # This restriction applies only to version updates; security updates remain eligible.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Alias fixado para contratos que ainda exercitam a API Zod v3.
      # O updater Bun tenta resolver o nome do alias no registry e recebe 404;
      # o pacote real `zod` continua elegivel para atualizacoes independentes.
      - dependency-name: "zod3"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    assignees:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "⬆️ ci:"
    # init e analyze do codeql-action precisam da mesma versao: isolados, cada PR
    # falha no CodeQL ("Loaded a configuration file for version X, but running Y").
    # E77: demais actions (checkout, setup-node, setup-bun, upload-artifact,
    # github-script, setup-go, setup-deno, supabase/setup-cli) agrupadas —
    # cada bump isolado abria 1 PR e rodava os 7 required checks (~8 min) so
    # pra atualizar 1 SHA de action de terceiro/GitHub sem risco de conflito
    # de versao entre si (ao contrario do par init/analyze do codeql-action).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-misc:
        patterns:
          - "actions/*"
          - "oven-sh/setup-bun*"
          - "denoland/setup-deno*"
          - "supabase/setup-cli*"
          - "peter-evans/create-pull-request*"
          - "gitleaks/gitleaks-action*"

  # E73 (auditoria de GitHub Actions, 2026-09-26): infrastructure/preview-egress-proxy
  # tem go.mod e roda `go test ./...` no job Lint & TypeCheck do ci.yml, mas
  # nenhum ecosystem do Dependabot cobria modulos Go — dependencias do proxy
  # de egress (usado por fetch-link-preview) nunca recebiam atualizacao
  # automatica de seguranca.
  - package-ecosystem: "gomod"
    directory: "/infrastructure/preview-egress-proxy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    assignees:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "⬆️ go:"
