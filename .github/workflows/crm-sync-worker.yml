# docs:
#   gatilho: dispatch (operacao manual; schedule desligado e nenhum job do pg_cron drena o outbox — W93)
#   prova: health do CRM externo e um lote de 1..10 itens do crm_sync_outbox processado sem falha
#   falha: o job fica vermelho e nada e sincronizado; os itens continuam no outbox para replay
#   avisa: quem disparou
# nao-e-bug:
#   - schedule comentado: decisao pendente do dono (W93); religar exige vars.CRM_SYNC_WORKER_ENABLED=true e o roteiro em docs/runbooks/CRM_INTEGRATION_ROLLOUT.md
# ==================================================================
# W93 (2026-10-15) — quem drena o crm_sync_outbox hoje: NINGUEM de forma
# automatica. Medido na producao (tnnnlkbymytvtqngbbqh, somente SELECT):
#   - cron.job tem 13 jobs ativos e nenhum chama crm-integration/processOutbox
#     nem claim_crm_sync_outbox (nenhuma funcao do banco cita o worker);
#   - este workflow so' rodou por dispatch uma vez (2026-09-09, antes de o
#     outbox ter linhas); o ultimo run agendado foi 2026-09-22 (skipped);
#   - vars.CRM_SYNC_WORKER_ENABLED nao existe no repositorio;
#   - outbox: 474 pending (o mais antigo de 2026-09-26), 6 failed e
#     1 dead_letter, todos com CRM_NOT_SYNCED; 0 concluidos e 0 vinculos.
# O unico consumidor ativo e' a acao `enqueueSync` da Edge crm-integration
# (botao de sincronizacao manual), que processa apenas o item do contato.
# Este workflow e' operacao MANUAL. Religar o schedule e' decisao do dono:
# o roteiro (o que mudar e como verificar) esta em
# docs/runbooks/CRM_INTEGRATION_ROLLOUT.md, secao "Estado operacional".
# ==================================================================
name: CRM Sync Worker

on:
  # E02 (plano 2026-09-20): o cron '*/5 * * * *' ficou meses disparando runs
  # 100% "skipped" (vars.CRM_SYNC_WORKER_ENABLED nunca foi ligada) — ~288
  # runs/dia poluindo o historico de Actions sem processar nada. Reativar o
  # agendamento SOMENTE junto com vars.CRM_SYNC_WORKER_ENABLED=true, quando o
  # CRM sync entrar em operacao real:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Quantidade maxima desta execucao (1-10)'
        required: false
        default: '1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: crm-sync-worker
  cancel-in-progress: false

jobs:
  drain:
    name: Processar outbox CRM
    if: github.event_name == 'workflow_dispatch' || vars.CRM_SYNC_WORKER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: producao-edge-functions
    steps:
      - name: Validar configuracao e processar lote
        env:
          PROJECT_REF: tnnnlkbymytvtqngbbqh
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_BATCH: ${{ inputs.batch_size }}
        run: |
          if [ "$PROJECT_REF" != "tnnnlkbymytvtqngbbqh" ]; then
            echo "::error::Destino nao corresponde ao Supabase canonico."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET ausente."
            exit 1
          fi
          BATCH="${INPUT_BATCH:-1}"
          case "$BATCH" in
            ''|*[!0-9]*) echo "::error::batch_size invalido."; exit 1 ;;
          esac
          if [ "$BATCH" -lt 1 ] || [ "$BATCH" -gt 10 ]; then
            echo "::error::batch_size fora de 1..10."
            exit 1
          fi
          HEALTH_STATUS=$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/crm-health.json" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 45 \
            "https://$PROJECT_REF.supabase.co/functions/v1/crm-integration" \
            -H 'Content-Type: application/json' \
            -H "x-cron-secret: $CRON_SECRET" \
            --data '{"action":"health"}')
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "::error::Health check CRM falhou (HTTP $HEALTH_STATUS)."
            exit 1
          fi
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/crm-health.json','utf8'));if(r?.data?.external_reachable!==true||!r?.data?.queue)process.exit(1);console.log('CRM health: external=ok, queue=ok')"
          STATUS=$(curl --proto '=https' --tlsv1.2 --silent --show-error --output "$RUNNER_TEMP/crm-worker.json" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 150 \
            "https://$PROJECT_REF.supabase.co/functions/v1/crm-integration" \
            -H 'Content-Type: application/json' \
            -H "x-cron-secret: $CRON_SECRET" \
            --data "{\"action\":\"processOutbox\",\"limit\":$BATCH}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Worker CRM falhou (HTTP $STATUS)."
            exit 1
          fi
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/crm-worker.json','utf8'));if(!Array.isArray(r.data))process.exit(1);const failed=r.data.filter(x=>!x.ok);console.log('CRM outbox: processados='+r.data.length+', falhas='+failed.length);if(failed.length)process.exit(2)"
