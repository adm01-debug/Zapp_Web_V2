# docs:
#   gatilho: push na main e agendado (semanal, segunda 07:50 UTC)
#   prova: score do OpenSSF Scorecard calculado e publicado como SARIF no Code Scanning
#   falha: o job fica vermelho; o SARIF nao e publicado
#   avisa: autor do push

name: OpenSSF Scorecard (push + semanal)

# W86: score semanal + publicação de SARIF no Code Scanning.
# Disparado em cada push na main para manter o SARIF atualizado por commit;
# o schedule cobre semanas sem push.
on:
  push:
    branches: [main]
  schedule:
    # Semanal, segunda-feira 07:50 UTC.
    # Jitter: "scorecard" = 9 letras → 9 % 15 + 1 = 10 → 08:00 − 10 min = 07:50.
    - cron: '50 7 * * 1'
  workflow_dispatch:

# Sem bloco concurrency: cada SHA de push tem seu próprio resultado no Code
# Scanning; cancelar o run anterior deixaria aquele commit sem SARIF.

permissions: read-all

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  scorecard:
    name: 🔒 OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Necessário para publicar os resultados no Scorecard API e para assinar
      # o SARIF via Sigstore (OIDC token).
      id-token: write
      # Necessário para o upload-sarif publicar no Code Scanning.
      security-events: write
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calcular score e publicar SARIF
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true publica no scorecard.dev (badge + histórico
          # público); exige id-token: write (Sigstore) e repo público.
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar SARIF no Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          wait-for-processing: true
