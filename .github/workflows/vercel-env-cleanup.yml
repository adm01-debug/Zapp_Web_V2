# docs:
#   gatilho: workflow_dispatch com dry_run=1 (listagem) ou dry_run=0 (aplicar)
#   prova: remove vars perigosas/mortas do projeto Vercel (V043-V065)
#   falha: nenhuma var e removida; o operador ve o log de erro
#   avisa: operador que disparou
name: V043-V065 Vercel Env Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN=1 lista o que seria removido sem apagar nada. DRY_RUN=0 aplica.'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove vars perigosas/mortas do Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Limpar vars Vercel (V043-V065)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_READONLY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/ci/vercel-env-cleanup.mjs
