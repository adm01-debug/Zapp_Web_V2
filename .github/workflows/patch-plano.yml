name: Patch PLANO workflow count (temporario)
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/sharp-faraday-qfortu
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch PLANO file 16 to 17
        run: |
          sed -i 's/\*\*16\*\* arquivos YAML em/\*\*17\*\* arquivos YAML em/g' docs/audits/PLANO_GITHUB_ACTIONS_100_ETAPAS_2026-10-01.md
          grep -n "arquivos YAML em" docs/audits/PLANO_GITHUB_ACTIONS_100_ETAPAS_2026-10-01.md | head -5
      - name: Commit patch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/PLANO_GITHUB_ACTIONS_100_ETAPAS_2026-10-01.md
          git rm .github/workflows/patch-plano.yml
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: atualiza contagem 16->17 no PLANO; remove workflow temporario"
          git push origin claude/sharp-faraday-qfortu
