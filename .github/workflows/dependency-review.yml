# docs:
#   gatilho: pull_request em main (qualquer autor não dependabot e não-fork)
#   prova: dependency review compara apenas as dependências introduzidas pelo PR contra a base do main
#   falha: check fica vermelho se o PR adicionar dependência com CVE de severidade alta ou crítica
#   avisa: autor e revisores pelo check do GitHub
# nao-e-bug:
#   - ${{ github.actor }}: o job é pulado para dependabot e forks porque o token restrito não resolve a comparação
name: Dependency Review

# Barra, no próprio PR, dependência NOVA com vulnerabilidade de severidade alta ou crítica.
# Só analisa o que o PR muda (não a árvore inteira) — dívida antiga não trava PR.
# Licenças não bloqueiam aqui (evita barrar dependência legítima com licença fora de uma lista fixa).
# Mesmo padrão do gate 0.6 do Promo_Gifts_V4 (ações fixadas por SHA).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dependabot e forks: o token restrito não chama a API de comparação de dependências.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Falha em dependência nova com CVE de severidade alta ou crítica
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
