# docs:
#   gatilho: pull_request e agendado
#   prova: analise estatica de seguranca (SAST) de src, scripts, functions e dos workflows
#   falha: alerta aparece em Security -> Code scanning
#   avisa: aba Security e revisores do PR
# nao-e-bug:
#   - CodeQL e required desde W84: o check `CodeQL` da branch protection e publicado pelo app `github-advanced-security`, nao pelo job `analyze` deste arquivo (que e so informativo, ~3 min).
# =================================================
# CodeQL — analise estatica de seguranca (SAST)
# =================================================
# Cobre JS/TS de src/, scripts/ e supabase/functions/, e os proprios workflows.
# Achados aparecem em Security -> Code scanning alerts.
# G-02 da auditoria tecnica (2026-09-02).
# =================================================

name: CodeQL

on:
  # F-09 (auditoria 2026-09-27): removido gatilho push/main. A action
  # github/codeql-action/init cria uma entrada de cache com {run_id} na chave
  # (~231 MB cada), que nunca e reusada entre runs diferentes. Com 46+ pushes
  # num dia, o limite de 10 GB era atingido em <3 h, ativando evicção dos
  # outros workflows. pull_request cobre cada PR contra main sem cache churn
  # dos merge commits; schedule cobre a varredura semanal completa.
  # NOTA: merge_group e inerte neste repo (conta User, nao Organization) —
  # ver CLAUDE.md:230-241. Os gatilhos merge_group ja existentes em ci.yml,
  # db-guard.yml e codeql.yml ficam presentes mas nao disparam (sem custo).
  # W50: dispatch manual para reexecutar varredura completa apos triagem de alertas.
  workflow_dispatch:

  pull_request:
    branches: [main]
    # W84 (docs/ci/DECISOES_PENDENTES_2026-10-15.md): o paths-ignore de E78 (docs/**,
    # **/*.md, supabase/migrations/**) foi removido. Ele economizava runner em PR que
    # so mexia nesses caminhos, mas como o check NAO era required isso nunca travava
    # merge -- e travaria assim que virasse required: uma PR so de docs ou so de
    # migration ficaria para sempre em "Expected — Waiting for status", e a fila (que
    # so roda 1 PR por vez — R1 de docs/ci/ARQUITETURA_SEM_DESPERDICIO.md) pararia.
    # Pre-requisito para tornar o check `CodeQL` obrigatorio; o `schedule` semanal
    # continua cobrindo o repositorio inteiro sem filtro.
  schedule:
    - cron: '30 9 * * 1' # segunda 06:30 BRT


defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  # E20 (auditoria de GitHub Actions, 2026-09-26): estava invertido — cancelava
  # em push (na main) e deixava rodar em PR. Igual ao ci.yml: cancela push
  # NOVO na MESMA PR (retrabalho), nunca um commit ja mergeado na main (cada
  # commit da main mantem seu proprio veredito de CodeQL).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: 🔬 CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧬 Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          # W82: ignora caminhos de teste para nao poluir alertas de codigo de producao.
          config-file: .github/codeql/codeql-config.yml

      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:javascript-typescript'

  # Job separado de proposito: o check do job "analyze" e required na branch
  # protection, e transformar aquele job numa matrix renomearia o check e
  # travaria todos os merges. A linguagem "actions" analisa os .github/workflows
  # em busca de injecao de expressao em run:, uso indevido de pull_request_target
  # e permissoes excessivas — 3,5k linhas de YAML que nenhum guard do repo le.
  analyze-actions:
    name: 🔬 CodeQL (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧬 Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
          build-mode: none

      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:actions'
