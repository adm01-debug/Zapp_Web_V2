# docs:
#   gatilho: pull_request e dispatch
#   prova: o fluxo do Talk X no navegador
#   falha: PR fica vermelho com o artefato do Playwright
#   avisa: autor do PR
# ==========================================================================
# ZAPP-WEB · Talk X visual/launch + smoke público de Auth (NÃO required)
# ==========================================================================
# Roda as suítes visual e de lançamento do Talk X e um smoke público da tela Auth
# quando um PR toca arquivos exercitados por essas suítes — sem secrets. O projeto
# `chromium` contém APENAS `auth.spec.ts`; o fluxo autenticado de campanhas
# (`talkx.spec.ts`) não roda neste check sem secrets/dados de teste isolados e,
# portanto, não dispara este workflow. Mudanças em Edge `talkx-*` são verificadas
# pelos testes Deno do CI principal, não por estas suítes com API mockada.
#
# E27 (auditoria GitHub Actions 2026-10-01): gatilho original era `push`
# branches-ignore:main para contornar check-pr-workflow-secrets.mjs que proíbe
# pull_request + secrets. Com a remoção de E2E_TEST_EMAIL/PASSWORD, pull_request
# passa a ser seguro: PRs de fork não têm acesso a secrets de repositório.
#
# NÃO é required no branch protection — é informativo.
# ==========================================================================

name: E2E Talk X (visual/launch + Auth smoke)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/talkx/**'
      - 'src/hooks/integrations/useTalkX*'
      - 'e2e/fixtures/e2e-talkx.unit.test.mjs'
      - 'e2e/talkx-visual.spec.ts'
      - 'e2e/talkx-launch.spec.ts'
      - 'e2e/fixtures/talkx-demo.ts'
      - 'e2e/fixtures/talkx-demo/**'
      - 'e2e/fixtures/talkx-launch/**'
      - 'scripts/talkx/lado-a-lado.mjs'
      # E84: `playwright.config.ts` saiu daqui. Ele é config global da suíte — foi
      # tocado em 20 dos últimos 60 commits, quase sempre por trabalho que não é do
      # Talk X, disparando este workflow sem motivo ("PR de Contatos não dispara").
      # A config global continua coberta pelo job E2E do ci.yml, que é required.
      - '.github/workflows/e2e-talkx.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: e2e-talkx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-talkx:
    name: 🎭 Talk X visual/launch + smoke público Auth (sem campanha autenticada)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🥖 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # E68: cache dos browsers (ver ci.yml para o racional completo). Aqui só o
      # Chromium entra, então a chave usa o conjunto `c` -- ela não pode herdar um
      # cache `cfw` nem ser usada por quem precisa dos três engines.
      - name: 💾 Cache dos browsers Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-c-${{ hashFiles('bun.lock') }}-${{ runner.os }}

      - name: 🎭 Install Playwright (Chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.63.0 install --with-deps chromium

      - name: 🔧 Dependências de sistema do Playwright (cache quente)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.63.0 install-deps chromium

      - name: 🧪 Unit tests dos guardrails E2E (sem browser/rede)
        run: node --import tsx --test e2e/fixtures/e2e-talkx.unit.test.mjs

      - name: '📋 Conferir coleção: Auth smoke + Talk X visual/launch'
        run: >-
          bun run test:e2e -- --list
          --project=chromium
          --project=chromium-talkx-visual
          --project=chromium-talkx-launch

      - name: 🔐 Smoke público da tela Auth (projeto chromium; Auth-only)
        run: bun run test:e2e -- --project=chromium
        env:
          CI: true

      - name: 🖼️ Régua visual Talk X (17 telas, deslogado)
        run: bun run test:e2e -- --project=chromium-talkx-visual
        env:
          CI: true

      - name: 🚀 E2E de lançamento Talk X (provedor falso, deslogado)
        run: bun run test:e2e -- --project=chromium-talkx-launch
        env:
          CI: true

      - name: 📊 Gera régua lado a lado (mock vs captura)
        run: node scripts/talkx/lado-a-lado.mjs --out .tmp/regua

      - name: ⬆️ Upload régua visual
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regua-visual-talkx
          path: |
            playwright-report/
            .tmp/regua/
            !playwright-report/**/error-context.md
            !playwright-report/**/*.zip
            !test-results/**/error-context.md
          retention-days: 3
          if-no-files-found: ignore
