# docs:
#   gatilho: dispatch manual
#   prova: o fluxo do Talk X no navegador
#   falha: run fica vermelho com o artefato do Playwright
#   avisa: quem disparou
# ==========================================================================
# ZAPP-WEB · E2E Talk X manual (Playwright, deslogado, NÃO required)
# ==========================================================================
# Roda os specs do Talk X em Chromium sob demanda, sem secrets de autenticação.
# A decisão de CI mínimo de 16/10/2026 revogou o gatilho em PR descrito no E27.
#
# E27 (auditoria GitHub Actions 2026-10-01): gatilho original era `push`
# branches-ignore:main para contornar check-pr-workflow-secrets.mjs que proíbe
# pull_request + secrets. Com a remoção de E2E_TEST_EMAIL/PASSWORD, pull_request
# passa a ser seguro: PRs de fork não têm acesso a secrets de repositório.
#
# NÃO é required no branch protection — é informativo.
# ==========================================================================

name: E2E Talk X

on:
  # Decisão de 16/10/2026: E2E fora do CI automático por PR.
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: e2e-talkx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-talkx:
    name: 🎭 E2E Talk X (Chromium, deslogado)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout confiável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🥖 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # E68: cache dos browsers (ver ci.yml para o racional completo). Aqui só o
      # Chromium entra, então a chave usa o conjunto `c` -- ela não pode herdar um
      # cache `cfw` nem ser usada por quem precisa dos três engines.
      - name: 💾 Cache dos browsers Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-c-v2-${{ hashFiles('bun.lock') }}-${{ runner.os }}

      - name: 🎭 Install Playwright (Chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.64.1 install --with-deps chromium

      - name: 🔧 Dependências de sistema do Playwright (cache quente)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.64.1 install-deps chromium

      - name: 📐 Run Playwright E2E Talk X (Chromium, deslogado)
        run: bun run test:e2e -- --project=chromium
        env:
          CI: true

      - name: 🖼️ Régua visual Talk X (17 telas, deslogado)
        run: bun run test:e2e -- --project=chromium-talkx-visual
        env:
          CI: true

      - name: 🚀 E2E de lançamento Talk X (provedor falso, deslogado)
        run: bun run test:e2e -- --project=chromium-talkx-launch
        env:
          CI: true

      - name: 📊 Gera régua lado a lado (mock vs captura)
        run: node scripts/talkx/lado-a-lado.mjs --out .tmp/regua

      - name: ⬆️ Upload régua visual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regua-visual-talkx
          path: .tmp/regua/
          retention-days: 14
