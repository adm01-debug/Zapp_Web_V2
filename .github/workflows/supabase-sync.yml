name: Supabase Sync & Validate

# [2026-08-28] Somente execucao MANUAL. Antes, qualquer push/PR tocando
# supabase-export/** aplicava automaticamente o export no banco apontado por
# DESTINO_URL — e o export e um snapshot LEGADO, anterior a migracao para o
# banco oficial tnnnlkbymytvtqngbbqh e defasado do schema real (ver
# supabase-export/README.md e docs/audits/AUDITORIA_REFERENCIAS_DB_2026-08-28.md).
# Regerar o export a partir do banco oficial antes de reativar qualquer gatilho.
#
# [2026-09-25] DESARMADO. A unica barreira anterior era digitar o project-ref em
# confirm_project_ref — valor publico (esta no CLAUDE.md de um repo publico), logo
# um unico dispatch restaurava o snapshot legado por cima do banco de producao.
# Agora o import exige, cumulativamente:
#   1. aprovacao humana no environment protegido `legacy-import-destrutivo`;
#   2. o secret LEGACY_IMPORT_UNLOCK igual ao project-ref oficial.
# O secret NAO existe: enquanto nao for criado, todo dispatch falha fechado.
# Para reativar: regerar o export a partir do banco oficial, criar o secret e
# remove-lo logo apos o import.
on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: 'Digite o project-ref oficial para confirmar o import destrutivo.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-legacy-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Aprovacao humana obrigatoria antes de qualquer passo tocar o banco.
    environment: legacy-import-destrutivo
    steps:
      - name: Exigir destravamento explicito do import legado
        env:
          LEGACY_IMPORT_UNLOCK: ${{ secrets.LEGACY_IMPORT_UNLOCK }}
        run: |
          if [ "$LEGACY_IMPORT_UNLOCK" != "tnnnlkbymytvtqngbbqh" ]; then
            echo "::error::Import legado desarmado: crie o secret LEGACY_IMPORT_UNLOCK com o project-ref oficial para destravar (ver cabecalho deste workflow)."
            exit 1
          fi

      - name: Exigir ref confiavel da main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Import legado so pode executar a partir de refs/heads/main."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install PostgreSQL client
        run: bash scripts/ci/install-postgresql-client.sh

      - name: Confirmar identidade do banco oficial
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          if [ -z "$DESTINO_URL" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "tnnnlkbymytvtqngbbqh" ]; then
            echo "::error::Confirmacao incorreta; import cancelado."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            validarDestino,
          } from './scripts/db-audit/database-identity.mjs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL, identidade);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log('OK: destino oficial comprovado; import manual autorizado.');
          NODE

      - name: Run Import and Validation
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          bash supabase-export/import.sh

      - name: Archive validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-logs
          path: |
            supabase-export/validation_result.json
            supabase-export/validation_log.csv
          if-no-files-found: ignore
