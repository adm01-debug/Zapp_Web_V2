# docs:
#   gatilho: agendado (semanal) e dispatch
#   prova: branches podaveis, PRs paradas ha mais de 7 dias e SLA dos alertas de code scanning
#   falha: SLA vencido deixa o job vermelho e publica o diagnostico se o relatorio foi gerado
#   avisa: issue `[branch-hygiene]` no repositorio
# ==================================================================
# Auditoria semanal de higiene de branches (somente leitura)
# ==================================================================
# Nao deleta nada. Publica um relatorio no Job Summary com:
#   - branches remotos patch-equivalentes a main (candidatos a poda)
#   - branches sem commit ha mais de 30 dias
#   - PRs sem atualizacao ha mais de 7 dias
#   - comandos de poda revisaveis, sem executar exclusoes
#   - alertas de code scanning fora do SLA
# Origem: docs/audits/PLANO_CORRECOES_50_ETAPAS_2026-09-16.md, etapa E45.
# ==================================================================

name: Branch Hygiene Audit

on:
  schedule:
    - cron: '56 7 * * 1' # segunda-feira, 07:56 UTC (fora do minuto 0)
  workflow_dispatch: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Relatorio de branches
    # E79: as permissoes de escrita ficam no JOB, nunca no nivel do workflow. O zizmor
    # (regra excessive-permissions, severidade alta) reprova `write` no topo porque o
    # escopo vale para todos os jobs; no job, o escopo e' exatamente o que ele usa.
    permissions:
      contents: read # o passo de relatorio faz git fetch/cherry
      actions: read # listar os runs do proprio repositorio (KPI)
      pull-requests: read # confirmar PRs abertas antes de sugerir comandos de poda
      security-events: read # consultar alertas abertos de code scanning (W83)
      issues: write # criar/atualizar a issue semanal [kpi-actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar atualizacoes da toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/bump-toolchain.mjs

      - name: KPI do GitHub Actions
        # E79: mede o proprio uso do Actions -- runs/semana por workflow, taxa de
        # cancelamento, taxa de falha, minutos e os 5 jobs mais lentos. Publica no Job
        # Summary e mantem uma issue aberta `[kpi-actions]` atualizada a cada semana.
        # A duracao sai de `run_started_at`/`updated_at`: o endpoint de faturamento
        # devolve `billable: {}` em repositorio publico (medido em 03/10/2026).
        #
        # GA93: `KPI_JSON_PATH` liga o lado de dados do KPI. O `actions-kpi.mjs` passa a
        # gravar tambem `docs/ci/kpi.json` (custo da semana, taxa de falha, p50/p95,
        # cancelados precoces e causas, por arquivo de workflow). Quem le esse arquivo e'
        # `scripts/ci/render-workflow-docs.mjs` (:42 e :171-172), que hoje imprime "—" nas
        # colunas de custo e de falha porque nada no repositorio escrevia o arquivo.
        env:
          GH_TOKEN: ${{ github.token }}
          JANELA_DIAS: '7'
          KPI_JSON_PATH: docs/ci/kpi.json
        run: |
          set -euo pipefail
          node scripts/ci/actions-kpi.mjs

      - name: Guardar o kpi.json como artefato
        # GA93: este job NAO pode ter `contents: write` — `branch-podaveis.unit.mjs:169-170`
        # exige `contents: read` e `pull-requests: read` nele de proposito, para que o
        # workflow que calcula branch podavel nunca consiga apagar branch (W98 = so emite
        # o comando pronto). Por isso o arquivo sai daqui como artefato e quem comita e'
        # o job `publicar-kpi`, que tem a escrita e nao faz poda nenhuma.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpi-actions-json
          path: docs/ci/kpi.json
          if-no-files-found: error
          retention-days: 7

      - name: Gerar relatorio
        id: relatorio
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet

          # $RUNNER_TEMP sobrevive entre passos (cada `run:` e' um shell novo);
          # `mktemp` sozinho nao — o caminho morreria com o shell do passo 1.
          RELATORIO="$RUNNER_TEMP/branch-hygiene.md"
          EQUIVALENTES="$RUNNER_TEMP/branch-equivalentes.tsv"
          : > "$EQUIVALENTES"
          {
            echo "## Auditoria de branches — $(date -u +%Y-%m-%d)"
            echo
            echo "### Patch-equivalentes a \`main\` (candidatos a poda, 0 commits unicos)"
            echo '```'
            for ref in $(git branch -r --format='%(refname:short)' | grep -v '^origin/HEAD' | grep -v '^origin/main$' | grep -v '^origin$'); do
              b="${ref#origin/}"
              # t_ff817d9f: `git cherry ... | grep -c '^+' || true` mascarava falha REAL do
              # git cherry. Com pipefail o retorno nao zero do git caia no mesmo `|| true`
              # que so' deveria tolerar o retorno 1 do `grep -c` sem match — e a branch
              # impossivel de comparar entrava na lista de podaveis. Agora o status do git
              # cherry e' validado ANTES de contar: o status do grep nao decide nada, e zero
              # linhas `+` continua sendo equivalencia valida.
              if ! cherry=$(git cherry origin/main "$ref"); then
                echo "::error::git cherry falhou ao comparar origin/main com $ref; a equivalencia de '$b' nao pode ser decidida" >&2
                exit 1
              fi
              n=$(printf '%s\n' "$cherry" | awk '/^\+/ { c += 1 } END { print c + 0 }')
              if [ "$n" = "0" ]; then
                echo "$b"
                ts=$(git log -1 --format=%ct "$ref")
                printf '%s\t%s\n' "$b" "$ts" >> "$EQUIVALENTES"
              fi
            done
            echo '```'
            echo
            echo "### Sem commit ha mais de 30 dias"
            echo '```'
            CUTOFF=$(date -u -d '30 days ago' +%s 2>/dev/null || date -u -v-30d +%s)
            for ref in $(git branch -r --format='%(refname:short)' | grep -v '^origin/HEAD' | grep -v '^origin/main$' | grep -v '^origin$'); do
              ts=$(git log -1 --format=%ct "$ref" 2>/dev/null || echo 0)
              if [ "$ts" -lt "$CUTOFF" ] && [ "$ts" -gt 0 ]; then
                echo "${ref#origin/} ($(date -u -d "@$ts" +%Y-%m-%d 2>/dev/null || date -u -r "$ts" +%Y-%m-%d))"
              fi
            done
            echo '```'
            echo
            # E91: era 14 dias por *criacao*. O que interessa e PR parada — sem push —,
            # entao o corte passou a ser 7 dias por *updatedAt* (o push atualiza esse
            # campo; comentario tambem, e por isso o texto abaixo diz o que mede).
            echo "### PRs abertos ha mais de 7 dias sem push (updatedAt)"
            echo '```'
            # --limit explicito: o default do gh e 30, e o relatorio truncaria
            # silenciosamente se a fila de PRs abertas passar disso.
            gh pr list --repo "$REPO" --state open --limit 100 --json number,title,updatedAt,url \
              --jq '.[] | select((now - (.updatedAt | fromdateiso8601)) > (7*86400)) | "#\(.number) \(.title) — ultimo movimento \(.updatedAt | split("T")[0]) — \(.url)"'
            echo '```'
          } > "$RELATORIO"

          cat "$RELATORIO" >> "$GITHUB_STEP_SUMMARY"

      - name: Comandos de poda para revisao (W98, sem executar)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIMITE_PRS: '500'
        run: |
          set -euo pipefail
          RELATORIO="$RUNNER_TEMP/branch-hygiene.md"
          PRS="$RUNNER_TEMP/prs-abertas.json"
          PROTEGIDAS="$RUNNER_TEMP/branches-protegidas.txt"
          # Entrada indisponivel ou lista de PRs cheia faz o script recusar comandos.
          if ! gh pr list --repo "$REPO" --state open --limit "$LIMITE_PRS" --json headRefName > "$PRS"; then
            echo '{"erro":"falha ao listar PRs abertas"}' > "$PRS"
          fi
          if ! gh api --paginate "repos/$REPO/branches?protected=true&per_page=100" --jq '.[].name' > "$PROTEGIDAS"; then
            rm -f "$PROTEGIDAS"
          fi
          node scripts/ci/branch-podaveis.mjs \
            --equivalentes "$RUNNER_TEMP/branch-equivalentes.tsv" \
            --prs "$PRS" --protegidas "$PROTEGIDAS" --limite-prs "$LIMITE_PRS" \
            | tee -a "$RELATORIO" "$GITHUB_STEP_SUMMARY"

      - name: SLA dos alertas de code scanning (W83)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELATORIO="$RUNNER_TEMP/branch-hygiene.md"
          ARQUIVO="$RUNNER_TEMP/code-scanning-alerts.json"
          # Todas as paginas, em uma unica lista JSON para o CLI ler pelo stdin.
          if ! gh api --paginate --slurp "repos/$REPO/code-scanning/alerts?state=open&per_page=100" | jq 'add' > "$ARQUIVO"; then
            echo '{"message":"falha ao consultar a API de code scanning"}' > "$ARQUIVO"
          fi
          node scripts/ci/sla-code-scanning.mjs < "$ARQUIVO" \
            | tee -a "$RELATORIO" "$GITHUB_STEP_SUMMARY"

      - name: Publicar na issue semanal [branch-hygiene]
        # Publica tambem o SLA vencido, sem esconder o exit 1 do passo W83.
        # Se a coleta de branches falhou/cancelou, nao publica relatorio incompleto.
        if: ${{ !cancelled() && steps.relatorio.outcome == 'success' }}
        # E91: alem do Job Summary (efemero), mantem UMA issue aberta com a tabela,
        # para o historico ficar consultavel. Mesmo mecanismo do [kpi-actions] em
        # actions-kpi.mjs: procura a aberta por titulo e atualiza; se nao houver,
        # cria. Idempotente — rodar duas vezes no mesmo dia nao duplica.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Cada `run:` e' um shell novo: a variavel do passo anterior nao existe
          # aqui. O ARQUIVO persiste (mesmo $RUNNER_TEMP), o nome dele nao — por
          # isso o caminho e' recalculado em vez de herdado.
          RELATORIO="$RUNNER_TEMP/branch-hygiene.md"
          if [ ! -s "$RELATORIO" ]; then
            echo "::error::relatorio nao foi gerado pelo passo anterior ($RELATORIO)"
            exit 1
          fi
          TITULO='[branch-hygiene] Higiene de branches — relatorio semanal'
          EXISTENTE=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[branch-hygiene]"))][0].number // empty')

          if [ -n "$EXISTENTE" ]; then
            gh issue edit "$EXISTENTE" --repo "$REPO" --body-file "$RELATORIO"
            echo "issue atualizada: #$EXISTENTE"
          else
            gh issue create --repo "$REPO" --title "$TITULO" --body-file "$RELATORIO"
            echo "issue criada"
          fi
          rm -f "$RELATORIO"

  publicar-kpi:
    name: Publicar kpi.json
    needs: audit
    # GA93: a escrita vive SO neste job, que baixa o artefato e abre a PR. Ele nao
    # executa nada de poda de branch, nem `git push` em branch alheia: a unica escrita
    # e' a branch de automacao que a propria action cria.
    permissions:
      contents: write # commit na branch `automation/kpi-actions`
      pull-requests: write # abrir/atualizar a PR do kpi.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar o kpi.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kpi-actions-json
          path: docs/ci

      - name: Abrir ou atualizar PR do kpi.json
        # Os numeros mudam toda semana, entao nao ha checagem de "mudou": a mesma branch
        # de automacao e' reaproveitada e a PR e' atualizada no lugar. Mesmo mecanismo e
        # mesmo pin de `inventario-estado-semanal.yml` e `types-sync.yml`.
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        env:
          HUSKY: '0' # evita o hook pre-push do Husky no push interno da action
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/kpi-actions
          delete-branch: true
          commit-message: 'chore: kpi do github actions [auto]'
          title: 'chore: KPI do GitHub Actions (semanal)'
          body: |
            `docs/ci/kpi.json` regerado por `.github/workflows/branch-hygiene-audit.yml`
            a partir da API de Actions do proprio repositorio (somente leitura).

            Alimenta as colunas de custo e de taxa de falha de
            `scripts/ci/render-workflow-docs.mjs`.

            - main de origem: `${{ github.sha }}`
            - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: ci
          add-paths: |
            docs/ci/kpi.json
