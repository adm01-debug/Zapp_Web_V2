# docs:
#   gatilho: push em main, a cada 10 min e dispatch
#   prova: branch contexto-ia = main + 1 commit com inventario/ia/* regerado do código
#   falha: o job fica vermelho; a branch contexto-ia fica no último estado bom
#   avisa: nada (force-push na branch derivada contexto-ia)
name: Contexto para agentes de IA

# Mantém inventario/ia/ (rotas, módulos, hooks, edges, banco, testes, scripts, grafo, baseline)
# sempre igual ao código em main, para qualquer agente consultar antes de planejar/executar.
# Gerador: scripts/ai-context/gerar.mjs (zero dependências; ~6 s neste repo).
#
# Onde fica: na branch derivada `contexto-ia` (= main + 1 commit), nunca em main — main tem
# checks obrigatórios + enforce_admins, então push direto do GITHUB_TOKEN seria recusado, e PR a
# cada 10 min seria spam. Vercel não faz deploy dessa branch (vercel.json git.deploymentEnabled).
# Leitura: raw.githubusercontent.com/<owner>/<repo>/contexto-ia/inventario/ia/INDEX.md,
# `git show origin/contexto-ia:inventario/ia/<arquivo>` ou MCP get_file(ref=contexto-ia).
#
# Custo: no agendamento, se HEAD de main == commit do manifest da branch, sai em ~15 s sem gerar.

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: contexto-ia
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gerar:
    name: Regerar inventario/ia
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 300 # baseline.json usa git log dos últimos 30 dias
          persist-credentials: false

      - name: Pular se nada mudou desde a última geração (só no agendamento)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          head="$(git rev-parse HEAD)"
          last=""
          if git fetch -q --depth=1 origin contexto-ia 2>/dev/null; then
            last="$(git show FETCH_HEAD:inventario/ia/manifest.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch{console.log("")}})')"
          fi
          if [ "$EVENT_NAME" = "schedule" ] && [ "$head" = "$last" ]; then
            echo "HEAD ($head) já inventariado; nada a fazer."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Gerar contexto
        if: steps.gate.outputs.run == 'true'
        run: node scripts/ai-context/gerar.mjs

      - name: Publicar na branch contexto-ia (main + 1 commit)
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: contexto-ia[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: contexto-ia[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -f -A inventario/ia  # pasta está no .gitignore de main; aqui é versionada de propósito
          git diff --cached --stat -- inventario/ia | tail -3
          git commit -q -m "chore(ia): contexto para agentes @ main $(git rev-parse --short HEAD) [skip ci]"
          # branch derivada: sempre main + este commit; force é esperado e seguro (ninguém trabalha nela)
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/contexto-ia
