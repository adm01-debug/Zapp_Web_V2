name: Settings Guard
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read
concurrency:
  group: settings-guard
  cancel-in-progress: false
jobs:
  guard:
    name: Verificar branch protection e allow_auto_merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: perimetro-leitura
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🟩 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 🛡️ Verificar e restaurar configurações
        run: node scripts/ci/github-settings-guard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_READ_TOKEN: ${{ secrets.SETTINGS_GUARD_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PERIMETER_SNAPSHOT_PATH: perimeter-snapshot.json
      - name: 📦 Publicar snapshot do perímetro
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perimeter-snapshot-${{ github.run_id }}
          path: perimeter-snapshot.json
          if-no-files-found: ignore
          retention-days: 14
