# docs:
#   gatilho: dispatch na main, com o job gateado por environment
#   prova: dry-run obrigatorio e apply com hash estrutural da migration
#   falha: nada e aplicado; o dry-run precisa passar antes
#   avisa: operador que disparou e a issue de ops
# ==================================================================
# ZAPP-WEB · Migration controlada do banco oficial
# ==================================================================
# Executa somente por workflow_dispatch na main. O dry-run e obrigatorio
# antes de uma aplicacao: ele comprova o destino, exige uma migration local
# ou um bundle explicitamente autorizado e publica apenas hashes estruturais.
# Desde o PR #695 (2026-09-25), migrations sem contrato dedicado caem no
# contrato generico (scripts/db-audit/generic-migration-runtime.sql), que
# prova apenas que o schema public nao mudou entre dry-run e apply. Para
# aplicar, o operador confirma o hash integral do dry-run; o workflow consulta
# o runtime novamente para fechar a janela TOCTOU.
#
# ROTA ATUAL (decisao de 2026-09-26, ver CLAUDE.md secao "Decisoes de
# 2026-09-26"): com varias sessoes paralelas trabalhando, o DDL do dia a dia
# vai por MCP (db_query) + registro no ledger no MESMO turno — este workflow
# pausa em "Waiting" no environment producao-ddl ate aprovacao humana, e
# nesse intervalo o arquivo ja mergeado passa a ser drift (e exatamente o que
# o db-live-guard.yml acusa). Este workflow continua sendo mais seguro no
# papel (dry-run + hash + aprovacao) e serve como rota formal/auditavel
# quando NAO houver pressa (ou quando Joaquim decidir voltar a exigi-la) —
# nao e codigo morto, mas hoje nao e o caminho padrao. Antes de disparar,
# confirme que nao ha outro run deste workflow em waiting/queued (regra
# operacional; nao ha lock automatico no proprio workflow).
# ==================================================================

name: DB Migrate (production)

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: 'Versao exata, com 14 digitos (ex: 20260830170000).'
        required: true
        type: string
      confirm_project_ref:
        description: 'Digite o project-ref oficial para confirmar o destino.'
        required: true
        type: string
      apply:
        description: 'Desmarcado = dry-run; marcado = aplicar o alvo ou bundle autorizado.'
        required: true
        default: false
        type: boolean
      confirm_runtime_sha256:
        description: 'Para apply: SHA-256 completo exibido pelo dry-run anterior.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'
  OFFICIAL_PROJECT_REF: 'tnnnlkbymytvtqngbbqh'

jobs:
  migrate:
    name: Migration oficial com preflight
    # Aprovacao humana obrigatoria antes de qualquer DDL tocar producao. Soma-se
    # ao dry-run + confirmacao de hash; nao substitui nenhum dos dois.
    environment: producao-ddl
    runs-on: ubuntu-24.04
    # E66 (auditoria de 01/10/2026): 25 min nao cobriam preflight + dry-run +
    # apply + as validacoes de ledger/runtime do file completo.
    timeout-minutes: 45
    steps:
      - name: ✋ Somente executa na main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só pode ser disparado a partir da main (ref: ${{ github.ref }})."
          exit 1

      # E47 (auditoria de GitHub Actions, 2026-09-26) — considerado e
      # descartado: um passo dentro do job para detectar outro run
      # waiting/queued nunca executaria de fato aqui. A concurrency (group:
      # db-migrate-production, cancel-in-progress: false) ja impede um 2o job
      # do mesmo grupo de rodar qualquer step enquanto o 1o estiver
      # waiting/in_progress — o 2o dispatch fica preso em "queued" pelo
      # proprio GitHub Actions ANTES de chegar a qualquer step, inclusive um
      # de deteccao. Os runs 36247549783 (waiting) e 36263608943
      # (queued/pending) em 26/09 foram exatamente isso: a concorrencia
      # funcionou como desenhada, so ninguem cancelou o 1o "Waiting" antigo
      # antes de disparar de novo. Mitigacao real: checar a aba Actions antes
      # de um novo dispatch; um "Waiting" que nao vai mais ser aprovado deve
      # ser cancelado, nao empilhado.
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provar checkout imutavel
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: bash scripts/ci/install-postgresql-client.sh

      - name: Provar identidade, TLS e validar confirmacoes
        env:
          DESTINO_URL_RAW: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$DESTINO_URL_RAW" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "::error::Project-ref de confirmacao incorreto."
            exit 1
          fi
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]{14}$'; then
            echo "::error::migration_version precisa ter exatamente 14 digitos."
            exit 1
          fi
          if [ "$APPLY" = "true" ] && ! printf '%s' "$CONFIRM_RUNTIME_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::Apply exige confirm_runtime_sha256 completo e lowercase."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            endurecerDestinoTls,
            validarDestino,
            validarSupabaseCa,
          } from './scripts/db-audit/database-identity.mjs';
          import { appendFileSync } from 'node:fs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL_RAW, identidade);
          erros.push(...validarSupabaseCa());
          const tls = endurecerDestinoTls(process.env.DESTINO_URL_RAW);
          erros.push(...tls.erros);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log(`::add-mask::${tls.connectionString}`);
          appendFileSync(process.env.GITHUB_ENV, `DESTINO_URL=${tls.connectionString}\n`);
          appendFileSync(process.env.GITHUB_ENV, 'PGSSLMODE=verify-full\n');
          console.log('OK: endpoint oficial, TLS verify-full e CA pinada.');
          NODE

      - name: Exigir alvo unico ou bundle atomico conhecido
        id: preflight
        # E66: repeticao SO de falha de conexao, e SO aqui -- este passo e somente
        # leitura (SELECT do ledger). O apply nunca define a variavel: repetir o
        # push seria reaplicar DDL.
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          PSQL_CONNECT_RETRIES: '2'
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY: ${{ inputs.apply }}
        run: |
          umask 077
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -printf '%f\n' | cut -c1-14 | sort -u > /tmp/local-versions
          node scripts/db-audit/psql-safe.mjs -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/remote-versions
          comm -13 /tmp/local-versions /tmp/remote-versions > /tmp/remote-only-versions
          REMOTE_ONLY_COUNT=$(wc -l < /tmp/remote-only-versions | tr -d ' ')
          if [ "$REMOTE_ONLY_COUNT" != "0" ]; then
            echo "::error::O ledger remoto possui versions sem arquivo local; db push foi bloqueado antes do CLI."
            echo "remote_only_count=$REMOTE_ONLY_COUNT"
            exit 1
          fi
          comm -23 /tmp/local-versions /tmp/remote-versions > /tmp/missing-versions
          MISSING_COUNT=$(wc -l < /tmp/missing-versions | tr -d ' ')
          MISSING_VERSION=$(sed -n '1p' /tmp/missing-versions)
          ATOMIC_DELIVERY_BUNDLE=$'20260909250000\n20260909260000\n20260909270000'
          # Pacote do lote de 04-05/10/2026 (PR #1890): 8 migrations, alvo = a ultima versao. Autorizado pelo dono em 05/10.
          LOTE_0510_BUNDLE=$'20261003272707\n20261004172554\n20261004173439\n20261004181921\n20261004182245\n20261004185228\n20261004190606\n20261004195051'
          TALKX_RECOVERY_BUNDLE=$'20260911130000\n20260911140000\n20260911150000\n20260911160000\n20260911170000\n20260911180000\n20260911190000\n20260911200000\n20260912110000\n20260912120000\n20260912130000'
          if [ "$MISSING_COUNT" = "1" ] && [ "$MISSING_VERSION" = "$TARGET_VERSION" ]; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=false
          elif [ "$TARGET_VERSION" = "20260909270000" ] \
            && [ "$MISSING_COUNT" = "3" ] \
            && diff -u <(printf '%s\n' "$ATOMIC_DELIVERY_BUNDLE") /tmp/missing-versions; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=true
          elif [ "$TARGET_VERSION" = "20261004195051" ] \
            && [ "$MISSING_COUNT" = "8" ] \
            && diff -u <(printf '%s\n' "$LOTE_0510_BUNDLE") /tmp/missing-versions; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=true
          elif [ "$TARGET_VERSION" = "20260912130000" ] \
            && [ "$MISSING_COUNT" = "11" ] \
            && diff -u <(printf '%s\n' "$TALKX_RECOVERY_BUNDLE") /tmp/missing-versions; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=true
          elif [ "$MISSING_COUNT" = "0" ] && grep -Fxq "$TARGET_VERSION" /tmp/remote-versions; then
            NEEDS_APPLY=false
            APPLY_BUNDLE=false
          else
            echo "::error::O conjunto de versions ausentes nao corresponde exatamente ao alvo informado."
            echo "missing_count=$MISSING_COUNT"
            exit 1
          fi
          FILE_COUNT=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" != "1" ]; then
            echo "::error::A versao alvo precisa mapear para exatamente um arquivo local."
            exit 1
          fi
          TARGET_FILE=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" -printf '%f\n')
          TARGET_NAME=${TARGET_FILE#${TARGET_VERSION}_}
          TARGET_NAME=${TARGET_NAME%.sql}
          if [ "$APPLY" = "true" ] && [ "$NEEDS_APPLY" != "true" ]; then
            echo "::error::A migration alvo ja esta registrada; apply repetido foi bloqueado."
            exit 1
          fi
          echo "needs_apply=$NEEDS_APPLY" >> "$GITHUB_OUTPUT"
          echo "apply_bundle=$APPLY_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "target_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "OK: estado da migration alvo confirmado: version=$TARGET_VERSION needs_apply=$NEEDS_APPLY"

      - name: Provar paridade integral quando a versao ja existe
        if: steps.preflight.outputs.needs_apply == 'false'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Provar estado runtime antes do push
        id: runtime
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: ${{ inputs.apply }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          NEEDS_APPLY: ${{ steps.preflight.outputs.needs_apply }}
          APPLY_BUNDLE: ${{ steps.preflight.outputs.apply_bundle }}
        run: |
          # E62 (auditoria de 01/10/2026): os 12 contratos de runtime sairam daqui para
          # scripts/db-audit/contracts/<versao>.sql, executados pelo runner generico abaixo.
          # A equivalencia e textual: o arquivo e o braco de origem tem o mesmo sha256
          # (docs/audits/evidence/db-migrate-contratos-historicos.md).
          # Fail-closed: versao sem contrato aborta com exit 2 -- nunca vira "nada a verificar".
          RUNTIME=$(node scripts/db-audit/run-runtime-contract.mjs "$TARGET_VERSION")
          printf '%s\n' "$RUNTIME"
          RUNTIME_JSON="$RUNTIME" node --input-type=module <<'NODE'
          const proof = JSON.parse(process.env.RUNTIME_JSON);
          const common = proof.server_major === 17
            && proof.database === 'postgres'
            && /^[a-f0-9]{64}$/.test(proof.runtime_sha256 || '');
          let targetOk = false;
          if (process.env.TARGET_VERSION === '20260830170000') {
            targetOk = proof.function_count === 1
              && proof.security_definer === true
              && proof.stable === true
              && proof.search_path_fixed === true
              && proof.filters_active === true;
          } else if (process.env.TARGET_VERSION === '20260831120000') {
            const base = proof.table_count === 1
              && proof.rls_enabled === true
              && proof.policy_count === 1
              && proof.service_role_crud === true;
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? base
                && proof.public_policy_count === 1
                && proof.service_role_policy_count === 0
                && proof.anon_acl === true
                && proof.authenticated_acl === true
              : base
                && proof.public_policy_count === 0
                && proof.service_role_policy_count === 1
                && proof.anon_acl === false
                && proof.authenticated_acl === false
                && proof.service_role_extra === false;
          } else if (process.env.TARGET_VERSION === '20260831150000') {
            targetOk = proof.source_count === 4
              && Number.isInteger(proof.legacy_signed_url_count)
              && proof.legacy_signed_url_count >= 0
              && (process.env.NEEDS_APPLY === 'true' || proof.legacy_signed_url_count === 0);
          } else if (process.env.TARGET_VERSION === '20260908180000') {
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? proof.table_count === 0
                && proof.rls_count === 0
                && proof.function_count === 0
                && proof.safe_function_count === 0
                && proof.trigger_count === 0
              : proof.table_count === 2
                && proof.rls_count === 2
                && proof.function_count === 6
                && proof.safe_function_count === 6
                && proof.trigger_count === 1;
          } else if (process.env.TARGET_VERSION === '20260908220000') {
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? proof.lease_column_count === 0
                && proof.new_complete_count === 0
                && proof.old_complete_count === 1
                && proof.new_fail_count === 0
                && proof.state_constraint_count === 0
              : proof.lease_column_count === 1
                && proof.new_complete_count === 1
                && proof.old_complete_count === 0
                && proof.new_fail_count === 1
                && proof.state_constraint_count === 3;
          } else if (process.env.TARGET_VERSION === '20260909120000') {
            const base = proof.table_count === 2
              && proof.constraint_count === 5
              && proof.flag_enabled === false;
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? base
                && proof.function_count === 0
                && proof.flag_count === 0
              : base
                && proof.validated_constraint_count === 5
                && proof.function_count === 3
                && proof.safe_function_count === 3
                && proof.flag_count === 1;
          } else if (process.env.TARGET_VERSION === '20260909180000') {
            const base = proof.relation_count === 1
              && Number.isInteger(proof.legacy_token_count)
              && proof.legacy_token_count >= 0
              && proof.legacy_token_count <= 1;
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? base
                && proof.constraint_count === 0
                && proof.validated_constraint_count === 0
              : base
                && proof.legacy_token_count === 0
                && proof.constraint_count === 1
                && proof.validated_constraint_count === 1;
          } else if (process.env.TARGET_VERSION === '20260909200000') {
            const base = proof.note_table_count === 1
              && proof.function_count === 4
              && proof.note_rls_enabled === true
              && Number.isInteger(proof.policy_count)
              && proof.policy_count >= 0;
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? base
              : base
                && proof.safe_function_count === 4
                && proof.definition_sha256 === '55078d2e365413bea0b93777ec63e70063def445760d0ae8f516670b86070771'
                && proof.caller_bound_count === 3
                && proof.rpc_authorized_count === 1
                && proof.policy_count === 4
                && proof.policy_signature_count === 4
                && proof.identity_trigger_count === 1
                && proof.authenticated_api_execute_count === 4
                && proof.anon_api_execute_count === 0
                && proof.guard_authenticated_execute === false
                && proof.guard_anon_execute === false
                && proof.anon_note_access === false
                && proof.authenticated_note_crud === true
                && proof.authenticated_note_extra === false
                && proof.service_note_crud === true
                && proof.service_note_extra === false;
          } else if (process.env.TARGET_VERSION === '20260909210000') {
            const base = proof.table_count === 1
              && proof.variant_table_count === 1
              && proof.custom_variables_column_count === 1
              && proof.invalid_live_template_count === 0
              && proof.invalid_variant_count === 0
              && proof.variant_rls_enabled === true
              && proof.recipient_variant_fk_count === 1
              && proof.rls_enabled === true;
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? base
                && (
                  (proof.variant_policy_count === 2
                   && proof.variant_legacy_write_policy_count === 1
                   && proof.variant_canonical_policy_signature_count === 0
                   && proof.variant_validated_constraint_count === 0)
                  ||
                  (proof.variant_policy_count === 4
                   && proof.variant_legacy_write_policy_count === 0
                   && proof.variant_canonical_policy_signature_count === 4
                   && proof.variant_validated_constraint_count === 3
                   && proof.variant_anon_any_access === false
                   && proof.variant_authenticated_crud === true
                   && proof.variant_authenticated_extra_access === false
                   && proof.variant_service_role_crud === true
                   && proof.variant_service_role_extra_access === false)
                )
                && [0, 1].includes(proof.history_description_column_count)
                && [1, 2].includes(proof.policy_count)
                && [3, 4].includes(proof.foundation_constraint_count)
                && proof.function_count === 0
                && proof.safe_function_count === 0
                && proof.constraint_count === 0
                && proof.immutable_trigger_count === 0
                && proof.template_update_guard_count === 0
                && proof.template_validation_trigger_count === 0
                && proof.template_timestamp_trigger_count === 0
                && proof.anon_any_access === true
                && proof.authenticated_select === true
                && proof.authenticated_any_mutation === true
                && proof.authenticated_rpc_execute === false
                && proof.authenticated_internal_function_execute_count === 0
              : base
                && proof.variant_policy_count === 4
                && proof.variant_legacy_write_policy_count === 0
                && proof.variant_canonical_policy_signature_count === 4
                && proof.variant_validated_constraint_count === 3
                && proof.variant_anon_any_access === false
                && proof.variant_authenticated_crud === true
                && proof.variant_authenticated_extra_access === false
                && proof.variant_service_role_crud === true
                && proof.variant_service_role_extra_access === false
                && proof.history_description_column_count === 1
                && proof.policy_count === 1
                && proof.foundation_constraint_count === 4
                && proof.canonical_select_policy_count === 1
                && proof.constraint_count === 3
                && proof.validated_constraint_count === 3
                && proof.function_count === 6
                && proof.safe_function_count === 6
                && proof.definition_sha256 === '079e2bd466e89e58251c7d14596453256cade54b9f0eddd4ce6df86ae751c2be'
                && proof.immutable_trigger_count === 1
                && proof.template_update_guard_count === 1
                && proof.template_validation_trigger_count === 1
                && proof.template_timestamp_trigger_count === 1
                && proof.anon_any_access === false
                && proof.authenticated_select === true
                && proof.authenticated_any_mutation === false
                && proof.history_service_role_crud === true
                && proof.history_service_role_extra_access === false
                && proof.authenticated_rpc_execute === true
                && proof.anon_rpc_execute === false
                && proof.authenticated_counter_execute === true
                && proof.anon_counter_execute === false
                && proof.authenticated_guard_execute === false
                && proof.authenticated_update_guard_execute === false
                && proof.authenticated_internal_function_execute_count === 0;
          } else if (process.env.TARGET_VERSION === '20260909220000') {
            const absent = proof.message_column_count === 0
              && proof.closure_column_count === 0
              && proof.event_column_count === 0
              && proof.column_contract_count === 0
              && proof.validated_constraint_count === 0
              && proof.index_count === 0
              && proof.function_count === 0
              && proof.safe_api_function_count === 0
              && proof.internal_guard_function_count === 0
              && proof.internal_guard_trigger_count === 0
              && proof.trusted_owner_function_count === 0
              && proof.function_name_collision_count === 0
              && proof.trigger_name_collision_count === 0
              && proof.constraint_name_collision_count === 0
              && proof.service_role_inherits_authenticated === false
              && proof.authenticated_enqueue_effective === false
              && proof.authenticated_enqueue_direct === false
              && proof.authenticated_close_effective === false
              && proof.authenticated_close_direct === false
              && proof.service_enqueue_effective === false
              && proof.service_enqueue_direct === false
              && proof.service_close_effective === false
              && proof.service_close_direct === false
              && proof.authenticated_privileged_delivery === false
              && proof.authenticated_internal_guard_execute === false
              && proof.service_internal_guard_execute === false
              && proof.service_internal_guard_direct_count === 0
              && proof.anon_any_execute === false
              && proof.service_delivery_effective_count === 0
              && proof.service_delivery_direct_count === 0
              && proof.custom_guc_reference_count === 0;
            const applied = proof.message_column_count === 7
              && proof.closure_column_count === 1
              && proof.event_column_count === 1
              && proof.column_contract_count === 9
              && proof.validated_constraint_count === 4
              && proof.index_count === 4
              && proof.function_count === 8
              && proof.safe_api_function_count === 5
              && proof.internal_guard_function_count === 3
              && proof.internal_guard_trigger_count === 3
              && proof.trusted_owner_function_count === 8
              && proof.function_name_collision_count === 0
              && proof.trigger_name_collision_count === 0
              && proof.constraint_name_collision_count === 0
              && proof.definition_sha256 === '60eb2a557b53775727d57bd7e74ee2497e69d105ab1a7dc1c20eef5cefff7883'
              && proof.constraint_definition_sha256 === '3a7b8480becb1fc422677195037169803648f8041c0f64515d3b9e885b2dad55'
              && proof.index_definition_sha256 === '1df306fd2981d1ee83aab373764a87cefdcfd474ac0e3b2023bedd9be046e976'
              && proof.trigger_definition_sha256 === '66ea750c2101611aac2a3eaf9de8e08ef01df4fe9fc1975791f35dafe1c83498'
              && proof.service_role_inherits_authenticated === false
              && proof.authenticated_enqueue_effective === true
              && proof.authenticated_enqueue_direct === true
              && proof.authenticated_close_effective === true
              && proof.authenticated_close_direct === true
              && proof.service_enqueue_effective === false
              && proof.service_enqueue_direct === false
              && proof.service_close_effective === true
              && proof.service_close_direct === true
