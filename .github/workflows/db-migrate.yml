# docs:
#   gatilho: dispatch na main, com o apply gateado por environment
#   prova: dry-run obrigatorio e apply com hash estrutural da migration
#   falha: nada e aplicado; o dry-run precisa passar antes
#   avisa: operador que disparou e a issue de ops
# ==================================================================
# ZAPP-WEB · Migration controlada do banco oficial
# ==================================================================
# Executa somente por workflow_dispatch na main. O dry-run e obrigatorio
# antes de uma aplicacao: ele comprova o destino, exige uma migration local
# ou um bundle explicitamente autorizado e publica apenas hashes estruturais.
# Desde o PR #695 (2026-09-25), migrations sem contrato dedicado caem no
# contrato generico (scripts/db-audit/generic-migration-runtime.sql), que
# prova apenas que o schema public nao mudou entre dry-run e apply. Para
# aplicar, o operador confirma o hash integral do dry-run; o workflow consulta
# o runtime novamente para fechar a janela TOCTOU.
#
# GA13 (2026-10-19): os dois jobs originais (preflight + apply embutidos num
# job unico gateado por producao-ddl) foram separados:
#   preflight — sem environment gate; roda checkout, identidade, ledger,
#               runtime e dry-run; o operador ve o output ANTES de aprovar.
#   apply     — environment: producao-ddl; re-valida identidade e runtime
#               (fechamento TOCTOU) e entao aplica.
# Prerequisito: DESTINO_URL deve ser secret de repositorio (alem de estar
# em producao-ddl), pois o job preflight nao herda segredos de environment.
#
# ROTA ATUAL (decisao de 2026-09-26, ver CLAUDE.md secao "Decisoes de
# 2026-09-26"): com varias sessoes paralelas trabalhando, o DDL do dia a dia
# vai por MCP (db_query) + registro no ledger no MESMO turno — este workflow
# pausa em "Waiting" no environment producao-ddl ate aprovacao humana, e
# nesse intervalo o arquivo ja mergeado passa a ser drift (e exatamente o que
# o db-live-guard.yml acusa). Este workflow continua sendo mais seguro no
# papel (dry-run + hash + aprovacao) e serve como rota formal/auditavel
# quando NAO houver pressa (ou quando Joaquim decidir voltar a exigi-la) —
# nao e codigo morto, mas hoje nao e o caminho padrao. Antes de disparar,
# confirme que nao ha outro run deste workflow em waiting/queued (regra
# operacional; nao ha lock automatico no proprio workflow).
# ==================================================================

name: DB Migrate (production)

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: 'Versao exata, com 14 digitos (ex: 20260830170000). Obrigatorio quando apply_all_missing=false.'
        required: false
        default: ''
        type: string
      apply_all_missing:
        description: 'Marcado = aplica todas as versions locais ausentes do ledger, em ordem (GA14).'
        required: false
        default: false
        type: boolean
      confirm_apply_all_sha256:
        description: 'Para apply com apply_all_missing: sha256 da lista de versions + sha256 de cada arquivo + github.sha, exibido pelo dry-run.'
        required: false
        default: ''
        type: string
      confirm_project_ref:
        description: 'Digite o project-ref oficial para confirmar o destino.'
        required: true
        type: string
      apply:
        description: 'Desmarcado = dry-run; marcado = aplicar o alvo ou bundle autorizado.'
        required: true
        default: false
        type: boolean
      confirm_runtime_sha256:
        description: 'Para apply: SHA-256 completo exibido pelo dry-run anterior.'
        required: false
        default: ''
        type: string
      allow_destructive:
        description: 'GA17: marcado = permite migration com DROP/REVOKE/TRUNCATE/DELETE/ALTER...DROP. Padrao: bloqueado.'
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'
  OFFICIAL_PROJECT_REF: 'tnnnlkbymytvtqngbbqh'

jobs:
  preflight:
    name: Preflight e dry-run
    # GA13: sem environment gate — o operador ve o output do dry-run ANTES
    # de aprovar o apply. Requer DESTINO_URL como secret de repositorio.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      needs_apply: ${{ steps.preflight.outputs.needs_apply }}
      apply_bundle: ${{ steps.preflight.outputs.apply_bundle }}
      target_name: ${{ steps.preflight.outputs.target_name }}
      apply_all_sha256: ${{ steps.preflight.outputs.apply_all_sha256 }}
      missing_versions: ${{ steps.preflight.outputs.missing_versions }}
      destino_url_hardened: ${{ steps.preflight.outputs.destino_url_hardened }}
    steps:
      - name: ✋ Somente executa na main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só pode ser disparado a partir da main (ref: ${{ github.ref }})."
          exit 1

      # E47 (auditoria de GitHub Actions, 2026-09-26) — considerado e
      # descartado: um passo dentro do job para detectar outro run
      # waiting/queued nunca executaria de fato aqui. A concurrency (group:
      # db-migrate-production, cancel-in-progress: false) ja impede um 2o job
      # do mesmo grupo de rodar qualquer step enquanto o 1o estiver
      # waiting/in_progress — o 2o dispatch fica preso em "queued" pelo
      # proprio GitHub Actions ANTES de chegar a qualquer step, inclusive um
      # de deteccao. Os runs 36247549783 (waiting) e 36263608943
      # (queued/pending) em 26/09 foram exatamente isso: a concorrencia
      # funcionou como desenhada, so ninguem cancelou o 1o "Waiting" antigo
      # antes de disparar de novo. Mitigacao real: checar a aba Actions antes
      # de um novo dispatch; um "Waiting" que nao vai mais ser aprovado deve
      # ser cancelado, nao empilhado.
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provar checkout imutavel
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: bash scripts/ci/install-postgresql-client.sh

      - name: Provar identidade, TLS e validar confirmacoes
        env:
          DESTINO_URL_RAW: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          CONFIRM_APPLY_ALL_SHA256: ${{ inputs.confirm_apply_all_sha256 }}
          APPLY: ${{ inputs.apply }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
        run: |
          if [ -z "$DESTINO_URL_RAW" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "::error::Project-ref de confirmacao incorreto."
            exit 1
          fi
          # GA14: migration_version obrigatorio apenas quando apply_all_missing=false
          if [ "$APPLY_ALL_MISSING" != "true" ]; then
            if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]{14}$'; then
              echo "::error::migration_version precisa ter exatamente 14 digitos quando apply_all_missing=false."
              exit 1
            fi
          fi
          if [ "$APPLY" = "true" ]; then
            if [ "$APPLY_ALL_MISSING" = "true" ]; then
              if ! printf '%s' "$CONFIRM_APPLY_ALL_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
                echo "::error::Apply com apply_all_missing exige confirm_apply_all_sha256 completo e lowercase."
                exit 1
              fi
            else
              if ! printf '%s' "$CONFIRM_RUNTIME_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
                echo "::error::Apply exige confirm_runtime_sha256 completo e lowercase."
                exit 1
              fi
            fi
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            endurecerDestinoTls,
            validarDestino,
            validarSupabaseCa,
          } from './scripts/db-audit/database-identity.mjs';
          import { appendFileSync } from 'node:fs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL_RAW, identidade);
          erros.push(...validarSupabaseCa());
          const tls = endurecerDestinoTls(process.env.DESTINO_URL_RAW);
          erros.push(...tls.erros);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log(`::add-mask::${tls.connectionString}`);
          appendFileSync(process.env.GITHUB_ENV, `DESTINO_URL=${tls.connectionString}\n`);
          // R2-INF-003: o CLI do Supabase le SUPABASE_DB_URL, que nao entra na
          // lista de PG* tratada pelo withPsqlEnvironment. O `env:` dos passos
          // redeclarava DESTINO_URL a partir do secret bruto e sobrescrevia o
          // DSN endurecido do GITHUB_ENV; agora o mesmo DSN endurecido (ja
          // mascarado) sai no GITHUB_ENV tambem como SUPABASE_DB_URL.
          appendFileSync(process.env.GITHUB_ENV, `SUPABASE_DB_URL=${tls.connectionString}\n`);
          appendFileSync(process.env.GITHUB_ENV, 'PGSSLMODE=verify-full\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `destino_url_hardened=${tls.connectionString}\n`);
          console.log('OK: endpoint oficial, TLS verify-full e CA pinada.');
          NODE

      - name: Exigir alvo unico ou apply_all_missing autorizado
        id: preflight
        # E66: repeticao SO de falha de conexao, e SO aqui -- este passo e somente
        # leitura (SELECT do ledger). O apply nunca define a variavel: repetir o
        # push seria reaplicar DDL.
        # GA14: remove os 3 bundles fixos; apply_all_missing aceita qualquer lote.
        env:
          PSQL_CONNECT_RETRIES: '2'
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY: ${{ inputs.apply }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
        run: |
          umask 077
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -printf '%f\n' | cut -c1-14 | sort -u > /tmp/local-versions
          node scripts/db-audit/psql-safe.mjs -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/remote-versions
          comm -13 /tmp/local-versions /tmp/remote-versions > /tmp/remote-only-versions
          REMOTE_ONLY_COUNT=$(wc -l < /tmp/remote-only-versions | tr -d ' ')
          if [ "$REMOTE_ONLY_COUNT" != "0" ]; then
            echo "::error::O ledger remoto possui versions sem arquivo local; db push foi bloqueado antes do CLI."
            echo "remote_only_count=$REMOTE_ONLY_COUNT"
            exit 1
          fi
          comm -23 /tmp/local-versions /tmp/remote-versions > /tmp/missing-versions
          MISSING_COUNT=$(wc -l < /tmp/missing-versions | tr -d ' ')
          # GA14: modo apply_all_missing — aplica todas as versions ausentes em ordem
          if [ "$APPLY_ALL_MISSING" = "true" ]; then
            if [ "$MISSING_COUNT" = "0" ]; then
              echo "needs_apply=false" >> "$GITHUB_OUTPUT"
              echo "apply_bundle=false" >> "$GITHUB_OUTPUT"
              echo "target_name=all-missing-none" >> "$GITHUB_OUTPUT"
              echo "apply_all_sha256=" >> "$GITHUB_OUTPUT"
              echo "missing_versions=" >> "$GITHUB_OUTPUT"
              echo "OK: apply_all_missing=true mas nenhuma migration pendente."
              exit 0
            fi
            # Hash composto: github.sha + version:sha256(arquivo) para cada version em ordem
            HASH_PARTS="$GITHUB_SHA"
            while IFS= read -r v; do
              MATCH=$(find supabase/migrations -maxdepth 1 -type f -name "${v}_*.sql" | head -1)
              if [ -z "$MATCH" ]; then
                echo "::error::Version $v ausente como arquivo .sql em supabase/migrations/"
                exit 1
              fi
              FILE_SHA=$(sha256sum "$MATCH" | cut -d' ' -f1)
              HASH_PARTS="$HASH_PARTS $v:$FILE_SHA"
            done < /tmp/missing-versions
            APPLY_ALL_SHA256=$(printf '%s' "$HASH_PARTS" | sha256sum | cut -d' ' -f1)
            MISSING_VERSIONS_SPACE=$(tr '\n' ' ' < /tmp/missing-versions | sed 's/ $//')
            echo "needs_apply=true" >> "$GITHUB_OUTPUT"
            echo "apply_bundle=false" >> "$GITHUB_OUTPUT"
            echo "target_name=all-missing-${MISSING_COUNT}" >> "$GITHUB_OUTPUT"
            echo "apply_all_sha256=$APPLY_ALL_SHA256" >> "$GITHUB_OUTPUT"
            echo "missing_versions=$MISSING_VERSIONS_SPACE" >> "$GITHUB_OUTPUT"
            echo "OK: apply_all_missing — $MISSING_COUNT versions ausentes; sha256=$APPLY_ALL_SHA256"
            exit 0
          fi
          # Modo alvo unico (apply_all_missing=false)
          MISSING_VERSION=$(sed -n '1p' /tmp/missing-versions)
          if [ "$MISSING_COUNT" = "1" ] && [ "$MISSING_VERSION" = "$TARGET_VERSION" ]; then
            NEEDS_APPLY=true
          elif [ "$MISSING_COUNT" = "0" ] && grep -Fxq "$TARGET_VERSION" /tmp/remote-versions; then
            NEEDS_APPLY=false
          else
            echo "::error::O conjunto de versions ausentes nao corresponde exatamente ao alvo informado."
            echo "missing_count=$MISSING_COUNT"
            exit 1
          fi
          FILE_COUNT=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" != "1" ]; then
            echo "::error::A versao alvo precisa mapear para exatamente um arquivo local."
            exit 1
          fi
          TARGET_FILE=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" -printf '%f\n')
          TARGET_NAME=${TARGET_FILE#${TARGET_VERSION}_}
          TARGET_NAME=${TARGET_NAME%.sql}
          if [ "$APPLY" = "true" ] && [ "$NEEDS_APPLY" != "true" ]; then
            echo "::error::A migration alvo ja esta registrada; apply repetido foi bloqueado."
            exit 1
          fi
          echo "needs_apply=$NEEDS_APPLY" >> "$GITHUB_OUTPUT"
          echo "apply_bundle=false" >> "$GITHUB_OUTPUT"
          echo "target_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "apply_all_sha256=" >> "$GITHUB_OUTPUT"
          echo "missing_versions=" >> "$GITHUB_OUTPUT"
          echo "OK: estado da migration alvo confirmado: version=$TARGET_VERSION needs_apply=$NEEDS_APPLY"

      - name: Gate de migration destrutiva (GA17)
        # GA17: bloqueia DROP/REVOKE/TRUNCATE/DELETE/ALTER...DROP sem confirmacao.
        # Para migrations destrutivas, marcar allow_destructive=true no dispatch.
        if: steps.preflight.outputs.needs_apply == 'true'
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
          MISSING_VERSIONS: ${{ steps.preflight.outputs.missing_versions }}
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
        run: |
          if [ "$APPLY_ALL_MISSING" = "true" ]; then
            FILES=$(for v in $MISSING_VERSIONS; do
              find supabase/migrations -maxdepth 1 -type f -name "${v}_*.sql"
            done)
          else
            FILES=$(find supabase/migrations -maxdepth 1 -type f -name "${TARGET_VERSION}_*.sql")
          fi
          DESTRUCTIVE=$(grep -ihEn \
            '^\s*(DROP|REVOKE|TRUNCATE)\s|^\s*DELETE\s+FROM\s|ALTER\s+.*\s+DROP\s' \
            $FILES 2>/dev/null || true)
          if [ -n "$DESTRUCTIVE" ]; then
            if [ "$ALLOW_DESTRUCTIVE" != "true" ]; then
              echo "::error::GA17: migration contem DDL destrutivo. Releia o CLAUDE.md (regra 6) e"
              echo "::error::dispatch novamente com allow_destructive=true somente se o deploy do codigo"
              echo "::error::compativel ja estiver em producao."
              printf '%s\n' "$DESTRUCTIVE"
              exit 1
            fi
            echo "::warning::GA17: migration destrutiva aprovada por allow_destructive=true:"
            printf '%s\n' "$DESTRUCTIVE"
          fi

      - name: Provar paridade integral quando a versao ja existe
        if: steps.preflight.outputs.needs_apply == 'false'
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Provar estado runtime antes do push
        id: runtime
        env:
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: ${{ inputs.apply }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          NEEDS_APPLY: ${{ steps.preflight.outputs.needs_apply }}
          APPLY_BUNDLE: ${{ steps.preflight.outputs.apply_bundle }}
        run: |
          # E62 (auditoria de 01/10/2026): os 12 contratos de runtime sairam daqui para
          # scripts/db-audit/contracts/<versao>.sql, executados pelo runner generico abaixo.
          # A equivalencia e textual: o arquivo e o braco de origem tem o mesmo sha256
          # (docs/audits/evidence/db-migrate-contratos-historicos.md).
          # Fail-closed: versao sem contrato aborta com exit 2 -- nunca vira "nada a verificar".
          RUNTIME=$(node scripts/db-audit/run-runtime-contract.mjs "$TARGET_VERSION")
          printf '%s\n' "$RUNTIME"
          RUNTIME_JSON="$RUNTIME" node scripts/db-audit/validate-runtime-proof.mjs

      - name: Dry-run oficial do Supabase CLI
        if: steps.preflight.outputs.needs_apply == 'true'
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
          MISSING_VERSIONS: ${{ steps.preflight.outputs.missing_versions }}
          APPLY_ALL_SHA256: ${{ steps.preflight.outputs.apply_all_sha256 }}
        run: |
          set -euo pipefail
          supabase db push --include-all --skip-vault --dry-run --yes 2>&1 | tee dry-run.out
          if [ "$APPLY_ALL_MISSING" = "true" ]; then
            # GA14: valida todas as versions ausentes via avaliarPlanoDoDryRunApplyAll
            printf '%s\n' $MISSING_VERSIONS > /tmp/apply-all-expected.txt
            node scripts/db-audit/dry-run-plan.mjs --arquivo dry-run.out --apply-all /tmp/apply-all-expected.txt
            echo "::notice::apply_all_missing sha256 para confirmar no apply: $APPLY_ALL_SHA256"
          else
            node scripts/db-audit/dry-run-plan.mjs --arquivo dry-run.out --esperado "$TARGET_VERSION"
          fi

  apply:
    name: Apply com aprovacao humana
    needs: preflight
    # GA13: somente o apply e gateado por environment. O operador ja viu o
    # output do dry-run no job preflight antes de clicar "Approve" aqui.
    # Se apply=false (dry-run apenas), este job nao roda.
    if: inputs.apply == true && needs.preflight.outputs.needs_apply == 'true'
    environment: producao-ddl
    runs-on: ubuntu-24.04
    # E66: 45 min originais eram para um job unico. Com o split, 20 min
    # cobrem setup + re-validacao + apply + pos-apply do job de apply.
    timeout-minutes: 20
    permissions:
      contents: read
      # GA15: disparo de types-sync e db-live-guard apos apply bem-sucedido.
      actions: write
      # GA25: registrar Deployment de apply em producao-ddl para rastreabilidade de DDL.
      deployments: write
    steps:
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provar checkout imutavel
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: bash scripts/ci/install-postgresql-client.sh

      - name: Re-provar identidade e TLS (fechamento TOCTOU)
        # GA13: re-valida no job de apply para fechar a janela entre dry-run e
        # apply — o operador aprova apos ver o dry-run, mas pode haver mudanca
        # de ambiente entre os dois jobs. Esta re-validacao usa o DESTINO_URL
        # do environment producao-ddl (overlay sobre o secret de repositorio).
        # GA14: quando apply_all_missing=true, valida confirm_apply_all_sha256.
        env:
          DESTINO_URL_RAW: ${{ needs.preflight.outputs.destino_url_hardened }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          CONFIRM_APPLY_ALL_SHA256: ${{ inputs.confirm_apply_all_sha256 }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
          EXPECTED_APPLY_ALL_SHA256: ${{ needs.preflight.outputs.apply_all_sha256 }}
        run: |
          if [ -z "$DESTINO_URL_RAW" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "::error::Project-ref de confirmacao incorreto."
            exit 1
          fi
          if [ "$APPLY_ALL_MISSING" = "true" ]; then
            # GA14: fechar TOCTOU para apply_all — operator confirmou o hash; re-comparar
            if ! printf '%s' "$CONFIRM_APPLY_ALL_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "::error::confirm_apply_all_sha256 ausente ou invalido no job de apply."
              exit 1
            fi
            if [ "$CONFIRM_APPLY_ALL_SHA256" != "$EXPECTED_APPLY_ALL_SHA256" ]; then
              echo "::error::confirm_apply_all_sha256 nao corresponde ao sha256 calculado no preflight."
              exit 1
            fi
          else
            if ! printf '%s' "$CONFIRM_RUNTIME_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "::error::confirm_runtime_sha256 ausente ou invalido no job de apply."
              exit 1
            fi
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            endurecerDestinoTls,
            validarDestino,
            validarSupabaseCa,
          } from './scripts/db-audit/database-identity.mjs';
          import { appendFileSync } from 'node:fs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL_RAW, identidade);
          erros.push(...validarSupabaseCa());
          const tls = endurecerDestinoTls(process.env.DESTINO_URL_RAW);
          erros.push(...tls.erros);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log(`::add-mask::${tls.connectionString}`);
          appendFileSync(process.env.GITHUB_ENV, `DESTINO_URL=${tls.connectionString}\n`);
          appendFileSync(process.env.GITHUB_ENV, `SUPABASE_DB_URL=${tls.connectionString}\n`);
          appendFileSync(process.env.GITHUB_ENV, 'PGSSLMODE=verify-full\n');
          console.log('OK: re-validacao TOCTOU — endpoint oficial, TLS verify-full e CA pinada.');
          NODE

      - name: Re-provar estado runtime (confirmar hash do dry-run)
        env:
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: 'true'
          TARGET_VERSION: ${{ inputs.migration_version }}
          NEEDS_APPLY: 'true'
          APPLY_BUNDLE: ${{ needs.preflight.outputs.apply_bundle }}
        run: |
          RUNTIME=$(node scripts/db-audit/run-runtime-contract.mjs "$TARGET_VERSION")
          printf '%s\n' "$RUNTIME"
          RUNTIME_JSON="$RUNTIME" node scripts/db-audit/validate-runtime-proof.mjs

      - name: Aplicar alvo unico ou bundle ordenado autorizado
        run: >-
          supabase db push --include-all
          --skip-vault --yes

      - name: Registrar Deployment de apply no GitHub (GA25)
        # GA25: registra um Deployment 'producao-ddl' por version aplicada.
        # O guarda vivo (db-live-guard.yml step ddl-sem-deployment) cruza o
        # ledger com esses Deployments para detectar DDL aplicado fora do fluxo.
        # continue-on-error: passo de observabilidade — nao bloquear o apply.
        continue-on-error: true
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
          MISSING_VERSIONS: ${{ needs.preflight.outputs.missing_versions }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/db-migrate/register-deployments.mjs

      - name: Validar pos-apply
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          TARGET_NAME: ${{ needs.preflight.outputs.target_name }}
        run: node scripts/db-audit/validate-post-apply.mjs

      - name: Provar paridade integral apos aplicacao
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Disparar types-sync e contrato vivo pos-apply
        # GA15: dispara types-sync (regenera tipos TypeScript) e db-live-guard
        # (verifica paridade banco-codigo) apos apply bem-sucedido.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run types-sync.yml --ref main
          gh workflow run db-live-guard.yml --ref main
          echo "OK: disparado types-sync e db-live-guard via workflow_dispatch."
