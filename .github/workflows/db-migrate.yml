# ==================================================================
# ZAPP-WEB · Migration controlada do banco oficial
# ==================================================================
# Executa somente por workflow_dispatch na main. O dry-run e obrigatorio
# antes de uma aplicacao: ele comprova o destino, exige que exista exatamente
# uma migration local ausente e publica apenas hashes estruturais seguros.
# Somente alvos com contrato runtime explicito neste arquivo sao aceitos. Para
# aplicar, o operador confirma o hash integral do dry-run; o workflow consulta
# o runtime novamente para fechar a janela TOCTOU.
# ==================================================================

name: DB Migrate (production)

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: 'Versao exata, com 14 digitos (ex: 20260830170000).'
        required: true
        type: string
      confirm_project_ref:
        description: 'Digite o project-ref oficial para confirmar o destino.'
        required: true
        type: string
      apply:
        description: 'Desmarcado = dry-run; marcado = aplicar a unica migration ausente.'
        required: true
        default: false
        type: boolean
      confirm_runtime_sha256:
        description: 'Para apply: SHA-256 completo exibido pelo dry-run anterior.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'
  OFFICIAL_PROJECT_REF: 'tnnnlkbymytvtqngbbqh'

jobs:
  migrate:
    name: Migration oficial com preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Provar identidade e validar confirmacoes
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$DESTINO_URL" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "::error::Project-ref de confirmacao incorreto."
            exit 1
          fi
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]{14}$'; then
            echo "::error::migration_version precisa ter exatamente 14 digitos."
            exit 1
          fi
          if [ "$APPLY" = "true" ] && ! printf '%s' "$CONFIRM_RUNTIME_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::Apply exige confirm_runtime_sha256 completo e lowercase."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            validarDestino,
          } from './scripts/db-audit/database-identity.mjs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL, identidade);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log('OK: destino oficial comprovado por fingerprint.');
          NODE

      - name: Exigir exatamente uma migration ausente
        id: preflight
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY: ${{ inputs.apply }}
        run: |
          umask 077
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -printf '%f\n' | cut -c1-14 | sort -u > /tmp/local-versions
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/remote-versions
          comm -23 /tmp/local-versions /tmp/remote-versions > /tmp/missing-versions
          MISSING_COUNT=$(wc -l < /tmp/missing-versions | tr -d ' ')
          MISSING_VERSION=$(sed -n '1p' /tmp/missing-versions)
          if [ "$MISSING_COUNT" = "1" ] && [ "$MISSING_VERSION" = "$TARGET_VERSION" ]; then
            NEEDS_APPLY=true
          elif [ "$MISSING_COUNT" = "0" ] && grep -Fxq "$TARGET_VERSION" /tmp/remote-versions; then
            NEEDS_APPLY=false
          else
            echo "::error::O conjunto de versions ausentes nao corresponde exatamente ao alvo informado."
            echo "missing_count=$MISSING_COUNT"
            exit 1
          fi
          FILE_COUNT=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" != "1" ]; then
            echo "::error::A versao alvo precisa mapear para exatamente um arquivo local."
            exit 1
          fi
          TARGET_FILE=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" -printf '%f\n')
          TARGET_NAME=${TARGET_FILE#${TARGET_VERSION}_}
          TARGET_NAME=${TARGET_NAME%.sql}
          if [ "$APPLY" = "true" ] && [ "$NEEDS_APPLY" != "true" ]; then
            echo "::error::A migration alvo ja esta registrada; apply repetido foi bloqueado."
            exit 1
          fi
          echo "needs_apply=$NEEDS_APPLY" >> "$GITHUB_OUTPUT"
          echo "target_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "OK: estado da migration alvo confirmado: version=$TARGET_VERSION needs_apply=$NEEDS_APPLY"

      - name: Provar paridade integral quando a versao ja existe
        if: steps.preflight.outputs.needs_apply == 'false'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Provar estado runtime antes do push
        id: runtime
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: ${{ inputs.apply }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          NEEDS_APPLY: ${{ steps.preflight.outputs.needs_apply }}
        run: |
          case "$TARGET_VERSION" in
            20260830170000)
              RUNTIME=$(psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
                WITH fn AS (
                  SELECT p.oid, p.prosecdef, p.provolatile, p.proconfig,
                         pg_get_functiondef(p.oid) AS body
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname='public' AND p.proname='get_team_profiles'
                    AND pg_get_function_identity_arguments(p.oid)=''
                )
                SELECT json_build_object(
                  'server_major', current_setting('server_version_num')::int / 10000,
                  'database', current_database(),
                  'function_count', count(*),
                  'security_definer', bool_and(prosecdef),
                  'stable', bool_and(provolatile='s'),
                  'search_path_fixed', bool_and('search_path=public' = ANY(proconfig)),
                  'filters_active', bool_and(position('where p.is_active = true' in lower(body)) > 0),
                  'runtime_sha256', min(encode(sha256(convert_to(body, 'UTF8')), 'hex'))
                )::text
                FROM fn;")
              ;;
            20260831120000)
              RUNTIME=$(psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
                WITH relation AS (
                  SELECT c.oid, c.relrowsecurity
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relname = 'webhook_failures'
                    AND c.relkind IN ('r', 'p')
                ), policy_state AS (
                  SELECT
                    count(*) AS policy_count,
                    count(*) FILTER (WHERE 0 = ANY(pol.polroles)) AS public_policy_count,
                    count(*) FILTER (
                      WHERE pol.polname = 'service_role_full'
                        AND pol.polroles = ARRAY['service_role'::regrole::oid]
                        AND pol.polcmd = '*'
                        AND pg_get_expr(pol.polqual, pol.polrelid) = 'true'
                        AND pg_get_expr(pol.polwithcheck, pol.polrelid) = 'true'
                    ) AS service_role_policy_count
                  FROM pg_policy pol
                  JOIN relation r ON r.oid = pol.polrelid
                ), payload AS (
                  SELECT jsonb_build_object(
                    'server_major', current_setting('server_version_num')::int / 10000,
                    'database', current_database(),
                    'table_count', (SELECT count(*) FROM relation),
                    'rls_enabled', COALESCE((SELECT bool_and(relrowsecurity) FROM relation), false),
                    'policy_count', (SELECT policy_count FROM policy_state),
                    'public_policy_count', (SELECT public_policy_count FROM policy_state),
                    'service_role_policy_count', (SELECT service_role_policy_count FROM policy_state),
                    'anon_acl', COALESCE((SELECT has_table_privilege('anon', oid, 'SELECT, INSERT, UPDATE, DELETE') FROM relation), false),
                    'authenticated_acl', COALESCE((SELECT has_table_privilege('authenticated', oid, 'SELECT, INSERT, UPDATE, DELETE') FROM relation), false),
                    'service_role_crud', COALESCE((SELECT
                      has_table_privilege('service_role', oid, 'SELECT')
                      AND has_table_privilege('service_role', oid, 'INSERT')
                      AND has_table_privilege('service_role', oid, 'UPDATE')
                      AND has_table_privilege('service_role', oid, 'DELETE')
                    FROM relation), false),
                    'service_role_extra', COALESCE((SELECT has_table_privilege(
                      'service_role', oid, 'TRUNCATE, REFERENCES, TRIGGER, MAINTAIN'
                    ) FROM relation), false)
                  ) AS value
                )
                SELECT (value || jsonb_build_object(
                  'runtime_sha256', encode(sha256(convert_to(value::text, 'UTF8')), 'hex')
                ))::text
                FROM payload;")
              ;;
            20260831150000)
              RUNTIME=$(psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
                WITH source_counts AS (
                  SELECT count(*) FILTER (WHERE media_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/') AS legacy_count
                  FROM public.messages
                  UNION ALL
                  SELECT count(*) FILTER (WHERE media_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/')
                  FROM public.scheduled_messages
                  UNION ALL
                  SELECT count(*) FILTER (WHERE media_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/')
                  FROM public.team_messages
                  UNION ALL
                  SELECT count(*) FILTER (WHERE file_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/')
                  FROM public.knowledge_base_files
                ), payload AS (
                  SELECT jsonb_build_object(
                    'server_major', current_setting('server_version_num')::int / 10000,
                    'database', current_database(),
                    'source_count', count(*),
                    'legacy_signed_url_count', sum(legacy_count)
                  ) AS value
                  FROM source_counts
                )
                SELECT (value || jsonb_build_object(
                  'runtime_sha256', encode(sha256(convert_to(value::text, 'UTF8')), 'hex')
                ))::text
                FROM payload;")
              ;;
            *)
              echo "::error::Migration sem contrato runtime permitido neste workflow."
              exit 1
              ;;
          esac
          printf '%s\n' "$RUNTIME"
          RUNTIME_JSON="$RUNTIME" node --input-type=module <<'NODE'
          const proof = JSON.parse(process.env.RUNTIME_JSON);
          const common = proof.server_major === 17
            && proof.database === 'postgres'
            && /^[a-f0-9]{64}$/.test(proof.runtime_sha256 || '');
          let targetOk = false;
          if (process.env.TARGET_VERSION === '20260830170000') {
            targetOk = proof.function_count === 1
              && proof.security_definer === true
              && proof.stable === true
              && proof.search_path_fixed === true
              && proof.filters_active === true;
          } else if (process.env.TARGET_VERSION === '20260831120000') {
            const base = proof.table_count === 1
              && proof.rls_enabled === true
              && proof.policy_count === 1
              && proof.service_role_crud === true;
            targetOk = process.env.NEEDS_APPLY === 'true'
              ? base
                && proof.public_policy_count === 1
                && proof.service_role_policy_count === 0
                && proof.anon_acl === true
                && proof.authenticated_acl === true
              : base
                && proof.public_policy_count === 0
                && proof.service_role_policy_count === 1
                && proof.anon_acl === false
                && proof.authenticated_acl === false
                && proof.service_role_extra === false;
          } else if (process.env.TARGET_VERSION === '20260831150000') {
            targetOk = proof.source_count === 4
              && Number.isInteger(proof.legacy_signed_url_count)
              && proof.legacy_signed_url_count >= 0
              && (process.env.NEEDS_APPLY === 'true' || proof.legacy_signed_url_count === 0);
          }
          const ok = common && targetOk;
          if (!ok) {
            console.error('Estado runtime inesperado; migration cancelada.');
            process.exit(1);
          }
          if (process.env.APPLY === 'true'
              && proof.runtime_sha256 !== process.env.CONFIRM_RUNTIME_SHA256) {
            console.error('SHA-256 runtime mudou desde o dry-run; migration cancelada.');
            process.exit(1);
          }
          NODE

      - name: Dry-run oficial do Supabase CLI
        if: steps.preflight.outputs.needs_apply == 'true'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: >-
          supabase db push --db-url "$DESTINO_URL" --include-all
          --skip-vault --dry-run --yes

      - name: Aplicar unica migration ausente
        if: inputs.apply == true && steps.preflight.outputs.needs_apply == 'true'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: >-
          supabase db push --db-url "$DESTINO_URL" --include-all
          --skip-vault --yes

      - name: Validar registro no ledger
        if: inputs.apply == true || steps.preflight.outputs.needs_apply == 'false'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          TARGET_NAME: ${{ steps.preflight.outputs.target_name }}
        run: |
          LEDGER_COUNT=$(psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 \
            -v target_version="$TARGET_VERSION" -v target_name="$TARGET_NAME" -At <<'SQL'
              SELECT count(*)
              FROM supabase_migrations.schema_migrations
              WHERE version = :'target_version'
                AND name = :'target_name';
          SQL
          )
          test "$LEDGER_COUNT" = "1"
          echo "OK: ledger possui exatamente version=$TARGET_VERSION name=$TARGET_NAME."

      - name: Validar comportamento de get_team_profiles
        if: >-
          (inputs.apply == true || steps.preflight.outputs.needs_apply == 'false')
          && inputs.migration_version == '20260830170000'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          RESULT=$(psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT json_build_object(
              'returned_inactive', (
                SELECT count(*) FROM public.get_team_profiles()
                WHERE is_active IS DISTINCT FROM true
              ),
              'filters_active', position(
                'where p.is_active = true' in lower(
                  pg_get_functiondef('public.get_team_profiles()'::regprocedure)
                )
              ) > 0
            )::text;")
          printf '%s\n' "$RESULT"
          RESULT_JSON="$RESULT" node --input-type=module <<'NODE'
          const proof = JSON.parse(process.env.RESULT_JSON);
          if (proof.returned_inactive !== 0 || proof.filters_active !== true) process.exit(1);
          NODE

      - name: Validar ACL de webhook_failures
        if: >-
          (inputs.apply == true || steps.preflight.outputs.needs_apply == 'false')
          && inputs.migration_version == '20260831120000'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: >-
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1
          -f scripts/db-audit/check-webhook-failures-acl.sql

      - name: Validar remocao de URLs assinadas persistidas
        if: >-
          (inputs.apply == true || steps.preflight.outputs.needs_apply == 'false')
          && inputs.migration_version == '20260831150000'
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          LEGACY_COUNT=$(psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At <<'SQL'
            SELECT sum(legacy_count)
            FROM (
              SELECT count(*) FILTER (WHERE media_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/') AS legacy_count FROM public.messages
              UNION ALL
              SELECT count(*) FILTER (WHERE media_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/') FROM public.scheduled_messages
              UNION ALL
              SELECT count(*) FILTER (WHERE media_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/') FROM public.team_messages
              UNION ALL
              SELECT count(*) FILTER (WHERE file_url ~ '/storage/v1/object/sign/(audio-messages|team-chat-files|whatsapp-media)/') FROM public.knowledge_base_files
            ) AS source_counts;
          SQL
          )
          test "$LEGACY_COUNT" = "0"
          echo "OK: nenhuma credencial temporaria de Storage permanece nas tabelas alvo."

      - name: Provar paridade integral apos aplicacao
        if: inputs.apply == true
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: node scripts/db-audit/check-migration-drift.mjs
