# docs:
#   gatilho: dispatch na main, com o job gateado por environment
#   prova: dry-run obrigatorio e apply com hash estrutural da migration
#   falha: nada e aplicado; o dry-run precisa passar antes
#   avisa: operador que disparou e a issue de ops
# ==================================================================
# ZAPP-WEB · Migration controlada do banco oficial
# ==================================================================
# Executa somente por workflow_dispatch na main. O dry-run e obrigatorio
# antes de uma aplicacao: ele comprova o destino, exige uma migration local
# ou um bundle explicitamente autorizado e publica apenas hashes estruturais.
# Desde o PR #695 (2026-09-25), migrations sem contrato dedicado caem no
# contrato generico (scripts/db-audit/generic-migration-runtime.sql), que
# prova apenas que o schema public nao mudou entre dry-run e apply. Para
# aplicar, o operador confirma o hash integral do dry-run; o workflow consulta
# o runtime novamente para fechar a janela TOCTOU.
#
# ROTA ATUAL (decisao de 2026-09-26, ver CLAUDE.md secao "Decisoes de
# 2026-09-26"): com varias sessoes paralelas trabalhando, o DDL do dia a dia
# vai por MCP (db_query) + registro no ledger no MESMO turno — este workflow
# pausa em "Waiting" no environment producao-ddl ate aprovacao humana, e
# nesse intervalo o arquivo ja mergeado passa a ser drift (e exatamente o que
# o db-live-guard.yml acusa). Este workflow continua sendo mais seguro no
# papel (dry-run + hash + aprovacao) e serve como rota formal/auditavel
# quando NAO houver pressa (ou quando Joaquim decidir voltar a exigi-la) —
# nao e codigo morto, mas hoje nao e o caminho padrao. Antes de disparar,
# confirme que nao ha outro run deste workflow em waiting/queued (regra
# operacional; nao ha lock automatico no proprio workflow).
# ==================================================================

name: DB Migrate (production)

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: 'Versao exata, com 14 digitos (ex: 20260830170000).'
        required: true
        type: string
      confirm_project_ref:
        description: 'Digite o project-ref oficial para confirmar o destino.'
        required: true
        type: string
      apply:
        description: 'Desmarcado = dry-run; marcado = aplicar o alvo ou bundle autorizado.'
        required: true
        default: false
        type: boolean
      confirm_runtime_sha256:
        description: 'Para apply: SHA-256 completo exibido pelo dry-run anterior.'
        required: false
        default: ''
        type: string
      apply_all_missing:
        description: >-
          Aplicar TODAS as migrations ausentes em ordem (sem filtrar alvo).
          Requer confirm_bundle_sha256 no lugar de confirm_runtime_sha256.
        required: false
        default: false
        type: boolean
      confirm_bundle_sha256:
        description: 'Para apply_all_missing=true: SHA-256 do bundle exibido pelo dry-run.'
        required: false
        default: ''
        type: string



defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'
  OFFICIAL_PROJECT_REF: 'tnnnlkbymytvtqngbbqh'

jobs:
  preflight:
    name: Migration oficial com preflight
    # Aprovacao humana obrigatoria antes de qualquer DDL tocar producao. Soma-se
    # ao dry-run + confirmacao de hash; nao substitui nenhum dos dois.
    runs-on: ubuntu-24.04
    # E66 (auditoria de 01/10/2026): 25 min nao cobriam preflight + dry-run +
    # apply + as validacoes de ledger/runtime do file completo.
    timeout-minutes: 45
    # W33: actions:write somente neste job para disparar types-sync apos apply.
    permissions:
      contents: read
    outputs:
      needs_apply: ${{ steps.preflight.outputs.needs_apply }}
      apply_bundle: ${{ steps.preflight.outputs.apply_bundle }}
      target_name: ${{ steps.preflight.outputs.target_name }}
      confirmation_hash: ${{ steps.runtime.outputs.confirmation_hash }}
    steps:
      - name: ✋ Somente executa na main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só pode ser disparado a partir da main (ref: ${{ github.ref }})."
          exit 1

      # E47 (auditoria de GitHub Actions, 2026-09-26) — considerado e
      # descartado: um passo dentro do job para detectar outro run
      # waiting/queued nunca executaria de fato aqui. A concurrency (group:
      # db-migrate-production, cancel-in-progress: false) ja impede um 2o job
      # do mesmo grupo de rodar qualquer step enquanto o 1o estiver
      # waiting/in_progress — o 2o dispatch fica preso em "queued" pelo
      # proprio GitHub Actions ANTES de chegar a qualquer step, inclusive um
      # de deteccao. Os runs 36247549783 (waiting) e 36263608943
      # (queued/pending) em 26/09 foram exatamente isso: a concorrencia
      # funcionou como desenhada, so ninguem cancelou o 1o "Waiting" antigo
      # antes de disparar de novo. Mitigacao real: checar a aba Actions antes
      # de um novo dispatch; um "Waiting" que nao vai mais ser aprovado deve
      # ser cancelado, nao empilhado.
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provar checkout imutavel
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: bash scripts/ci/install-postgresql-client.sh

      - name: Provar identidade, TLS e validar confirmacoes
        env:
          DESTINO_URL_RAW: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          if [ -z "$DESTINO_URL_RAW" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "::error::Project-ref de confirmacao incorreto."
            exit 1
          fi
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]{14}$'; then
            echo "::error::migration_version precisa ter exatamente 14 digitos."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            endurecerDestinoTls,
            validarDestino,
            validarSupabaseCa,
          } from './scripts/db-audit/database-identity.mjs';
          import { appendFileSync } from 'node:fs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL_RAW, identidade);
          erros.push(...validarSupabaseCa());
          const tls = endurecerDestinoTls(process.env.DESTINO_URL_RAW);
          erros.push(...tls.erros);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log(`::add-mask::${tls.connectionString}`);
          appendFileSync(process.env.GITHUB_ENV, `DESTINO_URL=${tls.connectionString}\n`);
          // R2-INF-003: o CLI do Supabase le SUPABASE_DB_URL, que nao entra na
          // lista de PG* tratada pelo withPsqlEnvironment. O `env:` dos passos
          // redeclarava DESTINO_URL a partir do secret bruto e sobrescrevia o
          // DSN endurecido do GITHUB_ENV; agora o mesmo DSN endurecido (ja
          // mascarado) sai no GITHUB_ENV tambem como SUPABASE_DB_URL.
          appendFileSync(process.env.GITHUB_ENV, `SUPABASE_DB_URL=${tls.connectionString}\n`);
          appendFileSync(process.env.GITHUB_ENV, 'PGSSLMODE=verify-full\n');
          console.log('OK: endpoint oficial, TLS verify-full e CA pinada.');
          NODE

      - name: Exigir alvo unico ou bundle atomico conhecido
        id: preflight
        # E66: repeticao SO de falha de conexao, e SO aqui -- este passo e somente
        # leitura (SELECT do ledger). O apply nunca define a variavel: repetir o
        # push seria reaplicar DDL.
        env:
          PSQL_CONNECT_RETRIES: '2'
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY: ${{ inputs.apply }}
        run: |
          umask 077
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' \
            -printf '%f\n' | cut -c1-14 | sort -u > /tmp/local-versions
          node scripts/db-audit/psql-safe.mjs -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/remote-versions
          comm -13 /tmp/local-versions /tmp/remote-versions > /tmp/remote-only-versions
          REMOTE_ONLY_COUNT=$(wc -l < /tmp/remote-only-versions | tr -d ' ')
          if [ "$REMOTE_ONLY_COUNT" != "0" ]; then
            echo "::error::O ledger remoto possui versions sem arquivo local; db push foi bloqueado antes do CLI."
            echo "remote_only_count=$REMOTE_ONLY_COUNT"
            exit 1
          fi
          comm -23 /tmp/local-versions /tmp/remote-versions > /tmp/missing-versions
          MISSING_COUNT=$(wc -l < /tmp/missing-versions | tr -d ' ')
          MISSING_VERSION=$(sed -n '1p' /tmp/missing-versions)
          ATOMIC_DELIVERY_BUNDLE=$'20260909250000\n20260909260000\n20260909270000'
          # Pacote do lote de 04-05/10/2026 (PR #1890): 8 migrations, alvo = a ultima versao. Autorizado pelo dono em 05/10.
          LOTE_0510_BUNDLE=$'20261003272707\n20261004172554\n20261004173439\n20261004181921\n20261004182245\n20261004185228\n20261004190606\n20261004195051'
          TALKX_RECOVERY_BUNDLE=$'20260911130000\n20260911140000\n20260911150000\n20260911160000\n20260911170000\n20260911180000\n20260911190000\n20260911200000\n20260912110000\n20260912120000\n20260912130000'
          if [ "$MISSING_COUNT" = "1" ] && [ "$MISSING_VERSION" = "$TARGET_VERSION" ]; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=false
          elif [ "$TARGET_VERSION" = "20260909270000" ] \
            && [ "$MISSING_COUNT" = "3" ] \
            && diff -u <(printf '%s\n' "$ATOMIC_DELIVERY_BUNDLE") /tmp/missing-versions; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=true
          elif [ "$TARGET_VERSION" = "20261004195051" ] \
            && [ "$MISSING_COUNT" = "8" ] \
            && diff -u <(printf '%s\n' "$LOTE_0510_BUNDLE") /tmp/missing-versions; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=true
          elif [ "$TARGET_VERSION" = "20260912130000" ] \
            && [ "$MISSING_COUNT" = "11" ] \
            && diff -u <(printf '%s\n' "$TALKX_RECOVERY_BUNDLE") /tmp/missing-versions; then
            NEEDS_APPLY=true
            APPLY_BUNDLE=true
          elif [ "$MISSING_COUNT" = "0" ] && grep -Fxq "$TARGET_VERSION" /tmp/remote-versions; then
            NEEDS_APPLY=false
            APPLY_BUNDLE=false
          else
            echo "::error::O conjunto de versions ausentes nao corresponde exatamente ao alvo informado."
            echo "missing_count=$MISSING_COUNT"
            exit 1
          fi
          FILE_COUNT=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" != "1" ]; then
            echo "::error::A versao alvo precisa mapear para exatamente um arquivo local."
            exit 1
          fi
          TARGET_FILE=$(find supabase/migrations -maxdepth 1 -type f \
            -name "${TARGET_VERSION}_*.sql" -printf '%f\n')
          TARGET_NAME=${TARGET_FILE#"${TARGET_VERSION}_"}
          TARGET_NAME=${TARGET_NAME%.sql}
          if [ "$APPLY" = "true" ] && [ "$NEEDS_APPLY" != "true" ]; then
            echo "::error::A migration alvo ja esta registrada; apply repetido foi bloqueado."
            exit 1
          fi
          echo "needs_apply=$NEEDS_APPLY" >> "$GITHUB_OUTPUT"
          echo "apply_bundle=$APPLY_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "target_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "OK: estado da migration alvo confirmado: version=$TARGET_VERSION needs_apply=$NEEDS_APPLY"

      - name: Provar paridade integral quando a versao ja existe
        if: steps.preflight.outputs.needs_apply == 'false'
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Provar estado runtime antes do push
        id: runtime
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          NEEDS_APPLY: ${{ steps.preflight.outputs.needs_apply }}
          APPLY_BUNDLE: ${{ steps.preflight.outputs.apply_bundle }}
        run: |
          # W28: assercoes inline movidas para scripts/db-audit/contracts/<versao>.expect.json;
          # confirmacao de hash integrada ao executor (run-runtime-contract.mjs).
          set -euo pipefail
          node scripts/db-audit/run-runtime-contract.mjs

      - name: Dry-run oficial do Supabase CLI
        if: steps.preflight.outputs.needs_apply == 'true'
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          APPLY_BUNDLE: ${{ steps.preflight.outputs.apply_bundle }}
        run: |
          set -euo pipefail
          # O CLI 2.116 ignora SUPABASE_DB_URL e cai no projeto "linkado" ("Cannot find project ref"): --db-url explicito.
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --skip-vault --dry-run --yes 2>&1 | tee dry-run.out
          if [ "$APPLY_BUNDLE" = "true" ]; then
            node scripts/db-audit/dry-run-plan.mjs --arquivo dry-run.out --esperado "$TARGET_VERSION" --bundle
          else
            node scripts/db-audit/dry-run-plan.mjs --arquivo dry-run.out --esperado "$TARGET_VERSION"
          fi


  apply:
    name: Aplicar migration aprovada
    needs: preflight
    if: inputs.apply == true && needs.preflight.result == 'success'
    environment: producao-ddl
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # W33: actions:write para disparar types-sync apos apply.
    permissions:
      contents: read
      actions: write
    steps:
      - name: ✋ Somente executa na main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só pode ser disparado a partir da main (ref: ${{ github.ref }})."
          exit 1

      # E47 (auditoria de GitHub Actions, 2026-09-26) — considerado e
      # descartado: um passo dentro do job para detectar outro run
      # waiting/queued nunca executaria de fato aqui. A concurrency (group:
      # db-migrate-production, cancel-in-progress: false) ja impede um 2o job
      # do mesmo grupo de rodar qualquer step enquanto o 1o estiver
      # waiting/in_progress — o 2o dispatch fica preso em "queued" pelo
      # proprio GitHub Actions ANTES de chegar a qualquer step, inclusive um
      # de deteccao. Os runs 36247549783 (waiting) e 36263608943
      # (queued/pending) em 26/09 foram exatamente isso: a concorrencia
      # funcionou como desenhada, so ninguem cancelou o 1o "Waiting" antigo
      # antes de disparar de novo. Mitigacao real: checar a aba Actions antes
      # de um novo dispatch; um "Waiting" que nao vai mais ser aprovado deve
      # ser cancelado, nao empilhado.
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provar checkout imutavel
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: bash scripts/ci/install-postgresql-client.sh

      - name: Provar identidade, TLS e validar confirmacoes
        env:
          DESTINO_URL_RAW: ${{ secrets.DESTINO_URL }}
          TARGET_VERSION: ${{ inputs.migration_version }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$DESTINO_URL_RAW" ]; then
            echo "::error::DESTINO_URL ausente."
            exit 1
          fi
          if [ "$CONFIRM_PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "::error::Project-ref de confirmacao incorreto."
            exit 1
          fi
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9]{14}$'; then
            echo "::error::migration_version precisa ter exatamente 14 digitos."
            exit 1
          fi
          if [ "$APPLY" = "true" ] && ! printf '%s' "$CONFIRM_RUNTIME_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::Apply exige confirm_runtime_sha256 completo e lowercase."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            endurecerDestinoTls,
            validarDestino,
            validarSupabaseCa,
          } from './scripts/db-audit/database-identity.mjs';
          import { appendFileSync } from 'node:fs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL_RAW, identidade);
          erros.push(...validarSupabaseCa());
          const tls = endurecerDestinoTls(process.env.DESTINO_URL_RAW);
          erros.push(...tls.erros);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log(`::add-mask::${tls.connectionString}`);
          appendFileSync(process.env.GITHUB_ENV, `DESTINO_URL=${tls.connectionString}\n`);
          // R2-INF-003: o CLI do Supabase le SUPABASE_DB_URL, que nao entra na
          // lista de PG* tratada pelo withPsqlEnvironment. O `env:` dos passos
          // redeclarava DESTINO_URL a partir do secret bruto e sobrescrevia o
          // DSN endurecido do GITHUB_ENV; agora o mesmo DSN endurecido (ja
          // mascarado) sai no GITHUB_ENV tambem como SUPABASE_DB_URL.
          appendFileSync(process.env.GITHUB_ENV, `SUPABASE_DB_URL=${tls.connectionString}\n`);
          appendFileSync(process.env.GITHUB_ENV, 'PGSSLMODE=verify-full\n');
          console.log('OK: endpoint oficial, TLS verify-full e CA pinada.');
          NODE

      - name: Verificar hash de confirmacao do dry-run
        env:
          CONFIRMATION_HASH: ${{ needs.preflight.outputs.confirmation_hash }}
          CONFIRM_RUNTIME_SHA256: ${{ inputs.confirm_runtime_sha256 }}
          CONFIRM_BUNDLE_SHA256: ${{ inputs.confirm_bundle_sha256 }}
          APPLY_ALL_MISSING: ${{ inputs.apply_all_missing }}
        run: |
          if [ "$APPLY_ALL_MISSING" = "true" ]; then
            if ! printf '%s' "$CONFIRM_BUNDLE_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "::error::apply_all_missing exige confirm_bundle_sha256 completo e lowercase."
              exit 1
            fi
            if [ "$CONFIRMATION_HASH" != "$CONFIRM_BUNDLE_SHA256" ]; then
              echo "::error::confirm_bundle_sha256 nao corresponde ao hash emitido pelo dry-run."
              exit 1
            fi
          else
            if ! printf '%s' "$CONFIRM_RUNTIME_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "::error::Apply exige confirm_runtime_sha256 completo e lowercase."
              exit 1
            fi
            if [ "$CONFIRMATION_HASH" != "$CONFIRM_RUNTIME_SHA256" ]; then
              echo "::error::confirm_runtime_sha256 nao corresponde ao hash do dry-run; migration cancelada."
              exit 1
            fi
          fi
          echo "OK: hash de confirmacao verificado."

      - name: Aplicar alvo unico ou bundle ordenado autorizado
        if: inputs.apply == true && needs.preflight.outputs.needs_apply == 'true'
        run: >-
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
          --skip-vault --yes

      - name: Validar registro no ledger
        env:
          TARGET_VERSION: ${{ inputs.migration_version }}
          TARGET_NAME: ${{ needs.preflight.outputs.target_name }}
        run: |
          LEDGER_COUNT=$(node scripts/db-audit/psql-safe.mjs -X -v ON_ERROR_STOP=1 \
            -v target_version="$TARGET_VERSION" -v target_name="$TARGET_NAME" -At <<'SQL'
              SELECT count(*)
              FROM supabase_migrations.schema_migrations
              WHERE version = :'target_version'
                AND name = :'target_name'
                -- E65 (auditoria de 01/10/2026): o registro existe, mas precisa
                -- dizer O QUE foi aplicado. Sem estas duas linhas, uma version
                -- gravada com statements NULL ou vazio passava como valida.
                AND statements IS NOT NULL
                AND array_length(statements, 1) > 0;
          SQL
          )
          test "$LEDGER_COUNT" = "1"
          echo "OK: ledger possui exatamente version=$TARGET_VERSION name=$TARGET_NAME com statements."
          # E65: e os statements gravados tem de bater com o parse do arquivo local.
          LANCAMENTO=$(ls supabase/migrations/"${TARGET_VERSION}"_*.sql | head -1)
          test -n "$LANCAMENTO"
          node scripts/db-audit/verify-ledger-statements.mjs "$LANCAMENTO"

      - name: Provar paridade integral apos aplicacao
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Disparar types-sync apos apply bem-sucedido (W33)
        # W33: fecha o lote no mesmo dia sem esperar o push/schedule do types-sync.
        # Dispara apenas quando apply=true E os passos anteriores terminaram com exito.
        # Nao usa workflow_run (o gatilho nao expoe inputs do dispatch original).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run types-sync.yml --ref main \
            --repo "${{ github.repository }}"
          echo "types-sync disparado apos apply bem-sucedido."
