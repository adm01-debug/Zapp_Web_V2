          test "$BUNDLE_COUNT" = "8"
          echo "OK: ledger possui as 8 migrations do lote de 05/10."

      - name: Validar ledger completo do bundle de recuperacao Talk X
        if: >-
          (inputs.apply == true || steps.preflight.outputs.needs_apply == 'false')
          && (inputs.migration_version == '20260912130000' || inputs.migration_version == '20260912140000')
