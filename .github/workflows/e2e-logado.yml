# ==================================================================
# ZAPP-WEB · E2E logado (Playwright, login real)
# ==================================================================
# SEGURANCA: este workflow deliberadamente NAO possui pull_request. Ele usa
# os secrets E2E_TEST_EMAIL/E2E_TEST_PASSWORD (usuario de teste dedicado, perfil
# agente) apenas depois de o codigo chegar a main ou em dispatch feito sobre
# main. Workflows de PR nao podem referenciar secrets
# (scripts/ci/check-pr-workflow-secrets.mjs), por isso este teste nao fica no
# ci.yml e nao bloqueia PR.
# ==================================================================

name: E2E logado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-logado-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e-logado:
    name: 🎭 E2E logado (Playwright)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🎭 Install Playwright (Chromium)
        run: bunx playwright install --with-deps chromium

      # Roda so o projeto "setup" (login real com o usuario de teste). O projeto
      # "chromium-authenticated" (specs do Talk X) fica de fora: o usuario de
      # teste e agente e nao enxerga "Campanhas" (ver e2e/README.md).
      - name: 🔐 Run Playwright E2E (login real)
        run: bun run test:e2e -- --project=setup
        env:
          CI: true
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-logado
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
