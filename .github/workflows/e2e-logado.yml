# docs:
#   gatilho: workflow_run (CI/CD Pipeline concluiu com sucesso na main) e dispatch sobre main
#   prova: os mesmos 15 projetos Playwright em cinco grupos, com três shards autenticados, Supabase descartável e TLS local
#   falha: preparo, testes e limpeza bloqueiam; publica só diagnóstico redigido e preserva o alerta da suíte
#   avisa: mesma issue de E2E; cada execução aprovada reconcilia o alerta existente
# O checkout fixa o SHA aprovado do workflow_run ou o SHA da main no dispatch.
# O controller cria credenciais sintéticas, isola a rede, executa e limpa o backend.
# Scripts de teardown de produção permanecem versionados; este workflow não os chama.

name: E2E logado

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["CI/CD Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

# Conserva a fila da main. Dispatch fora dela recebe grupo próprio e falha
# antes do checkout, sem deslocar a execução pendente nem emitir alerta.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'e2e-logado' || format('e2e-logado-branch-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  e2e-logado:
    name: 🎭 E2E logado (backend descartável)
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Os três shards autenticados repetem a mesma seleção de nove projetos,
          # mas cada um recebe backend próprio e um terço fechado dos casos. O
          # controller preserva workers1 porque as fixtures compartilham estado.
          - name: authenticated-1-of-3
            projects: --project=setup --project=chromium-e2e-core --project=chromium-authenticated --project=firefox-talkx --project=webkit-talkx --project=firefox-conversation --project=webkit-conversation --project=firefox-catalog --project=webkit-catalog
            timeout-minutes: 75
          - name: authenticated-2-of-3
            projects: --project=setup --project=chromium-e2e-core --project=chromium-authenticated --project=firefox-talkx --project=webkit-talkx --project=firefox-conversation --project=webkit-conversation --project=firefox-catalog --project=webkit-catalog
            timeout-minutes: 75
          - name: authenticated-3-of-3
            projects: --project=setup --project=chromium-e2e-core --project=chromium-authenticated --project=firefox-talkx --project=webkit-talkx --project=firefox-conversation --project=webkit-conversation --project=firefox-catalog --project=webkit-catalog
            timeout-minutes: 75
          - name: deslogado-principal
            projects: --project=chromium-mapa --project=firefox-auth --project=webkit-auth
            timeout-minutes: 45
          - name: deslogado-secundario
            projects: --project=chromium-telefonia --project=firefox-telefonia --project=webkit-telefonia
            timeout-minutes: 45
    permissions:
      contents: read
      issues: write # preserva o alerta existente, somente neste job
    steps:
      - name: Validar main e fixar o SHA aprovado antes do checkout
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              if [[ "$SOURCE_CONCLUSION" != success || "$SOURCE_EVENT" != push || "$SOURCE_BRANCH" != main || "$SOURCE_REPOSITORY" != "$REPOSITORY" ]]; then
                echo '::error::A execução de origem não comprova CI aprovado na main deste repositório.'
                exit 1
              fi
              sha="$SOURCE_SHA"
              ;;
            workflow_dispatch)
              if [[ "$DISPATCH_REF" != refs/heads/main ]]; then
                echo '::error::Este workflow só pode ser disparado a partir da main.'
                exit 1
              fi
              sha="$DISPATCH_SHA"
              ;;
            *) echo '::error::Evento não permitido neste workflow.'; exit 1 ;;
          esac
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ || "$sha" == 0000000000000000000000000000000000000000 ]]; then
            echo '::error::SHA aprovado inválido.'
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout do SHA confiável
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.request.outputs.sha }}

      - name: 🥖 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Preparar ferramentas TLS antes de gerar certificados ou credenciais
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openssl libnss3-tools

      - name: Validar grupo e executar a suíte no backend descartável
        id: suite
        env:
          E2E_GROUP: ${{ matrix.name }}
          E2E_PROJECTS: ${{ matrix.projects }}
          E2E_OUTPUT: ${{ runner.temp }}/e2e-isolated-suite-${{ matrix.name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { GROUPS } from './scripts/e2e-isolated/runtime-contract.mjs';
          const group = process.env.E2E_GROUP;
          const expected = process.env.E2E_PROJECTS?.split(' ');
          if (!Object.hasOwn(GROUPS, group) || JSON.stringify(expected) !== JSON.stringify(GROUPS[group].map(name => '--project=' + name))) {
            throw new Error('Grupo e inventário de projetos divergentes.');
          }
          NODE
          bash scripts/e2e-isolated/run.sh suite "$E2E_GROUP" "$E2E_OUTPUT"

      - name: 📎 Arquivar somente o diagnóstico público redigido
        if: always() && steps.suite.outputs.report_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-logado-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-isolated-suite-${{ matrix.name }}/public
          if-no-files-found: error
          retention-days: 3

      # Mesma issue e marcador de causa. Só o resumo já redigido fornece IDs;
      # falha anterior à coleta ou na limpeza também mantém o alerta aberto.
      - name: 🚨 Abrir/comentar a issue da suite logada
        if: failure() && steps.checkout.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITULO: "[e2e-logado] Suíte logada quebrada na main"
          PUBLIC_REPORT: ${{ runner.temp }}/e2e-isolated-suite-${{ matrix.name }}/public
          REPORT_READY: ${{ steps.suite.outputs.report_ready }}
          E2E_GROUP: ${{ matrix.name }}
        with:
          script: |
            const { marcadorDe, corpoDe } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/marcador-specs.mjs`
            );
            const { GROUPS } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/e2e-isolated/runtime-contract.mjs`
            );
            const titulo = process.env.TITULO;
            let nomes = [];
            if (process.env.REPORT_READY === 'true') {
              try {
                const { readFile } = await import('node:fs/promises');
                const { join } = await import('node:path');
                const summary = JSON.parse(await readFile(join(process.env.PUBLIC_REPORT, 'results-summary.json'), 'utf8'));
                const projects = GROUPS[process.env.E2E_GROUP];
                if (summary.schema !== 1 || !Array.isArray(summary.cases) || !projects) throw new Error('invalid-public-summary');
                // Só identidades estáveis: nunca títulos, erros, HTML, traces ou tokens.
                const rejected = new Set(['failed', 'flaky', 'unexpected_pass', 'skipped_explicit', 'skipped_runtime', 'not_run', 'missing_from_report', 'extra_reported']);
                nomes = summary.cases.filter(item => projects.includes(item?.project) &&
                  /^[0-9a-f]{64}$/.test(item?.key ?? '') && rejected.has(item?.outcome))
                  .map(item => `${item.project}:${item.key}`);
              } catch {
                core.info('resumo público indisponível ou inválido; alerta sem detalhes privados');
              }
            }
            const resumo = nomes.length ? corpoDe(nomes) :
              'A suíte isolada falhou sem casos reprovados identificados no resumo público. ' +
              'Veja o check e o diagnóstico redigido do run; preparo, coleta ou limpeza também bloqueiam a execução.';
            const marcador = marcadorDe(nomes);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: abertas } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50,
            });
            const issue = abertas.find((i) => i.title === titulo && !i.pull_request);

            if (!issue) {
              await github.rest.issues.create({
                owner, repo, title: titulo, body: `${resumo}\n\n${marcador}`,
              });
              core.info(`issue aberta com ${nomes.length} teste(s) quebrado(s)`);
              return;
            }

            // Mesma regra da E44: so comenta de novo quando a causa muda (o conjunto cresce
            // ou troca). Conjunto igual -- inclusive um a menos -- nao gera comentario novo.
            const { data: comentarios } = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const ultimo = comentarios.at(-1)?.body ?? issue.body ?? '';
            if (ultimo.includes(marcador)) {
              core.info('mesma causa da ultima vez -- sem comentario novo');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Falha nova, causa diferente:\n\n${resumo}\n\n${marcador}`,
            });
            core.info('comentario novo: a causa mudou');

  recuperar-alerta:
    name: Recuperacao da suite logada
    needs: e2e-logado
    # Um grupo verde nao prova recuperacao: espera TODOS os grupos da matriz.
    # Falha, cancelamento ou grupo pulado mantem o alerta aberto.
    if: ${{ !cancelled() && needs.e2e-logado.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: ✅ Fechar a issue quando a suite volta
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITULO: "[e2e-logado] Suíte logada quebrada na main"
        with:
          script: |
            const titulo = process.env.TITULO;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: abertas } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50,
            });
            const issue = abertas.find((i) => i.title === titulo && !i.pull_request);
            if (!issue) {
              core.info('nenhuma issue aberta -- nada a fechar');
              return;
            }
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, state: 'closed',
            });
            core.info(`issue #${issue.number} fechada: a suite voltou a passar na main`);
