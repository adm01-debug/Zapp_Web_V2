# docs:
#   gatilho: push na main e dispatch sobre main
#   prova: o fluxo logado (Playwright com login real) contra producao
#   falha: artefato do Playwright e issue/relatorio; nunca roda em PR de terceiro
#   avisa: issue de E2E e autor do push
# GA46: a dispensa do Dangerous-Workflow (Scorecard #40) fica pronta com GA08
# (job so roda em workflow_run success de push na main, sem checkout de fork).
# Ate la, o risco esta contido: checkout sempre da main, sem input externo no
# github-script. Ver docs/audits/DECISOES-JOAQUIM-FASES-2-3.md.
# ==========================================================================
# ZAPP-WEB · E2E logado (Playwright, login real)
# ==========================================================================
# SEGURANCA: este workflow deliberadamente NAO possui pull_request. Ele usa
# os secrets E2E_TEST_EMAIL/E2E_TEST_PASSWORD (usuario de teste dedicado, perfil
# supervisor -- enxerga Campanhas/Talk X) apenas depois de o codigo chegar a main ou em dispatch feito sobre
# main. Workflows de PR nao podem referenciar secrets
# (scripts/ci/check-pr-workflow-secrets.mjs), por isso este teste nao fica no
# ci.yml e nao bloqueia PR.
#
# Sem upload de relatorio: se o login falhar, o Playwright anexa um
# error-context.md (snapshot de acessibilidade) com o valor real do campo de
# e-mail preenchido. Como o repo e publico, um upload-artifact aqui deixaria
# esse e-mail baixavel por qualquer conta do GitHub. Falha deste job = ver o
# log do proprio step (app fora do ar / seletor quebrou); nao vale o risco.
# ==========================================================================

name: E2E logado

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

# cancel-in-progress: false (em vez de so em push) enfileira ao inves de matar
# uma run que ja esta rodando. Levantamento de 2026-09-26: 18/40 (45%) das runs
# de push eram canceladas por push seguinte, varias delas a segundos de
# terminar (suite roda em ~40-60s, bem abaixo do timeout de 15min). Com
# cancel-in-progress:false o GitHub Actions enfileira e, se varios pushes
# chegarem enquanto a run atual roda, so o mais recente pendente roda em
# seguida (os intermediarios sao pulados) -- mesma semantica de "valida so o
# commit mais novo", sem desperdicar runs quase completas.
concurrency:
  group: e2e-logado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-logado:
    name: 🎭 E2E logado (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # E83: a suite logada (173 testes) estourava o timeout do job unico e a run
    # inteira caia como "cancelled". A matriz abaixo divide os mesmos 15 projetos
    # em 3 grupos, cada um com seu proprio relogio de 15 min: se um grupo ficar
    # lento, os outros terminam independentes. fail-fast: false para um grupo
    # vermelho nao cancelar os demais. A uniao dos 3 grupos e EXATAMENTE a lista
    # original (nem mais, nem menos) -- travado em e2e/quarantine.unit.mjs.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Grupo 1: autenticados -- o `setup` gera o storageState e os 8
          # projetos com `dependencies: ['setup']` o consomem. Rodam no MESMO
          # job para o login real acontecer uma vez so (sem concorrencia).
          - name: authenticated
            projects: --project=setup --project=chromium-e2e-core --project=chromium-authenticated --project=firefox-talkx --project=webkit-talkx --project=firefox-conversation --project=webkit-conversation --project=firefox-catalog --project=webkit-catalog --project=chromium-talkx
            # A05: este grupo carrega 205 dos 248 testes do workflow (172 deles no
            # `chromium-authenticated`, que e' o projeto-catch-all). Com o pool padrao
            # do CI (`workers: 1` no playwright.config.ts) a suite roda ~9,8 s por
            # teste, ou seja ~33 min -- muito acima dos 15 min do job, e e' por isso
            # que as runs logadas sao canceladas desde 02/10. 4 e' o numero de vCPU do
            # runner `ubuntu-latest` e deixa a maior parte do tempo do teste em espera
            # de browser (I/O), nao em CPU. Os 2 grupos deslogados sao pequenos
            # (16 e 27 testes) e seguem com 1, sem mudanca de comportamento.
            workers: 4
          # Grupo 2: deslogados nos browsers principais + mapa (sessao FALSA,
          # sem secrets de login).
          - name: deslogado-principal
            projects: --project=chromium-mapa --project=firefox-auth --project=webkit-auth --project=firefox-email-navy --project=webkit-email-navy --project=chromium-onboarding-dispensar --project=chromium-multiplix-responsivo --project=chromium-tarefas-linha-de-base
            workers: 1
          # Grupo 3: telefonia nos 3 browsers (sessao FALSA, sem secrets).
          - name: deslogado-secundario
            projects: --project=chromium-telefonia --project=firefox-telefonia --project=webkit-telefonia
            workers: 1
    # E83: as permissoes de escrita ficam no JOB, nunca no nivel do workflow -- o zizmor
    # reprova `write` no topo (excessive-permissions, severidade alta) porque o escopo
    # vale para todos os jobs. Foi o que reprovou o merge do #1784.
    permissions:
      contents: read # checkout e leitura do repo
      issues: write # abrir/comentar o alerta em falha e fechar quando a suite volta
    steps:
      - name: ✋ Somente executa na main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só pode ser disparado a partir da main (ref: ${{ github.ref }})."
          exit 1

      - name: 📥 Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🥖 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # E68: cache dos browsers (ver ci.yml para o racional completo). Chave com o
      # hash do bun.lock e o conjunto de browsers, para não herdar um cache com
      # menos engines do que este job precisa.
      - name: 💾 Cache dos browsers Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-cfw-${{ hashFiles('bun.lock') }}-${{ runner.os }}

      - name: 🎭 Install Playwright (Chromium, Firefox, WebKit)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.64.1 install --with-deps chromium firefox webkit

      - name: 🔧 Dependências de sistema do Playwright (cache quente)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.64.1 install-deps chromium firefox webkit

      # E83: cada job da matriz invoca o Playwright com os projetos do SEU grupo
      # via variavel de matriz (cada token ja leva o prefixo de projeto,
      # sem o qual o Playwright trata o nome como path de spec e ignora o projeto).
      # Os projetos de cada grupo, EXPLICITAMENTE em vez de confiar na resolucao
      # automatica de dependsOn:
      # na run 362506313557 (commit 9aea3c2), rodar so "--project=chromium-e2e-core"
      # (sem path de arquivo no CLI) nao disparou "setup" e e2e/.auth/user.json
      # nunca foi gerado. Por isso o grupo authenticated lista `--project=setup`
      # junto. chromium-authenticated cobre todos os specs autenticados;
      # firefox-talkx e webkit-talkx cobrem talkx.spec.ts nos engines alternativos
      # (auth cookies do user.json sao browser-agnosticos).
      # firefox-conversation e webkit-conversation cobrem conversation.spec.ts e
      # messaging.spec.ts nos engines alternativos -- mesma logica de browser-agnosticismo.
      # chromium-mapa cobre as specs do modulo MAPA (E71/E72 picker,
      # e2e/location-picker.spec.ts; E73 cadastro, e2e/contact-address.spec.ts; E74
      # mapa/pino, e2e/contact-map-pin.spec.ts). Projeto proprio e SEM setup: essas
      # specs autenticam por sessao FALSA (installFakeSession) com REST/RPC e a
      # Mapbox mockados, entao nao usam E2E_TEST_EMAIL/E2E_TEST_PASSWORD nem o
      # storageState de e2e/.auth/user.json -- nenhum secret novo e necessario.
      #
      # catalog.spec.ts (CT-82) e o fluxo de envio do catalogo. O Chromium e
      # coberto pelo chromium-authenticated (catch-all); firefox-catalog e
      # webkit-catalog dao a paridade dos 3 browsers pedida no aceite. O spec e
      # SKIPADO enquanto E2E_CATALOG_PRODUCT_SKU_VERIFIED nao for true (pende a
      # verificacao do SKU no PromoGifts, sistema externo). NAO entram no ci.yml.
      #
      # E88: firefox-auth/webkit-auth provam a tela de login (auth.spec.ts) no Firefox
      # e no WebKit. Sao DESLOGADOS (sem `dependencies`/`storageState`, nenhum secret),
      # mas sairam do job de PR do ci.yml: cross-browser de auth nao precisa bloquear
      # todo PR, e este workflow -- que ja instala os 3 engines -- e quem prova os
      # engines alternativos depois do merge. Travado em ci-e2e-projects.unit.mjs.
      #
      # chromium-telefonia / firefox-telefonia / webkit-telefonia cobrem
      # e2e/telefonia.spec.ts (T86) nos 3 browsers -- o aceite do item pede verde nos
      # tres. Mesma receita do chromium-mapa: sessao FALSA (installFakeSession) com o
      # app shell e as RPCs da tela (search_my_calls, my_calls_kpi,
      # set_call_agent_notes) mockados, entao NAO usam E2E_TEST_EMAIL/E2E_TEST_PASSWORD
      # nem o storageState de e2e/.auth/user.json -- nenhum secret novo. O spec esta
      # no testIgnore do chromium-authenticated para nao rodar sob login real.
      # E82: o e-mail do usuario de teste entra no log do Playwright (o fill() imprime o
      # valor). Mascarar ANTES de qualquer saida, para o ::add-mask:: valer o run todo.
      - name: 🔒 Mascarar o e-mail do E2E no log
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        run: |
          set -euo pipefail
          if [ -n "$E2E_TEST_EMAIL" ]; then
            echo "::add-mask::$E2E_TEST_EMAIL"
            echo "e-mail do E2E mascarado no log"
          else
            echo "aviso: secret E2E_TEST_EMAIL vazio - nada a mascarar"
          fi

      - name: 📐 Run Playwright E2E (login real)
        run: bun run test:e2e -- ${{ matrix.projects }} --workers=${{ matrix.workers }}
        env:
          CI: true
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # Chave publica do projeto, para os asserts por API do catalog.spec.ts
          # (mesmo secret que o ci.yml entrega ao app; nao e privilegiada). Sem
          # ela o spec pula em vez de falhar.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # E82: o ::add-mask:: protege o LOG. O `playwright-report` e um artifact HTML com o
      # e-mail gravado dentro (titulo de teste, argumento do fill(), URL) -- subir o
      # relatorio cru publicaria o endereco num repositorio publico, que e exatamente o
      # risco que o cabecalho deste workflow ja registra. Sao superficies diferentes.
      # Por isso: redige o arquivo e SO ENTAO sobe -- e o upload exige que a redacao
      # tenha dado certo. Se a redacao falhar, o relatorio NAO sobe.
      - name: 🔒 Redigir o relatorio antes de arquivar
        if: failure()
        id: redigir
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/ci/redigir-relatorio.mjs playwright-report \
            --segredo-env=E2E_TEST_EMAIL \
            --segredo-env=E2E_TEST_PASSWORD

      - name: 📎 Arquivar relatorio do Playwright (so em falha)
        if: failure() && steps.redigir.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-logado-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

      # GA44: o error-context.md (snapshot de acessibilidade) so e resumido DEPOIS
      # do redator e apenas se ele passou -- o arquivo cru pode conter a senha
      # digitada. O resumo vai para o step summary, nunca para artifact.
      - name: Resumir error-context pos-redacao
        if: failure() && github.ref == 'refs/heads/main' && steps.redigir.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo '## E2E error-context (conteudo ja redigido)'
            echo ''
            ACHOU=false
            while IFS= read -r -d '' f; do
              ACHOU=true
              echo "### $f"
              echo ''
              echo '```'
              cat "$f"
              echo '```'
              echo ''
            done < <(find test-results -name 'error-context.md' -print0 2>/dev/null || true)
            if [ "$ACHOU" = false ]; then echo 'Nenhum error-context.md (falha fora de spec -- ver log).'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Teardown: apaga linhas de fixture geradas pelo E2E em producao.
      # contact_id 04dff4dc-c6b1-4283-ac22-bd8639804759 e o contato de teste
      # que o E2E usa em conversation.spec.ts / messaging.spec.ts.
      # A UNIQUE constraint (contact_id, dia) impede duplicatas no mesmo dia,
      # mas a tabela cresce 1 row/CI-run sem este step.
      # E25: a limpeza NAO usa mais a service role. O DELETE vive na RPC
      # public.e2e_cleanup_conversation_closures() (SECURITY DEFINER; so o contato
      # fixo do fixture e so o usuario de teste via auth.uid()), e o script
      # scripts/ci/e2e-teardown.mjs a chama com o login de E2E_TEST_EMAIL /
      # E2E_TEST_PASSWORD -- as mesmas credenciais do Playwright. A chave mestra do
      # banco (ignora RLS) sai do CI.
      # A URL vem do mesmo secret que o ci.yml ja entrega ao app.
      # Sem as credenciais o script e PULADO (exit 0), como no step antigo.
      - name: 🧹 E2E teardown - limpar fixture de conversation_closures
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: node scripts/ci/e2e-teardown.mjs e2e_cleanup_conversation_closures

      # Teardown: catalog_send_events e log append-only -- depois do CT-02 o
      # `authenticated` so tem SELECT/INSERT, entao o cliente NAO consegue apagar
      # o que o CT-82 grava; a limpeza exige a service role. As mensagens do
      # envio sao soft-deletadas (is_deleted=true) pelo afterEach do proprio spec.
      # contact_id 04dff4dc-... e o contato de teste E2E (dedicado).
      # Requer o secret SUPABASE_SERVICE_ROLE_KEY; se ausente, o step e pulado.
      - name: 🧹 E2E teardown - limpar envios de catálogo (CT-82)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY nao configurado - teardown de catalog_send_events pulado"
            exit 0
          fi
          HDR_CT82="$(mktemp)"; chmod 600 "$HDR_CT82"
          { printf 'header = "apikey: %s\n' "$SERVICE_ROLE_KEY"; printf 'header = "Authorization: Bearer %s\n' "$SERVICE_ROLE_KEY"; } > "$HDR_CT82"
          curl --proto '=https' --tlsv1.2 -sf -X DELETE \
            "https://tnnnlkbymytvtqngbbqh.supabase.co/rest/v1/catalog_send_events?contact_id=eq.04dff4dc-c6b1-4283-ac22-bd8639804759" \
            -K "$HDR_CT82" \
            -H "Content-Type: application/json" \
            && echo "teardown catalog_send_events OK" \
            || echo "::warning::teardown catalog_send_events falhou - nao bloqueia CI"

      # GA39 (defensivo): revoga a sessao aberta pelo proprio teardown (logout
      # simples, SEM scope=global) para nao acumular sessoes do usuario de teste.
      # O logout GLOBAL espera GA09 (grupo de concurrency fixo): com runs em
      # paralelo, ele derrubaria o run vizinho. Requer os mesmos secrets do teste.
      - name: E2E logout - revogar sessao do teardown
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: node scripts/ci/e2e-teardown.mjs logout

      # E83: alerta da suite logada, no mesmo mecanismo da E44 (db-live-guard.yml) -- um
      # marcador invisivel identifica a CAUSA (o conjunto de testes que falhou) e o alerta
      # so e repetido quando ela MUDA. Sem isso, uma suite quebrada por dias geraria um
      # comentario por execucao e a issue viraria ruido que ninguem le.
      - name: 🚨 Abrir/comentar a issue da suite logada
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITULO: "[e2e-logado] Suíte logada quebrada na main"
        with:
          script: |
            const { marcadorDe, nomesDeTestResults, corpoDe, tituloDe } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/marcador-specs.mjs`
            );
            // GA42: a issue e achada pelo PREFIXO [e2e-logado] (o titulo exato
            // varia: login E2E falhou vs suite quebrada). O titulo exato nunca
            // fechava (#1946).
            const nomes = nomesDeTestResults('test-results');
            const titulo = tituloDe(nomes);
            const marcador = marcadorDe(nomes);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: abertas } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50,
            });
            const issue = abertas.find((i) => typeof i.title === 'string' && i.title.startsWith('[e2e-logado]'));

            if (!issue) {
              await github.rest.issues.create({
                owner, repo, title: titulo, body: `${corpoDe(nomes)}\n\n${marcador}`,
              });
              core.info(`issue aberta com ${nomes.length} teste(s) quebrado(s)`);
              return;
            }

            // Mesma regra da E44: so comenta de novo quando a causa muda (o conjunto cresce
            // ou troca). Conjunto igual -- inclusive um a menos -- nao gera comentario novo.
            const { data: comentarios } = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const ultimo = comentarios.at(-1)?.body ?? issue.body ?? '';
            if (ultimo.includes(marcador)) {
              core.info('mesma causa da ultima vez -- sem comentario novo');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Falha nova, causa diferente:\n\n${corpoDe(nomes)}\n\n${marcador}`,
            });
            core.info('comentario novo: a causa mudou');

      - name: ✅ Fechar a issue quando a suite volta
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITULO: "[e2e-logado] Suíte logada quebrada na main"
        with:
          script: |
            // GA42: fecha qualquer [e2e-logado]* aberta (ver nota no passo de alerta).
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: abertas } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50,
            });
            const issue = abertas.find((i) => typeof i.title === 'string' && i.title.startsWith('[e2e-logado]'));
            if (!issue) {
              core.info('nenhuma issue aberta -- nada a fechar');
              return;
            }
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, state: 'closed',
            });
            core.info(`issue #${issue.number} fechada: a suite voltou a passar na main`);
