# docs:
#   gatilho: push na main e dispatch sobre main
#   prova: o fluxo logado (Playwright com login real) contra producao
#   falha: artefato do Playwright e issue/relatorio; nunca roda em PR de terceiro
#   avisa: issue de E2E e autor do push
# ==========================================================================
# ZAPP-WEB · E2E logado (Playwright, login real)
# ==========================================================================
# SEGURANCA: este workflow deliberadamente NAO possui pull_request. Ele usa
# os secrets E2E_TEST_EMAIL/E2E_TEST_PASSWORD (usuario de teste dedicado, perfil
# supervisor -- enxerga Campanhas/Talk X) apenas depois de o codigo chegar a main ou em dispatch feito sobre
# main. Workflows de PR nao podem referenciar secrets
# (scripts/ci/check-pr-workflow-secrets.mjs), por isso este teste nao fica no
# ci.yml e nao bloqueia PR.
#
# Sem upload de relatorio: se o login falhar, o Playwright anexa um
# error-context.md (snapshot de acessibilidade) com o valor real do campo de
# e-mail preenchido. Como o repo e publico, um upload-artifact aqui deixaria
# esse e-mail baixavel por qualquer conta do GitHub. Falha deste job = ver o
# log do proprio step (app fora do ar / seletor quebrou); nao vale o risco.
# ==========================================================================

name: E2E logado

on:
  # W71: dispara apos o CI/CD Pipeline concluir com sucesso na main (nao a cada
  # push — so quando os 6 required checks ja passaram). O run herda o SHA do
  # commit acionador via github.event.workflow_run.head_sha, garantindo que o
  # Playwright teste exatamente o codigo que passou no CI.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ['CI/CD Pipeline']
    branches: [main]
    types: [completed]
  workflow_dispatch:


defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read

# cancel-in-progress: false enfileira ao inves de matar uma run em andamento.
# W71: o sha do acionador e' usado como chave de concorrencia para que dois
# pushes rapidos nao cancelem a run do primeiro antes de ela terminar.
concurrency:
  # W71: chave baseada no SHA do commit acionador (workflow_run) ou no ref
  # (dispatch). Dois pushes ao mesmo SHA nao competem; dois SHAs diferentes
  # enfileiram (cancel-in-progress: false).
  group: e2e-logado-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  e2e-logado:
    name: 🎭 E2E logado (Playwright)
    runs-on: ubuntu-24.04
    # W06: o orcamento do JOB tem de caber setup (~1 min; ~3 min sem cache de browsers) +
    # o --global-timeout do Playwright (13 min, no passo do Playwright) + os passos de
    # falha (redacao, artifact, teardown, alerta). Com 15 min e sem global-timeout, os
    # runs 38764055662 e 38771373068 foram CANCELADOS no meio da suite: cancelado nao e
    # failure(), entao nao houve relatorio, nem lista de specs, nem issue -- 21 specs
    # falharam sem ninguem saber quais.
    timeout-minutes: 20
    # E83: as permissoes de escrita ficam no JOB, nunca no nivel do workflow -- o zizmor
    # reprova `write` no topo (excessive-permissions, severidade alta) porque o escopo
    # vale para todos os jobs. Foi o que reprovou o merge do #1784.
    permissions:
      contents: read # checkout e leitura do repo
      issues: write # abrir/comentar o alerta em falha e fechar quando a suite volta
    steps:
      # W71: com workflow_run o gatilho e' o CI que passou — mas se alguem fizer
      # um dispatch manual de uma branch que nao e' main, o guard ainda bloqueia.
      # Para workflow_run, github.event.workflow_run.head_branch == 'main' e
      # garantido pelo filtro `branches: [main]` no gatilho — aqui so protege
      # o dispatch manual.
      - name: ✋ Somente executa na main
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        env:
          GH_REF: ${{ github.ref }}
        run: |
          echo "::error::Este workflow só pode ser disparado a partir da main (ref: $GH_REF)."
          exit 1

      # W71: pular se o CI concluiu com falha (so interessa o success).
      - name: ✋ Pular se CI falhou (W71)
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success'
        env:
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "CI/CD Pipeline concluiu com '$WR_CONCLUSION' — E2E logado nao roda."
          exit 0

      - name: 📥 Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # W71: usar o SHA exato do commit que acionou o CI, nao o HEAD atual
          # (pode ter mudado entre o fim do CI e o inicio deste job).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 🥖 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependências Bun
        # W35: cache do bun reduz bun install de ~30s para <10s com cache quente.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}-${{ runner.os }}
          restore-keys: bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # E68: cache dos browsers (ver ci.yml para o racional completo). Chave com o
      # hash do bun.lock e o conjunto de browsers, para não herdar um cache com
      # menos engines do que este job precisa.
      - name: 💾 Cache dos browsers Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-cfw-${{ hashFiles('bun.lock') }}-${{ runner.os }}

      - name: 🎭 Install Playwright (Chromium, Firefox, WebKit)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: 🔧 Dependências de sistema do Playwright (cache quente)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium firefox webkit

      # Uma unica invocacao do Playwright, com os projetos listados
      # EXPLICITAMENTE em vez de confiar na resolucao automatica de dependsOn:
      # na run 362506313557 (commit 9aea3c2), rodar so "--project=chromium-e2e-core"
      # (sem path de arquivo no CLI) nao disparou "setup" e e2e/.auth/user.json
      # nunca foi gerado. chromium-authenticated cobre todos os specs autenticados;
      # firefox-talkx e webkit-talkx cobrem talkx.spec.ts nos engines alternativos
      # (auth cookies do user.json sao browser-agnosticos).
      # firefox-conversation e webkit-conversation cobrem conversation.spec.ts e
      # messaging.spec.ts nos engines alternativos -- mesma logica de browser-agnosticismo.
      # chromium-mapa cobre as specs do modulo MAPA (E71/E72 picker,
      # e2e/location-picker.spec.ts; E73 cadastro, e2e/contact-address.spec.ts; E74
      # mapa/pino, e2e/contact-map-pin.spec.ts). Projeto proprio e SEM setup: essas
      # specs autenticam por sessao FALSA (installFakeSession) com REST/RPC e a
      # Mapbox mockados, entao nao usam E2E_TEST_EMAIL/E2E_TEST_PASSWORD nem o
      # storageState de e2e/.auth/user.json -- nenhum secret novo e necessario.
      #
      # catalog.spec.ts (CT-82) e o fluxo de envio do catalogo. O Chromium e
      # coberto pelo chromium-authenticated (catch-all); firefox-catalog e
      # webkit-catalog dao a paridade dos 3 browsers pedida no aceite. O spec e
      # SKIPADO enquanto E2E_CATALOG_PRODUCT_SKU_VERIFIED nao for true (pende a
      # verificacao do SKU no PromoGifts, sistema externo). NAO entram no ci.yml.
      # E82: o e-mail do usuario de teste entra no log do Playwright (o fill() imprime o
      # valor). Mascarar ANTES de qualquer saida, para o ::add-mask:: valer o run todo.
      - name: 🔒 Mascarar o e-mail do E2E no log
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        run: |
          if [ -n "$E2E_TEST_EMAIL" ]; then
            echo "::add-mask::$E2E_TEST_EMAIL"
            echo "e-mail do E2E mascarado no log"
          else
            echo "aviso: secret E2E_TEST_EMAIL vazio - nada a mascarar"
          fi

      # W06: --global-timeout (13 min) fica ABAIXO do timeout-minutes do job. Estourado,
      # o Playwright encerra a suite ele mesmo, grava o relatorio e sai com erro -- o passo
      # FALHA e a redacao, o artifact e o alerta rodam. Sem ele, quem encerrava era o
      # runner (job cancelado) e nada disso acontecia.
      - name: 📐 Run Playwright E2E (login real)
        run: bun run test:e2e -- --global-timeout=780000 --project=setup --project=chromium-e2e-core --project=chromium-authenticated --project=chromium-mapa --project=firefox-talkx --project=webkit-talkx --project=firefox-conversation --project=webkit-conversation --project=firefox-catalog --project=webkit-catalog
        env:
          CI: true
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # Chave publica do projeto, para os asserts por API do catalog.spec.ts
          # (mesmo secret que o ci.yml entrega ao app; nao e privilegiada). Sem
          # ela o spec pula em vez de falhar.
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # E82: o ::add-mask:: protege o LOG. O `playwright-report` e um artifact HTML com o
      # e-mail gravado dentro (titulo de teste, argumento do fill(), URL) -- subir o
      # relatorio cru publicaria o endereco num repositorio publico, que e exatamente o
      # risco que o cabecalho deste workflow ja registra. Sao superficies diferentes.
      # Por isso: redige o arquivo e SO ENTAO sobe -- e o upload exige que a redacao
      # tenha dado certo. Se a redacao falhar, o relatorio NAO sobe.
      - name: 🔒 Redigir o relatorio antes de arquivar
        if: failure()
        id: redigir
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          node scripts/ci/redigir-relatorio.mjs playwright-report \
            --segredo-env=E2E_TEST_EMAIL \
            --segredo-env=E2E_TEST_PASSWORD

      - name: 📎 Arquivar relatorio do Playwright (so em falha)
        if: failure() && steps.redigir.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-logado-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3

      # Teardown: apaga linhas de fixture geradas pelo E2E em producao
      # (conversation_closures e catalog_send_events do contato
      # 04dff4dc-c6b1-4283-ac22-bd8639804759). W74 (docs/ci/DECISOES_PENDENTES_2026-10-15.md):
      # antes usava SUPABASE_SERVICE_ROLE_KEY (ignora todo o RLS de producao) so
      # para isto. Agora loga como o proprio usuario de teste e chama a RPC
      # SECURITY DEFINER e2e_cleanup() (migration 20261015200000), que so aceita
      # esse usuario e so apaga as linhas do contato fixo -- a chave mestra deixa
      # de ser necessaria neste workflow.
      - name: 🧹 E2E teardown - limpar fixtures (conversation_closures + catalog_send_events)
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$E2E_TEST_EMAIL" ] || [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "credenciais ausentes - teardown pulado"
            exit 0
          fi
          ACCESS_TOKEN=$(curl --proto '=https' --tlsv1.2 --max-time 30 -sf -X POST \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_TEST_EMAIL\",\"password\":\"$E2E_TEST_PASSWORD\"}" \
            | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "login do usuario de teste falhou - teardown pulado"
            exit 0
          fi
          curl --proto '=https' --tlsv1.2 --max-time 30 -sf -X POST \
            "$SUPABASE_URL/rest/v1/rpc/e2e_cleanup" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            && echo "teardown OK" \
            || echo "teardown falhou - nao bloqueia CI"

      # W77: captura as primeiras 20 linhas de stderr/stdout dos test-results antes
      # do alerta -- evita round-trip ao artifact e garante o contexto imediato do erro.
      - name: 📋 Capturar linhas de erro dos test-results (W77)
        if: failure()
        run: |
          ERRO_FILE="$RUNNER_TEMP/e2e-error-lines.txt"
          # Percorre os diretorios de testes com falha e pega as primeiras 20 linhas
          # do primeiro arquivo de erro disponivel (stderr, stdout, ou error.txt).
          encontrou=0
          for dir in test-results/*/; do
            [ -d "$dir" ] || continue
            for f in "${dir}stderr" "${dir}stdout" "${dir}error.txt"; do
              if [ -f "$f" ] && [ -s "$f" ]; then
                head -n 20 "$f" > "$ERRO_FILE"
                encontrou=1
                echo "::debug::erro capturado de $f"
                break 2
              fi
            done
          done
          if [ "$encontrou" -eq 0 ]; then
            touch "$ERRO_FILE"
            echo "::debug::nenhum arquivo de erro encontrado em test-results/"
          fi

      # E83: alerta da suite logada, no mesmo mecanismo da E44 (db-live-guard.yml) -- um
      # marcador invisivel identifica a CAUSA (o conjunto de testes que falhou) e o alerta
      # so e repetido quando ela MUDA. Sem isso, uma suite quebrada por dias geraria um
      # comentario por execucao e a issue viraria ruido que ninguem le.
      - name: 🚨 Abrir/comentar a issue da suite logada
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITULO: "[e2e-logado] Suíte logada quebrada na main"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # W77: caminho do arquivo com as linhas de erro capturadas
          ERRO_FILE: ${{ runner.temp }}/e2e-error-lines.txt
        with:
          script: |
            const { marcadorDe, nomesDeTestResults, corpoDe, tituloDe } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/marcador-specs.mjs`
            );
            const nomesDeTitulo = nomesDeTestResults('test-results');
            // W80: título varia por causa — "login E2E falhou" vs "Suíte logada quebrada"
            const titulo = tituloDe(nomesDeTitulo);
            const nomes = nomesDeTitulo;
            const marcador = marcadorDe(nomes);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // W77: inclui as primeiras 20 linhas de erro no corpo do alerta
            let erroLinhas = '';
            try {
              const fs = require('fs');
              const conteudo = fs.readFileSync(process.env.ERRO_FILE, 'utf8').trim();
              if (conteudo) {
                const linhas = conteudo.split('\n').slice(0, 20).join('\n');
                erroLinhas = `\n\n**Primeiras linhas do erro:**\n\`\`\`\n${linhas}\n\`\`\``;
              }
            } catch { /* arquivo ausente ou vazio -- corpo sem bloco de erro */ }

            const { data: abertas } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50,
            });
            const issue = abertas.find((i) => i.title === titulo);

            const runUrl = process.env.RUN_URL;
            const rodape = `\n\n---\n[Log do run](${runUrl}) · [Artifact](${runUrl}#artifacts)`;
            if (!issue) {
              await github.rest.issues.create({
                owner, repo, title: titulo,
                body: `${corpoDe(nomes)}${erroLinhas}${rodape}\n\n${marcador}`,
              });
              core.info(`issue aberta com ${nomes.length} teste(s) quebrado(s)`);
              return;
            }

            // W91/E51: rotacionar issue apos 20 comentarios para manter legibilidade.
            const primeiraContagem = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number, per_page: 1,
            });
            const totalPaginasMatch = (primeiraContagem.headers?.link || '')
              .match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
            const totalComentarios = totalPaginasMatch ? Number(totalPaginasMatch[1]) : (primeiraContagem.data.length);
            if (totalComentarios > 20) {
              const bodyRotacao = `${corpoDe(nomes)}${erroLinhas}${rodape}\n\n${marcador}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `⚠️ Esta issue atingiu ${totalComentarios} comentários e está sendo rotacionada para manter legibilidade (política E51/W91).\n\nÚltimo alerta antes do fechamento:\n\n---\n\n${bodyRotacao}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              await github.rest.issues.create({
                owner, repo, title: titulo,
                body: `Continuação de #${issue.number} (fechada por atingir ${totalComentarios} comentários — E51/W91).\n\n---\n\n${bodyRotacao}`,
              });
              core.info(`issue #${issue.number} rotacionada (${totalComentarios} comentários)`);
              return;
            }
            // Mesma regra da E44: so comenta de novo quando a causa muda (o conjunto cresce
            // ou troca). Conjunto igual -- inclusive um a menos -- nao gera comentario novo.
            const { data: comentarios } = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const ultimo = comentarios.at(-1)?.body ?? issue.body ?? '';
            if (ultimo.includes(marcador)) {
              core.info('mesma causa da ultima vez -- sem comentario novo');
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Falha nova, causa diferente:\n\n${corpoDe(nomes)}${erroLinhas}${rodape}\n\n${marcador}`,
            });
            core.info('comentario novo: a causa mudou');

      - name: ✅ Fechar a issue quando a suite volta
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITULO: "[e2e-logado] Suíte logada quebrada na main"
        with:
          script: |
            const titulo = process.env.TITULO;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: abertas } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 50,
            });
            const issue = abertas.find((i) => i.title === titulo);
            if (!issue) {
              core.info('nenhuma issue aberta -- nada a fechar');
              return;
            }
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, state: 'closed',
            });
            core.info(`issue #${issue.number} fechada: a suite voltou a passar na main`);
