# docs:
#   gatilho: workflow_run (conclusao dos workflows principais na main)
#   prova: abre issue quando qualquer workflow critico falha na main
#   falha: silencioso (nao tem mecanismo de auto-alerta proprio)
#   avisa: repositorio via issue com label db-live-guard

name: Notifica falha na main

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
      - Deploy Edge Functions
      - DB Migrate (production)
      - DB Live Guard
      - types-sync
      - E2E logado
      - DB Guard (offline)
    branches: [main]
    types: [completed]

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions: {}

jobs:
  notificar:
    name: 🔔 Notificar falha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ contains(fromJSON('["failure","startup_failure"]'), github.event.workflow_run.conclusion) }}
    permissions:
      issues: write
    steps:
      - name: 🔔 Abrir ou atualizar issue de falha
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const wf = context.payload.workflow_run;
            const titulo = `[falha-main] ${wf.name} falhou na main`;
            const corpo = [
              `**Workflow:** ${wf.name}`,
              `**Branch:** ${wf.head_branch}`,
              `**Commit:** ${wf.head_sha.slice(0, 7)}`,
              `**Run:** ${wf.html_url}`,
              `**Quando:** ${wf.updated_at}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'falha-main',
            });

            const existente = issues.find(i => i.title.startsWith(`[falha-main] ${wf.name}`));

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ['falha-main'],
              });
            }
