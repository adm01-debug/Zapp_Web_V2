# docs:
#   gatilho: workflow_run (conclusao dos workflows principais na main)
#   prova: abre issue quando qualquer workflow critico falha na main
#   workflows monitorados: ci, deploy-functions, db-migrate, db-live-guard, types-sync, e2e-logado, db-guard

name: Notifica falha na main

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
      - Deploy Edge Functions
      - DB Migrate (production)
      - DB Live Guard
      - types-sync
      - E2E logado
      - DB Guard (offline)
    branches: [main]
    types: [completed]

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions: {}

jobs:
  notificar:
    name: 🔔 Notificar falha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GA95: `startup_failure` tambem notifica (foi a falha do branch-hygiene em 15/10).
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'startup_failure' }}
    permissions:
      issues: write
    steps:
      - name: 🔔 Abrir ou atualizar issue de falha
        # GA95: payload montado com jq (nada de objeto JS inline) e RUN_URL do
        # `workflow_run.html_url` (o campo certo; interpolar outro dava URL
        # malformada). Sem actions/github-script: gh + jq bastam.
        env:
          GH_TOKEN: ${{ github.token }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_UPDATED: ${{ github.event.workflow_run.updated_at }}
          WF_CONCLUSAO: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          TITULO="[falha-main] ${WF_NAME} falhou na main"
          CORPO=$(jq -n \
            --arg nome "$WF_NAME" \
            --arg conclusao "$WF_CONCLUSAO" \
            --arg branch "$WF_BRANCH" \
            --arg sha "${WF_SHA:0:7}" \
            --arg url "$WF_URL" \
            --arg quando "$WF_UPDATED" \
            '"**Workflow:** \($nome)\n**Conclusao:** \($conclusao)\n**Branch:** \($branch)\n**Commit:** \($sha)\n**Run:** \($url)\n**Quando:** \($quando)"' | jq -r .)
          EXISTENTE=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title | startswith(\"[falha-main] ${WF_NAME}\"))][0].number // empty")
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --body-file - <<< "$CORPO"
            echo "issue atualizada: #$EXISTENTE"
          else
            gh issue create --title "$TITULO" --label falha-main --body-file - <<< "$CORPO"
            echo "issue criada"
          fi
