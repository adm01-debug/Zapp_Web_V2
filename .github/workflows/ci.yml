# docs:
#   gatilho: pull_request, push na main e dispatch
#   prova: tipos, testes de unidade, contratos Node/Edge, build, security e E2E publico
#   falha: PR fica vermelho e o merge e bloqueado pelos required checks
#   avisa: autor do PR e revisor, via checks do GitHub
# nao-e-bug:
#   - merge_group ausente: este workflow declara somente push, pull_request e workflow_dispatch; a fila de merge nao esta disponivel para a conta adm01-debug (tipo User, nao Organization)
# =================================================
# O CI principal executa TypeCheck, Vitest, contratos Node/Edge, build, auditoria
# de dependencias/segredos e E2E publico nos PRs. Guardas de banco que dependem
# de servicos/credenciais de producao continuam fora do CI de PR.
# =================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: 🔎 TypeCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # "tsc --noEmit" e no-op neste tsconfig (so "references"); o ratchet roda
      # "tsc -b --force" e falha so se surgir erro de tipo novo.
      - name: 🔎 Run TypeScript debt ratchet
        run: node scripts/ci/typecheck-ratchet.mjs

  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      matrix:
        shard: [1, 2, 3]
      fail-fast: false
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Vitest shard ${{ matrix.shard }}/3
        run: bun vitest run --shard=${{ matrix.shard }}/3
        env:
          CI: true

  node-scripts:
    name: 🧩 Node CI Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧩 Run Node CI scripts tests
        run: >-
          node --test scripts/ci/*.unit.mjs
        env:
          CI: true

      - name: 🧪 Test Vercel ignore-build guard
        run: node scripts/vercel/ignore-build.unit.mjs

      - name: 🦕 Test Edge handlers
        run: |
          deno check --config scripts/ci/deno.json --frozen supabase/functions/*/index.ts
          deno test --config scripts/ci/deno.json --frozen --allow-env --allow-read --allow-net=127.0.0.1 $(git ls-files 'supabase/functions/**/*.test.ts')

  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [typecheck, unit-tests]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build for production
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CRM_INTEGRATION_ENABLED: 'true'

      - name: 📦 Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3

      - name: 📏 Enforce initial bundle budget (performance-budget.json)
        run: node scripts/ci/bundle-budget.mjs

      - name: 📐 Report bundle size
        run: |
          echo "Bundle Size Report"
          echo "==================="
          du -sh dist/
          echo ""
          echo "JS Files:"
          find dist -name "*.js" -exec du -h {} \;
          echo ""
          echo "CSS Files:"
          find dist -name "*.css" -exec du -h {} \;

  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🔎 Audit completo (informativo, inclui devDependencies)
        run: |
          set -euo pipefail
          status=0
          bun audit --audit-level=low > audit-report.txt 2>&1 || status=$?
          echo "$status" > audit-status.txt
          cat audit-report.txt

      - name: 🔒 Audit bloqueante (HIGH/CRITICAL em dependencias de producao)
        run: node scripts/ci/audit-prod.mjs --level high --input audit-report.txt --status audit-status.txt

      - name: 🔍 Detect secrets introduced in commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  ci-gate:
    name: ✅ CI Gate (required check)
    runs-on: ubuntu-24.04
    if: always()
    needs: [typecheck, unit-tests, node-scripts, build, security]
    steps:
      - name: Verificar resultado dos jobs obrigatorios
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "node-scripts: ${{ needs.node-scripts.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "security: ${{ needs.security.result }}"
          if [[  "${{ needs.typecheck.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.node-scripts.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.security.result }}" == "failure" ]]; then
            echo "Um ou mais jobs obrigatorios falharam"
            exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" == "cancelled" || \
                "${{ needs.unit-tests.result }}" == "cancelled" || \
                "${{ needs.build.result }}" == "cancelled" ]]; then
            echo "Um ou mais jobs obrigatorios foram cancelados"
            exit 1
          fi
          echo "Todos os jobs obrigatorios passaram"

  e2e:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 💾 Cache dos browsers Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-cfw-${{ hashFiles('bun.lock') }}-${{ runner.os }}

      - name: 🎭 Install Playwright (Chromium, Firefox, WebKit)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.64.1 install --with-deps chromium firefox webkit

      - name: 🔧 Dependencias de sistema do Playwright (cache quente)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.64.1 install-deps chromium firefox webkit

      - name: 🧪 Run Playwright E2E (PR sem autenticacao)
        run: bun run test:e2e -- --project=chromium --project=chromium-theme --project=chromium-mapa --project=chromium-contacts-visual --project=chromium-a11y --project=chromium-email-navy --project=firefox-email-navy --project=webkit-email-navy
        env:
          CI: true

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            !playwright-report/**/error-context.md
            !playwright-report/**/*.zip
            !test-results/**/error-context.md
          retention-days: 3
          if-no-files-found: ignore

  mutation-mapa:
    name: 🧬 Mutacao do mapa (nao bloqueante)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: 🔎 Detectar mudanca no modulo do mapa (paths filter)
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::error::O evento pull_request nao informou o SHA da base; filtro de caminhos inconclusivo."
            exit 1
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::O SHA base '${BASE_SHA}' nao esta entre os pais do merge sintetico."
            exit 1
          fi

          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf 'Arquivos alterados no PR:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/lib/mapbox|src/components/inbox/location-picker/)'; then
            echo "map_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "map_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧄 Setup Bun
        if: steps.paths.outputs.map_changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 💾 Cache de dependencias Bun
        if: steps.paths.outputs.map_changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: 📚 Install dependencies
        if: steps.paths.outputs.map_changed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧬 Rodar mutacao do mapa (E69)
        if: steps.paths.outputs.map_changed == 'true'
        run: bun run mutation:mapa
