# =================================================
# ZAPP-WEB CI/CD Pipeline
# =================================================
# Triggered on: push to main, pull requests
# Jobs: lint, typecheck, test, build
# Runtime: bun (o repo usa bun.lock, nao package-lock.json)
# =================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_CLIENTES_SUPABASE_URL: ${{ secrets.VITE_CLIENTES_SUPABASE_URL }}
  VITE_CLIENTES_SUPABASE_ANON_KEY: ${{ secrets.VITE_CLIENTES_SUPABASE_ANON_KEY }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # JOB 1: Lint & Type Check
  # ===========================================
  lint-and-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧪 Test CI and Edge deployment guards
        run: node --test scripts/ci/*.unit.mjs scripts/edge-deploy/*.unit.mjs

      - name: 🔐 Verify immutable GitHub Action pins
        run: node scripts/ci/check-workflow-pins.mjs

      - name: 🧾 Verify Edge deployment manifest freshness
        run: node scripts/edge-deploy/generate-manifest.mjs --check

      # O legado possui divida de lint conhecida. O ratchet compara ocorrencias
      # individualmente e falha se uma nova for introduzida, sem mascarar a CI.
      - name: 🔍 Run ESLint debt ratchet
        run: node scripts/ci/lint-ratchet.mjs

      # "tsc --noEmit" sozinho e um no-op nesta config (tsconfig.json so tem
      # "references", sem --build o tsc nao checa nada e sempre sai 0). O
      # ratchet roda "tsc -b --force" de verdade e falha so se surgir erro novo.
      - name: 🔎 Run TypeScript debt ratchet
        run: node scripts/ci/typecheck-ratchet.mjs

      - name: 🚫 Run implicit-any ratchet
        run: node scripts/ci/implicit-any-ratchet.mjs

      - name: 🛡️ Run Supabase usage guard
        run: node scripts/db-audit/supabase-usage-guard.mjs

  # ===========================================
  # JOB 2: Unit Tests
  # ===========================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧪 Run Vitest (cobertura com piso em src/lib + src/services)
        run: bun run test:coverage
        env:
          CI: true

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3
          if-no-files-found: ignore

  # ===========================================
  # JOB 3: Build
  # ===========================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build for production
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLIENTES_SUPABASE_URL: ${{ secrets.VITE_CLIENTES_SUPABASE_URL }}
          VITE_CLIENTES_SUPABASE_ANON_KEY: ${{ secrets.VITE_CLIENTES_SUPABASE_ANON_KEY }}

      # Artifact de dist/ so em PR — em push para main o deploy e feito pela
      # Vercel, e o upload custava 41.6k GigabyteHours de storage em agosto.
      - name: 📦 Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

      - name: 📏 Enforce initial bundle budget (performance-budget.json)
        run: node scripts/ci/bundle-budget.mjs

      - name: 📐 Report bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "====================="
          du -sh dist/
          echo ""
          echo "JS Files:"
          find dist -name "*.js" -exec du -h {} \;
          echo ""
          echo "CSS Files:"
          find dist -name "*.css" -exec du -h {} \;

  # ===========================================
  # JOB 4: Security Audit
  # ===========================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile

      # Um unico "bun audit": o relatorio completo (inclui devDependencies) sai sempre,
      # e o gate bloqueante le o mesmo arquivo em vez de consultar o registry de novo.
      - name: 🔎 Audit completo (informativo, inclui devDependencies)
        run: bun audit --audit-level=low 2>&1 | tee audit-report.txt || true

      - name: 🔒 Audit bloqueante (HIGH/CRITICAL em dependencias de producao)
        run: node scripts/ci/audit-prod.mjs --level high --input audit-report.txt

      - name: 🔍 Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          ! grep -rn "SUPABASE_SERVICE_ROLE_KEY\|sk_live_\|sk_test_\|password\s*=\s*[\"']" --include="*.ts" --include="*.tsx" --include="*.js" src/

  # ===========================================
  # JOB 5: Audit Report Generation
  # ===========================================
  audit-report:
    name: 🛡️ Generate Audit Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'audit') &&
      !contains(github.event.head_commit.message, '[auto]') &&
      !contains(github.event.head_commit.message, 'relatório de auditoria') &&
      !contains(github.event.head_commit.message, 'automation/audit-report')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛡️ Generate PDF Report
        run: bunx tsx generate_audit_pdf.ts

      - name: 📬 Open or update audit report PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TYPES_SYNC_PR_TOKEN || github.token }}
          base: main
          branch: automation/audit-report
          delete-branch: true
          add-paths: docs/audit_report.pdf
          commit-message: 'docs: atualizar relatório de auditoria [auto]'
          title: 'docs: atualizar relatório de auditoria'
          body: |
            Relatório PDF regenerado automaticamente a partir da `main`.

            A alteração passa por revisão e pelos checks normais antes do merge.
