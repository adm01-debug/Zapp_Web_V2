# =================================================
# ZAPP-WEB CI/CD Pipeline
# =================================================
# Triggered on: push to main, pull requests
# Jobs: lint-and-typecheck, test, build, security, e2e
# Runtime: bun (o repo usa bun.lock, nao package-lock.json)
# =================================================

name: CI/CD Pipeline

on:
  # E23: 'develop' removido — branch nao existe no repo (so main).
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Fila de merge: sem este gatilho os required checks nunca reportariam no
  # merge group e a fila travaria todos os merges do repo.
  merge_group:
  # E24: reexecutar a suite na main sem precisar de um push novo.
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_CRM_INTEGRATION_ENABLED: 'true'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Só cancela runs em andamento pra PR (push novo na mesma PR); em push na
  # main cada commit mantém seu próprio veredito de CI (antes cancelava um
  # merge no meio do outro, e a main ficava sem check verde nenhum).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================
  # JOB 1: Lint & Type Check
  # ===========================================
  lint-and-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      - name: 🦕 Typecheck das Edge Functions (deno check)
        run: >-
          deno check --config scripts/ci/deno.json --frozen
          supabase/functions/*/index.ts

      - name: 🧪 Kernel de mensageria — mídia (precisa de rede local)
        run: >-
          deno test --config scripts/ci/deno.json --frozen --allow-env --allow-net=127.0.0.1
          supabase/functions/_shared/messaging/__tests__/media.test.ts

      - name: "API de dominio do Multiplix (Bloco E - roteador e acoes)"
        run: >-
          deno test --config scripts/ci/deno.json --frozen --allow-env --allow-read
          supabase/functions/multiplix-dispatch/__tests__/f53-rate-limit.test.ts
          supabase/functions/multiplix-dispatch/actions/__tests__/blocks.test.ts
          supabase/functions/multiplix-dispatch/actions/__tests__/audience.test.ts
          supabase/functions/multiplix-dispatch/actions/__tests__/inspect.test.ts
          supabase/functions/multiplix-dispatch/actions/__tests__/lifecycle.test.ts

      - name: 🧪 Run executable Edge handler contracts
        run: >-
          deno test --config scripts/ci/deno.json --frozen --allow-env
          supabase/functions/_shared/__tests__/ssrf.test.ts
          supabase/functions/_shared/__tests__/secure-egress.test.ts
          supabase/functions/_shared/__tests__/crm-integration-contract.test.ts
          supabase/functions/_shared/__tests__/talkx-delivery-connection.test.ts
          supabase/functions/_shared/__tests__/avatar-storage-path.test.ts
          supabase/functions/_shared/__tests__/gmail-helpers-account-scope.test.ts
          supabase/functions/_shared/__tests__/evolution-go-routes.test.ts
          supabase/functions/_shared/__tests__/evolution-send-instance-token.test.ts
          supabase/functions/_shared/__tests__/webhook-auth-shadow.test.ts
          supabase/functions/_shared/__tests__/gmail-send-schema.test.ts
          supabase/functions/_shared/__tests__/multiplix-eligibility.test.ts
          supabase/functions/_shared/__tests__/messaging-evolution-go.test.ts
          supabase/functions/_shared/__tests__/messaging-errors.test.ts
          supabase/functions/_shared/messaging/__tests__/personalize.test.ts
          supabase/functions/_shared/messaging/__tests__/phone.test.ts
          supabase/functions/_shared/messaging/__tests__/eligibility.test.ts
          supabase/functions/_shared/messaging/__tests__/index.test.ts
          supabase/functions/crm-integration/index.test.ts
          supabase/functions/promogifts-catalog/index.test.ts
          supabase/functions/promogifts-catalog/index.actions.test.ts
          supabase/functions/message-delivery/index.test.ts
          supabase/functions/sentiment-alert/index.test.ts
          supabase/functions/talkx-send/index.test.ts
          supabase/functions/talkx-scheduler/index.test.ts
          supabase/functions/multiplix-audience/index.test.ts
          supabase/functions/public-api/index.test.ts
          supabase/functions/webhook-diagnostic/diagnostic.test.ts
          supabase/functions/talkx-report/index.test.ts
          supabase/functions/multiplix-send/index.test.ts
          supabase/functions/get-sip-password/index.test.ts
          supabase/functions/_shared/__tests__/cron-secret-authz-l5.test.ts
          supabase/functions/_shared/__tests__/talkx-resume-policy.test.ts
          supabase/functions/_shared/__tests__/webhook-signature.test.ts
          supabase/functions/_shared/__tests__/ai-auth.test.ts
          supabase/functions/_shared/__tests__/ai-audio-authz.test.ts
          supabase/functions/_shared/__tests__/ai-audio-authz-runtime.test.ts
          supabase/functions/_shared/__tests__/ai-auth-service-path.test.ts
          supabase/functions/_shared/__tests__/webhook-signature-ambiguity.test.ts
          supabase/functions/_shared/__tests__/voice-copilot-authz.test.ts

      - name: 🧪 Test CI and Edge deployment guards
        run: >-
          node --test scripts/ci/*.unit.mjs scripts/edge-deploy/*.unit.mjs
          scripts/db-audit/crm-sync-outbox-contract.test.mjs scripts/talkx/*.unit.mjs

      - name: 🐹 Setup Go for egress-proxy contracts
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: infrastructure/preview-egress-proxy/go.mod

      - name: 🧪 Run pinned egress-proxy contracts
        working-directory: infrastructure/preview-egress-proxy
        run: go test ./...

      - name: 🔐 Verify immutable GitHub Action pins
        run: node scripts/ci/check-workflow-pins.mjs

      - name: 🔒 Verify PR workflow secret boundary
        run: node scripts/ci/check-pr-workflow-secrets.mjs

      - name: 📋 Verify Talk X PR body (definição de pronto)
        if: github.event_name == 'pull_request'
        run: node scripts/ci/check-talkx-pr-body.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: 🔬 Lint workflows (actionlint)
        run: |
          # actionlint vem do release oficial pinado (v1.7.7) com o sha256
          # conferido, em vez de `go install ...@versao`: a resolucao de modulo do
          # go install nao e travada por lock-file (SonarCloud githubactions:S8545).
          set -euo pipefail
          actionlint_version="1.7.7"
          actionlint_asset="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_sha256="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          actionlint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$actionlint_dir"
          curl --proto '=https' --tlsv1.2 -sSL -o "$actionlint_dir/$actionlint_asset" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_asset}"
          echo "${actionlint_sha256}  ${actionlint_dir}/${actionlint_asset}" | sha256sum --check --strict
          tar -xzf "$actionlint_dir/$actionlint_asset" -C "$actionlint_dir" actionlint
          chmod +x "$actionlint_dir/actionlint"
          echo "$actionlint_dir" >> "$GITHUB_PATH"
          "$actionlint_dir/actionlint" -shellcheck ''

      - name: 🛡️ Audit workflow security (zizmor)
        run: |
          # --only-binary :all: impede o build de sdist (scripts de setup);
          # zizmor==0.9.0 publica wheel manylinux (SonarCloud githubactions:S8541).
          python3 -m pip install --quiet --break-system-packages --only-binary :all: zizmor==0.9.0
          # Aceitar apenas exit 11-13 (info/low/medium); falhar em qualquer outro
          # código, inclusive 1 (parse/erro interno) e 14-15 (high/error).
          zizmor --persona regular .github/workflows/ || { rc=$?; [ "$rc" -ge 11 ] && [ "$rc" -le 13 ] || exit "$rc"; }

      - name: 🧾 Verify Edge deployment manifest freshness
        run: node scripts/edge-deploy/generate-manifest.mjs --check

      # O legado possui divida de lint conhecida. O ratchet compara ocorrencias
      # individualmente e falha se uma nova for introduzida, sem mascarar a CI.
      - name: 🔍 Run ESLint debt ratchet
        run: node scripts/ci/lint-ratchet.mjs

      # "tsc --noEmit" sozinho e um no-op nesta config (tsconfig.json so tem
      # "references", sem --build o tsc nao checa nada e sempre sai 0). O
      # ratchet roda "tsc -b --force" de verdade e falha so se surgir erro novo.
      - name: 🔎 Run TypeScript debt ratchet
        run: node scripts/ci/typecheck-ratchet.mjs

      - name: 🚫 Run implicit-any ratchet
        run: node scripts/ci/implicit-any-ratchet.mjs

      - name: 🔤 Run typography parity guard
        run: node scripts/qa/medir-tipografia.cjs --check

      - name: 🛡️ Run Supabase usage guard
        run: node scripts/db-audit/supabase-usage-guard.mjs

      - name: 🧾 Verify Talk X V4 placar freshness (aviso)
        # O placar compara o STATUS.md commitado com os títulos (X<NNN>) já em
        # origin/main. Uma etapa recém-mergeada deixa o arquivo 1 passo atrás (o
        # gerador não conta a própria etapa antes do merge) — então o check NÃO pode
        # bloquear: `continue-on-error` avisa sem derrubar o job. Quem corrige é o
        # workflow `talkx-status-regen.yml`, que roda no push e commita o STATUS.md
        # regenerado (bot via GITHUB_TOKEN, sem loop).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # O checkout do job de lint é raso (fetch-depth padrão 1); o placar varre
          # `git log origin/main` atrás de títulos (X<NNN>), então precisa do histórico
          # completo de main. `--unshallow` busca a história toda sem tocar no checkout
          # dos demais steps (e é no-op se o clone já for completo).
          git fetch origin main --unshallow --quiet
          node scripts/talkx/v4-status.mjs --check --ref origin/main

  # ===========================================
  # JOB 2: Unit Tests
  # ===========================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Vitest (cobertura com piso em src/lib + src/services)
        run: bun run test:coverage
        env:
          CI: true

      # Config dedicado (vitest.contracts.config.ts): reescreve o import Deno
      # "https://esm.sh/zod@3.23.8" de schemas.ts para o alias npm "zod3"
      # (zod@3.23.8, ja no bun.lock). O vitest.config.ts principal nao tem
      # esse rewrite e quebra em 3 dos 6 arquivos (Node nao resolve URL https
      # no loader ESM padrao) — por isso a suite roda num config separado.
      - name: 🧪 Run Edge Function contract tests (tests/contracts)
        run: bun run test:contracts
        env:
          CI: true

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3
          if-no-files-found: ignore

  # ===========================================
  # JOB 3: Build
  # ===========================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-and-typecheck, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build for production
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CRM_INTEGRATION_ENABLED: 'true'

      # Artifact de dist/ so em PR — em push para main o deploy e feito pela
      # Vercel, e o upload custava 41.6k GigabyteHours de storage em agosto.
      - name: 📦 Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

      - name: 📏 Enforce initial bundle budget (performance-budget.json)
        run: node scripts/ci/bundle-budget.mjs

      - name: 📐 Report bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "====================="
          du -sh dist/
          echo ""
          echo "JS Files:"
          find dist -name "*.js" -exec du -h {} \;
          echo ""
          echo "CSS Files:"
          find dist -name "*.css" -exec du -h {} \;

  # ===========================================
  # JOB 4: Security Audit
  # ===========================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Um unico "bun audit": o relatorio completo (inclui devDependencies) sai sempre,
      # e o gate bloqueante le o mesmo arquivo em vez de consultar o registry de novo.
      - name: 🔎 Audit completo (informativo, inclui devDependencies)
        run: bun audit --audit-level=low 2>&1 | tee audit-report.txt || true

      - name: 🔒 Audit bloqueante (HIGH/CRITICAL em dependencias de producao)
        run: node scripts/ci/audit-prod.mjs --level high --input audit-report.txt

      - name: 🔍 Detect secrets introduced in commits
        # v3 roda em Node 24. O action calcula o intervalo do evento e falha
        # fechado para segredos novos, sem reabrir findings históricos já
        # inventariados. Não recebe secrets privilegiados em pull_request.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  # ===========================================
  # JOB 5: E2E Tests (Playwright)
  # ===========================================
  e2e:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🎭 Install Playwright (Chromium, Firefox, WebKit)
        # Versao exata resolvida no bun.lock (SonarCloud githubactions:S8543:
        # `bunx playwright` sem versao puxaria um release nao verificado).
        run: bunx playwright@1.63.0 install --with-deps chromium firefox webkit

      # Projetos "chromium", "firefox-auth" e "webkit-auth" exercitam auth.spec.ts
      # deslogado (sem E2E_TEST_EMAIL/E2E_TEST_PASSWORD). Workflows de PR não podem
      # referenciar esses secrets (scripts/ci/check-pr-workflow-secrets.mjs), então
      # o login real roda em .github/workflows/e2e-logado.yml, depois do merge na main.
      - name: 🧪 Run Playwright E2E (chromium + firefox + webkit, sem autenticação)
        run: bun run test:e2e -- --project=chromium --project=chromium-theme --project=firefox-auth --project=webkit-auth --project=chromium-contacts-visual
        env:
          CI: true

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  # ===========================================
  # JOB 6: Mutação do mapa (E70, não bloqueante)
  # ===========================================
  # E70: roda o runner de mutação do módulo do mapa (E69,
  # `scripts/mutation/run-mapa.mjs`) quando um PR toca `src/lib/mapbox*` ou
  # `src/components/inbox/location-picker/**`. `continue-on-error: true` mantém o
  # job INFORMATIVO: um mutante sobrevivente nunca trava o merge (não é required).
  #
  # O GitHub Actions não oferece `paths:` por job — o filtro `paths` só existe no
  # gatilho do workflow, e usá-lo aqui restringiria TODOS os jobs do ci.yml. Para
  # não alterar os jobs existentes, o filtro de caminhos roda em STEP
  # (`git diff --name-only` contra a base do PR), a alternativa prevista na
  # auditoria de GitHub Actions (E64).
  mutation-mapa:
    name: 🧬 Mutação do mapa (não bloqueante)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: o filtro de caminhos compara com a base do PR
          # (`origin/<base>...HEAD`), o que exige o ancestral comum.
          fetch-depth: 0

      # Filtro de caminhos (E70): só o módulo do mapa justifica a rodada.
      - name: 🔎 Detectar mudança no módulo do mapa (paths filter)
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            # push/dispatch/merge_group: sem base de PR, roda (fail-open).
            echo "map_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          printf 'Arquivos alterados no PR:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/lib/mapbox|src/components/inbox/location-picker/)'; then
            echo "map_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "map_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧄 Setup Bun
        if: steps.paths.outputs.map_changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 📚 Install dependencies
        if: steps.paths.outputs.map_changed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧬 Rodar mutação do mapa (E69)
        if: steps.paths.outputs.map_changed == 'true'
        run: bun run mutation:mapa
