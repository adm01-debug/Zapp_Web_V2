# ==================================================================
# ZAPP-WEB · Guardas VIVOS do banco oficial
# ==================================================================
# SEGURANCA: este workflow deliberadamente NAO possui pull_request. Ele
# executa scripts do repositorio com DESTINO_URL apenas depois de chegarem a
# main, no agendamento da default branch ou em dispatch feito sobre main.
# A protecao da branch main continua sendo parte obrigatoria do perimetro.
# ==================================================================

name: DB Live Guard

on:
  push:
    branches: [main]
  schedule:
    # segunda-feira 06:00 UTC (03:00 em Curitiba)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-live-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  live-contract:
    name: Contrato DB vivo
    # A excecao de workflow_dispatch fora da main existe somente na branch
    # temporaria diagnose/db-live-runtime e nao deve ser integrada.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Exigir credencial do banco oficial
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          if [ -z "$DESTINO_URL" ]; then
            echo "::error::DESTINO_URL ausente; os guardas vivos nao podem ser executados."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            validarDestino,
          } from './scripts/db-audit/database-identity.mjs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL, identidade);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log('OK: endpoint do banco oficial comprovado por fingerprint.');
          NODE

      - name: Comparar migrations com schema_migrations
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: node scripts/db-audit/check-migration-drift.mjs

      - name: Coletar diagnostico estrutural temporario
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          umask 077
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT pg_get_functiondef('public.mcp_exec_many(text[],integer)'::regprocedure)
          " > /tmp/mcp-exec-many-function.sql
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
            WITH RECURSIVE reach(member_oid, membership_path) AS (
              SELECT m.member, ARRAY[m.roleid, m.member]::oid[]
              FROM pg_auth_members m
              WHERE m.roleid = (SELECT oid FROM pg_roles WHERE rolname = 'service_role')
              UNION ALL
              SELECT m.member, reach.membership_path || m.member
              FROM reach
              JOIN pg_auth_members m ON m.roleid = reach.member_oid
              WHERE NOT m.member = ANY(reach.membership_path)
            )
            SELECT jsonb_build_object(
              'member', member_role.rolname,
              'member_inherit', member_role.rolinherit,
              'path', ARRAY(
                SELECT path_role.rolname
                FROM unnest(reach.membership_path) WITH ORDINALITY path(oid, ord)
                JOIN pg_roles path_role ON path_role.oid = path.oid
                ORDER BY path.ord
              )
            )::text
            FROM reach
            JOIN pg_roles member_role ON member_role.oid = reach.member_oid
            ORDER BY member_role.rolname, cardinality(reach.membership_path), reach.membership_path::text
          " > /tmp/service-role-paths.jsonl
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT jsonb_build_object(
              'granted_role', granted_role.rolname,
              'member_role', member_role.rolname,
              'inherit_option', membership.inherit_option,
              'set_option', membership.set_option,
              'admin_option', membership.admin_option
            )::text
            FROM pg_auth_members membership
            JOIN pg_roles granted_role ON granted_role.oid = membership.roleid
            JOIN pg_roles member_role ON member_role.oid = membership.member
            WHERE granted_role.rolname IN ('service_role', 'authenticator')
              AND member_role.rolname IN (
                'authenticator', 'postgres', 'supabase_realtime_admin',
                'supabase_storage_admin'
              )
            ORDER BY granted_role.rolname, member_role.rolname
          " > /tmp/service-role-edges.jsonl
          test -s /tmp/mcp-exec-many-function.sql
          test -s /tmp/service-role-paths.jsonl
          test -s /tmp/service-role-edges.jsonl

      - name: Verificar ACL e contrato de mcp_exec
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: >-
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1
          -f scripts/db-audit/check-mcp-exec-acl.sql

      - name: Regenerar catalogo e comparar com o commitado
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          umask 077
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At \
            -f scripts/db-audit/catalog.sql > /tmp/fresh-catalog.json
          test -s /tmp/fresh-catalog.json
          node scripts/db-audit/check-catalog-fresh.mjs /tmp/fresh-catalog.json

      - name: Regenerar manifesto e comparar com o commitado
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          umask 077
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At \
            -f scripts/db-audit/manifest.sql > /tmp/fresh-manifest.json
          test -s /tmp/fresh-manifest.json
          node scripts/db-audit/check-manifest-fresh.mjs /tmp/fresh-manifest.json

      - name: Verificar frescor do types.ts
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          umask 077
          bash scripts/db-audit/gen-types.sh /tmp/types.fresh.ts
          test -s /tmp/types.fresh.ts
          grep -v '^// ' /tmp/types.fresh.ts > /tmp/types.fresh.stripped
          grep -v '^// ' src/integrations/supabase/types.ts > /tmp/types.repo.stripped
          if ! diff -q /tmp/types.fresh.stripped /tmp/types.repo.stripped > /dev/null 2>&1; then
            echo "::error::types.ts desatualizado. Execute o types-sync para abrir o PR de sincronizacao."
            diff /tmp/types.repo.stripped /tmp/types.fresh.stripped | head -30 || true
            exit 1
          fi
          echo "OK: types.ts em sincronia com o banco."

      - name: Publicar evidencias estruturais
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/fresh-catalog.json
            /tmp/fresh-manifest.json
            /tmp/mcp-exec-many-function.sql
            /tmp/service-role-edges.jsonl
            /tmp/service-role-paths.jsonl
          if-no-files-found: ignore
          retention-days: 3
