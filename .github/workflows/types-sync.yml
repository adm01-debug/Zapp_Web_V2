# ==================================================================
# ZAPP-WEB · Sincronizacao assistida dos artefatos do banco
# ==================================================================
# Consulta o banco somente em eventos confiaveis da main. Quando encontra
# drift, valida os artefatos e abre/atualiza um PR; nunca faz push direto na
# main. Isso continua funcionando quando a branch protection for ativada.
#
# TYPES_SYNC_PR_TOKEN (recomendado): token fine-grained/GitHub App com
# contents:write e pull_requests:write. Ele permite que o PR criado dispare
# os checks normais. Sem ele, o workflow usa GITHUB_TOKEN; nesse caso o repo
# precisa permitir criacao de PR por Actions e os checks podem exigir aprovacao
# manual, conforme as politicas anti-loop do GitHub.
# ==================================================================

name: types-sync

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db-audit/**'
      - '.github/workflows/types-sync.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: types-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.116.0'

jobs:
  sync:
    name: Propor sync de types + catalogo + manifesto
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout confiavel da main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Exigir credencial do banco oficial
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
          TYPES_SYNC_PR_TOKEN: ${{ secrets.TYPES_SYNC_PR_TOKEN }}
        run: |
          if [ -z "$DESTINO_URL" ]; then
            echo "::error::DESTINO_URL nao configurado."
            exit 1
          fi
          if [ -z "$TYPES_SYNC_PR_TOKEN" ]; then
            echo "::warning::TYPES_SYNC_PR_TOKEN ausente; usando GITHUB_TOKEN. O PR pode exigir aprovacao manual dos checks."
          fi
          node --input-type=module <<'NODE'
          import {
            carregarIdentidadeEsperada,
            validarDestino,
          } from './scripts/db-audit/database-identity.mjs';
          const identidade = carregarIdentidadeEsperada('scripts/db-audit/database-identity.json');
          const erros = validarDestino(process.env.DESTINO_URL, identidade);
          for (const erro of erros) console.error('ERRO: ' + erro);
          if (erros.length) process.exit(1);
          console.log('OK: endpoint do banco oficial comprovado por fingerprint.');
          NODE

      - name: Gerar candidatos em diretorio temporario
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          umask 077
          bash scripts/db-audit/gen-types.sh /tmp/types.new.ts
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At \
            -f scripts/db-audit/catalog.sql > /tmp/catalog.new.json
          psql "$DESTINO_URL" -X -v ON_ERROR_STOP=1 -At \
            -f scripts/db-audit/manifest.sql > /tmp/manifest.new.json

          TYPE_SIZE=$(wc -c < /tmp/types.new.ts)
          echo "types.ts gerado: ${TYPE_SIZE} bytes"
          if [ "$TYPE_SIZE" -lt 102400 ]; then
            echo "::error::types.ts menor que 100KB; a identidade do banco precisa ser revisada."
            exit 1
          fi
          test -s /tmp/catalog.new.json
          test -s /tmp/manifest.new.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/catalog.new.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.new.json', 'utf8'))"

      # Contrato dos checkers: 0=igual, 1=drift valido, 2=erro/identidade.
      # Apenas exit 1 pode virar proposta de atualizacao.
      - name: Classificar drift com identidade comprovada
        id: diff
        env:
          DESTINO_URL: ${{ secrets.DESTINO_URL }}
        run: |
          grep -v '^// ' /tmp/types.new.ts > /tmp/types.new.stripped
          grep -v '^// ' src/integrations/supabase/types.ts > /tmp/types.old.stripped

          if diff -q /tmp/types.new.stripped /tmp/types.old.stripped > /dev/null 2>&1; then
            TYPES_CHANGED=false
          else
            TYPES_CHANGED=true
          fi

          set +e
          node scripts/db-audit/check-catalog-fresh.mjs /tmp/catalog.new.json
          CATALOG_STATUS=$?
          node scripts/db-audit/check-manifest-fresh.mjs /tmp/manifest.new.json
          MANIFEST_STATUS=$?
          set -e

          case "$CATALOG_STATUS" in
            0) CATALOG_CHANGED=false ;;
            1) CATALOG_CHANGED=true ;;
            *) echo "::error::Catalogo candidato rejeitado (erro ou identidade nao comprovada)."; exit 1 ;;
          esac
          case "$MANIFEST_STATUS" in
            0) MANIFEST_CHANGED=false ;;
            1) MANIFEST_CHANGED=true ;;
            *) echo "::error::Manifesto candidato rejeitado (erro ou identidade nao comprovada)."; exit 1 ;;
          esac

          if [ "$TYPES_CHANGED" = true ] || [ "$CATALOG_CHANGED" = true ] || [ "$MANIFEST_CHANGED" = true ]; then
            SCHEMA_CHANGED=true
          else
            SCHEMA_CHANGED=false
          fi

          echo "types_changed=${TYPES_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "catalog_changed=${CATALOG_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "manifest_changed=${MANIFEST_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "schema_changed=${SCHEMA_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Drift: types=${TYPES_CHANGED}, catalogo=${CATALOG_CHANGED}, manifesto=${MANIFEST_CHANGED}"

      - name: Finalizar se nao houver drift
        if: steps.diff.outputs.schema_changed != 'true'
        run: echo "Banco e artefatos commitados estao em sincronia."

      - name: Aplicar candidatos no worktree
        if: steps.diff.outputs.schema_changed == 'true'
        run: |
          if [ "${{ steps.diff.outputs.types_changed }}" = true ]; then
            cp /tmp/types.new.ts src/integrations/supabase/types.ts
          fi
          if [ "${{ steps.diff.outputs.catalog_changed }}" = true ]; then
            cp /tmp/catalog.new.json supabase/schema-catalog.json
          fi
          if [ "${{ steps.diff.outputs.manifest_changed }}" = true ]; then
            cp /tmp/manifest.new.json supabase/schema-manifest.json
          fi

      # Se um gate bloquear a proposta (ex.: Gate 3, remocoes > 10 linhas),
      # nenhum PR e aberto e os candidatos ficam presos no runner efemero.
      # Publica os 3 candidatos como artifact para revisao/aplicacao manual,
      # independente do resultado dos gates.
      - name: Publicar candidatos como artifact
        if: steps.diff.outputs.schema_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: types-sync-candidates-${{ github.run_id }}
          path: |
            src/integrations/supabase/types.ts
            supabase/schema-catalog.json
            supabase/schema-manifest.json
          retention-days: 14

      - name: Setup Bun
        if: steps.diff.outputs.schema_changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Instalar dependencias
        if: steps.diff.outputs.schema_changed == 'true'
        run: bun install --frozen-lockfile

      - name: Gate 1 — TypeScript compila
        id: gate1
        if: steps.diff.outputs.schema_changed == 'true'
        run: |
          if bunx tsc --noEmit -p tsconfig.app.json 2>&1 | tee /tmp/tsc.log; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gate 1 falhou: erros de TypeScript."
          fi

      - name: Gate 2 — usage-guard
        id: gate2
        if: steps.diff.outputs.schema_changed == 'true' && steps.gate1.outputs.passed == 'true'
        run: |
          if node scripts/db-audit/supabase-usage-guard.mjs 2>&1 | tee /tmp/guard.log; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gate 2 falhou: violacoes no usage-guard."
          fi

      - name: Gate 3 — remocoes destrutivas
        id: gate3
        if: steps.diff.outputs.schema_changed == 'true' && steps.gate2.outputs.passed == 'true'
        run: |
          REMOVED=$(diff /tmp/types.old.stripped /tmp/types.new.stripped | grep -c '^<' || true)
          echo "Linhas removidas do types.ts: ${REMOVED}"
          if [ "$REMOVED" -gt 10 ]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gate 3 requer revisao humana: ${REMOVED} linhas removidas."
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Garantir label types-sync
        if: steps.diff.outputs.schema_changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'types-sync',
                color: '0075ca',
                description: 'Sincronizacao automatizada de artefatos do banco'
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

      - name: Registrar falha dos gates
        if: >-
          steps.diff.outputs.schema_changed == 'true' &&
          (steps.gate1.outputs.passed == 'false' ||
           steps.gate2.outputs.passed == 'false' ||
           steps.gate3.outputs.passed == 'false')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const gate1 = '${{ steps.gate1.outputs.passed }}';
            const gate2 = '${{ steps.gate2.outputs.passed }}';
            const gate3 = '${{ steps.gate3.outputs.passed }}';
            const failed = gate1 === 'false' ? 'TypeScript' :
              gate2 === 'false' ? 'usage-guard' : 'remocoes destrutivas';
            const fs = require('fs');
            const excerpt = gate1 === 'false' && fs.existsSync('/tmp/tsc.log')
              ? fs.readFileSync('/tmp/tsc.log', 'utf8').slice(0, 2000)
              : gate2 === 'false' && fs.existsSync('/tmp/guard.log')
                ? fs.readFileSync('/tmp/guard.log', 'utf8').slice(0, 2000)
                : '';
            const title = '[types-sync] Falha ao propor sincronizacao';
            const body = [
              `**Gate:** ${failed}`,
              `**Commit da main:** ${{ github.sha }}`,
              `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              excerpt ? `\n\`\`\`\n${excerpt}\n\`\`\`` : ''
            ].filter(Boolean).join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'types-sync'
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['types-sync'],
                body
              });
            }

      - name: Falhar quando um gate rejeitar a proposta
        if: >-
          steps.diff.outputs.schema_changed == 'true' &&
          (steps.gate1.outputs.passed == 'false' ||
           steps.gate2.outputs.passed == 'false' ||
           steps.gate3.outputs.passed == 'false')
        run: |
          echo "::error::A sincronizacao foi bloqueada por um ou mais gates."
          exit 1

      - name: Abrir ou atualizar PR de sincronizacao
        id: pull-request
        if: >-
          steps.diff.outputs.schema_changed == 'true' &&
          steps.gate1.outputs.passed == 'true' &&
          steps.gate2.outputs.passed == 'true' &&
          steps.gate3.outputs.passed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TYPES_SYNC_PR_TOKEN || github.token }}
          base: main
          branch: automation/types-sync
          delete-branch: true
          commit-message: 'chore(db): sincronizar artefatos com o banco [auto]'
          title: 'chore(db): sincronizar types, catálogo e manifesto'
          body: |
            Sincronização automatizada a partir do banco oficial.

            - main de origem: `${{ github.sha }}`
            - types.ts alterado: `${{ steps.diff.outputs.types_changed }}`
            - catálogo alterado: `${{ steps.diff.outputs.catalog_changed }}`
            - manifesto alterado: `${{ steps.diff.outputs.manifest_changed }}`
            - gates TypeScript, usage-guard e remoções: aprovados

            Revisão humana e checks da PR continuam obrigatórios.
          labels: types-sync
          add-paths: |
            src/integrations/supabase/types.ts
            supabase/schema-catalog.json
            supabase/schema-manifest.json

      - name: Exigir PR criado ou atualizado
        if: >-
          steps.diff.outputs.schema_changed == 'true' &&
          steps.gate1.outputs.passed == 'true' &&
          steps.gate2.outputs.passed == 'true' &&
          steps.gate3.outputs.passed == 'true'
        run: |
          if [ -z "${{ steps.pull-request.outputs.pull-request-number }}" ]; then
            echo "::error::Havia drift validado, mas nenhum PR foi criado ou atualizado."
            exit 1
          fi
          echo "PR #${{ steps.pull-request.outputs.pull-request-number }} pronto para revisao."

      - name: Job summary
        if: always()
        run: |
          {
            echo "## types-sync — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Item | Alterado |"
            echo "|---|---|"
            echo "| types.ts | ${{ steps.diff.outputs.types_changed || 'n/a' }} |"
            echo "| schema-catalog.json | ${{ steps.diff.outputs.catalog_changed || 'n/a' }} |"
            echo "| schema-manifest.json | ${{ steps.diff.outputs.manifest_changed || 'n/a' }} |"
            echo "| PR | ${{ steps.pull-request.outputs.pull-request-number || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
