# docs:
#   gatilho: push em main que toque código, banco, scripts das automações ou docs/contexto/regras/manual/; a cada 10 min (minuto 3); dispatch
#   prova: branch contexto com docs/contexto/{codigo,supabase,regras}/ regerados das três fontes de verdade (código em main, banco oficial, código+migrations+manual/) e docs/contexto/00-INDEX.md montado a partir dos manifests
#   falha: o job que falhou fica vermelho e a sua pasta mantém a última versão boa na branch; os outros publicam normalmente (jobs independentes)
#   avisa: ninguém (a branch contexto é a prova; errors.md em supabase/ e erros_do_gerador em codigo/ listam seções com falha)
# nao-e-bug:
#   - sem-commit: "nada mudou" no publicar significa que nenhuma das três fontes mudou desde a última publicação
#   - metricas: mudanças só em stats/cron-runs do snapshot são comitadas no máximo 1x por hora
#   - banco-pulado: sem o secret SUPABASE_DB_URL o job do banco sai verde com aviso e a pasta supabase/ fica como estava
name: Contexto para agentes de IA (10 min)

# UM workflow, TRÊS produtores independentes (um job cada, continue-on-error), UM índice, UMA branch:
#
#   codigo/   ← scripts/ai-context/gerar.mjs   (rotas, módulos, hooks, edges, grafo, testes, convenções, baseline)
#   supabase/ ← scripts/supabase_snapshot/     (banco OFICIAL ao vivo: tabelas, RLS, funções, triggers, cron, lints)
#   regras/   ← scripts/regras_negocio/        (regras de negócio: RLS por operação, estados, validações, fórmulas, lacunas, manual/)
#   00-INDEX.md ← scripts/regras_negocio/indice.py (lê o manifest.json de cada pasta; diz quem é dono de cada fato)
#
# Cada fato tem um dono: schema real = supabase/; onde fica o código = codigo/; o que pode/não pode = regras/.
# Onde fica: branch `contexto` (gerada, com histórico; nunca abra PR dela). A main tem branch protection
# (push direto = GH006) e um PR a cada 10 min dispararia o CI inteiro. Push com GITHUB_TOKEN não dispara
# outros workflows (anti-loop). A Vercel não builda a branch (vercel.json próprio com ignoreCommand).
# Como ler: git fetch origin contexto && git show origin/contexto:docs/contexto/00-INDEX.md, ou MCP
# get_file(ref=contexto), ou raw.githubusercontent.com/<owner>/<repo>/contexto/docs/contexto/00-INDEX.md.
# Custo: no agendamento, codigo/ e regras/ saem em segundos se a main não mudou; supabase/ sempre coleta.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'api/**'
      - 'server/**'
      - 'scripts/ai-context/**'
      - 'scripts/regras_negocio/**'
      - 'scripts/supabase_snapshot/**'
      - 'docs/contexto/regras/manual/**'
      - 'package.json'
      - 'tsconfig*.json'
      - '.env.example'
      - '.github/workflows/**'
  schedule:
    - cron: '3-59/10 * * * *' # minuto 3: fora do minuto 0 (fila do GitHub) e dos outros crons do repo
  workflow_dispatch:
    inputs:
      graphify:
        description: 'Rodar graphify (grafo por AST) no job de código'
        type: boolean
        default: true
      force:
        description: 'Regenerar tudo ignorando o estado anterior da branch'
        type: boolean
        default: false

concurrency:
  group: contexto
  cancel-in-progress: false # push em main nunca é cancelado; o gate por commit evita trabalho repetido

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CONTEXTO_BRANCH: contexto
  CONTEXTO_DIR: docs/contexto

jobs:
  gate:
    name: O que precisa rodar
    # O dispatch não deve executar código de uma ref arbitrária com token de escrita.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.g.outputs.codigo }}
      regras: ${{ steps.g.outputs.regras }}
      banco: ${{ steps.g.outputs.banco }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Comparar HEAD de main com os manifests da branch contexto
        id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          head="$(git rev-parse HEAD)"
          last_codigo=""; last_regras=""
          if git fetch -q --depth=1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
            last_codigo="$(git show "FETCH_HEAD:$COTEXTO_DIR/codigo/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
            last_regras="$(git show "FETCH_HEAD:$CONTEXTO_DIR/regras/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
          fi
          codigo=true; regras=true
          if [ "$EVENT_NAME" = "schedule" ] && [ "$FORCE" != "true" ]; then
            [ "$head" = "$last_codigo" ] && codigo=false
            [ "$head" = "$last_regras" ] && regras=false
          fi
          # banco muda sem push: no schedule/dispatch coleta sempre; no push só coleta se o
          # snapshot tem mais de 60 min (banco muda sem commit — push frequente desperdiçaria créditos)
          banco=true
          if [ "$EVENT_NAME" = "push" ] && [ "$FORCE" != "true" ]; then
            SNAP_TS=""
            if git fetch -q --depth=1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
              SNAP_TS="$(git show "FETCH_HEAD:$CONTEXTO_DIR/supabase/manifest.json" 2>/dev/null \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("generated_at",""))' 2>/dev/null || echo "")"
            fi
            if [ -n "$SNAP_TS" ]; then
              SNAP_EPOCH=$(python3 -c "import datetime; print(int(datetime.datetime.fromisoformat('${SNAP_TS}'.replace('Z','+00:00')).timestamp()))" 2>/dev/null || echo 0)
              AGE_MIN=$(( ( $(date +%s) - SNAP_EPOCH ) / 60 ))
              [ "$AGE_MIN" -lt 60 ] && banco=false
            fi
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "regras=$regras" >> "$GITHUB_OUTPUT"
          echo "banco=$banco" >> "$GITHUB_OUTPUT"
          echo "head=$head codigo=$codigo (último $last_codigo) regras=$regras (último $last_regras) banco=$banco"
