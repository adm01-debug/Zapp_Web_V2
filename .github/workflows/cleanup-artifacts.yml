# docs:
#   gatilho: dispatch e agendado (semanal, domingo)
#   prova: apaga artifacts criados há mais de 14 dias; reporta contagem final
#   falha: erros individuais de DELETE são contabilizados mas não travam (warning)
#   avisa: não
# =============================================================================
# Limpeza semanal de artifacts antigos (W47)
# =============================================================================
# GitHub retém artifacts indefinidamente quando nenhuma política está
# configurada. artifact_and_log_retention_days=14 foi aplicado ao repo,
# mas não apaga retroativamente os existentes. Este workflow remove os
# artifacts criados há mais de 14 dias usando `gh api` com paginação.
# =============================================================================

name: Cleanup Old Artifacts

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * 0' # domingo, 03:17 UTC (fora do minuto 0)

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: cleanup-old-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    name: Apagar artifacts > 14 dias
    # Permissão apenas no job (zizmor: excessive-permissions proíbe write no topo)
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Apagar artifacts antigos
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RETENTION_DAYS: '14'
        run: |
          cutoff=$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Apagando artifacts criados antes de $cutoff"

          deleted=0
          errors=0

          # Coleta IDs de todos os artifacts mais velhos que o cutoff (todas as páginas)
          while IFS= read -r artifact_id; do
            if gh api --method DELETE "repos/$REPO/actions/artifacts/$artifact_id" 2>/dev/null; then
              deleted=$((deleted + 1))
            else
              errors=$((errors + 1))
            fi
          done < <(
            gh api "repos/$REPO/actions/artifacts?per_page=100" \
              --paginate \
              --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id | tostring"
          )

          remaining=$(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq '.total_count')

          echo "Artifacts apagados: $deleted"
          echo "Erros ao apagar: $errors"
          echo "Restantes: $remaining"

          {
            echo "## 🧹 Limpeza de artifacts"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Cutoff | \`$cutoff\` |"
            echo "| Apagados | $deleted |"
            echo "| Erros | $errors |"
            echo "| Restantes | $remaining |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "::warning::$errors artifacts não puderam ser apagados (sem permissão ou já expirados)"
          fi
