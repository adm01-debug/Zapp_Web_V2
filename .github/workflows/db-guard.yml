# docs:
#   gatilho: pull_request, push na main, merge_group e dispatch
#   prova: guardas OFFLINE do banco (nunca recebe DESTINO_URL, roda codigo de PR)
#   falha: PR fica vermelho; nenhum codigo de PR alcanca o banco de producao
#   avisa: autor do PR e revisor
# ==================================================================
# ZAPP-WEB · Guardas de banco OFFLINE
# ==================================================================
# Este workflow nunca recebe DESTINO_URL e pode executar codigo de PRs.
# Consultas ao banco oficial ficam isoladas em db-live-guard.yml, que nao
# possui gatilho pull_request e so aceita refs/heads/main.
# ==================================================================

name: DB Guard (offline)

on:
  # Sem filtro de paths: o nome do check precisa existir em todo PR para poder
  # ser exigido pela branch protection sem bloquear diffs apenas de docs.
  # E23: 'develop' removido — branch nao existe no repo (so main).
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Fila de merge: sem este gatilho o check required nunca reportaria no merge
  # group e a fila travaria todos os merges do repo.
  merge_group:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: db-guard-offline-${{ github.event.pull_request.number || github.ref }}
  # E21 (auditoria de GitHub Actions, 2026-09-26): cancelava TODO push na
  # main, inclusive comparado a um commit anterior ja em analise — igual ao
  # ci.yml, so cancela push NOVO na MESMA PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-contract:
    name: Contrato DB offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # E47: um PostgreSQL 17 compartilhado para todos os ~48 testes de contrato.
    # O docker-shim intercepta `docker run/exec/rm` e roteia cada teste para
    # um banco isolado (CREATE/DROP DATABASE por invocação) no mesmo serviço,
    # eliminando o overhead de inicialização individual de containers.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: shim_test_password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_IMAGE: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      POSTGREST_TEST_IMAGE: public.ecr.aws/supabase/postgrest:v14.5@sha256:bb289d00570b569525e1e22fb77c49cd17c17ca3f41da9ee2b4351a35027551b
      # E47: coordenadas do serviço compartilhado, lidas pelo docker-shim.
      POSTGRES_SERVICE_HOST: localhost
      POSTGRES_SERVICE_PORT: "5432"
      POSTGRES_SERVICE_USER: postgres
      POSTGRES_SERVICE_PASS: shim_test_password
      DOCKER_SHIM_STATE_DIR: /tmp/docker-shim-state
    permissions:
      contents: read
      # pull-requests: read apenas para o passo de imutabilidade abaixo (lista
      # os arquivos do PR via API).
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # E49 (auditoria de GitHub Actions, 2026-09-26): ataca a causa raiz dos
      # drifts documentados no CLAUDE.md (02/09, 04/09, 24-26/09) — um arquivo
      # em supabase/migrations/ editado DEPOIS de já ter sido aplicado em
      # produção (ou já mergeado) nunca deveria voltar a mudar; a regra 7 da
      # seção 1 do CLAUDE.md já manda isso, mas nada impedia um PR de violá-la
      # antes deste guard. Só roda em pull_request (a API de arquivos do PR
      # não existe em push/schedule/dispatch).
      - name: Rejeitar edicao de migration ja existente
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const arquivos = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            // So bloqueia 'modified' (conteudo mudou, MESMO nome de arquivo) —
            // e exatamente o padrao do incidente de 26/09 (arquivo editado
            // depois de aplicado, drift entre ledger e disco). 'renamed' fica
            // de fora de proposito: e uso legitimo e documentado no CLAUDE.md
            // (ex.: PRs #856/#860, renomear para a version real do ledger
            // antes de qualquer aplicacao); 'removed' tambem fica de fora
            // (mudanca para _foreign/_superseded, arquivo morto).
            // Mas um 'renamed' com additions/deletions > 0 e o MESMO gap por
            // outra porta: o conteudo mudou junto com o nome, disfarcado de
            // rename puro (achado da auditoria de 5 agentes de 2026-09-27).
            const candidatas = arquivos.filter(
              (f) => /^supabase\/migrations\/\d{14}_.*\.sql$/.test(f.filename)
                && (f.status === 'modified'
                  || (f.status === 'renamed' && ((f.additions || 0) > 0 || (f.deletions || 0) > 0))),
            );
            // Excecao 1: promocao de stub comment-only para SQL real e permitida.
            // Ocorre quando uma migration foi aplicada via MCP diretamente (sem
            // passar pelo fluxo arquivo->PR), criando um stub em main com apenas
            // comentarios. O db-live-guard exige que o arquivo corresponda ao
            // ledger, entao o stub precisa ser promovido. Um arquivo e
            // comment-only quando cada linha nao-vazia comeca com '--'.
            //
            // Excecao 2: arquivo com kind='ledger-only/name-and-file-pinned' no
            // migration-evidence.json — esses arquivos existem apenas como
            // documentacao de DDL aplicado via MCP sem SQL executavel no ledger.
            // Correcoes de documentacao (ex.: nome de tabela errado no arquivo)
            // sao permitidas porque nao ha SQL historico imutavel a preservar.
            // O drift checker (check-migration-drift.mjs) ainda valida que o
            // file_sha256 no evidence bate com o arquivo corrigido.
            const evidenceRaw = require('fs').readFileSync('scripts/db-audit/migration-evidence.json', 'utf8');
            const evidence = JSON.parse(evidenceRaw);
            const baseSha = context.payload.pull_request.base.sha;
            const violacoes = [];
            for (const f of candidatas) {
              // Excecao 2: kind ledger-only/name-and-file-pinned no evidence
              const basename = f.filename.split('/').pop();
              const entry = (evidence.exceptions || []).find(e => e.filename === basename);
              if (entry && entry.kind === 'ledger-only/name-and-file-pinned') continue;
              if (f.status === 'modified') {
                try {
                  const resp = await github.rest.repos.getContent({
                    owner, repo, path: f.filename, ref: baseSha,
                  });
                  const text = Buffer.from(resp.data.content, 'base64').toString('utf-8');
                  // Excecao 1: comment-only
                  const isCommentOnly = text.split('\n').every(
                    (l) => l.trim() === '' || l.trim().startsWith('--'),
                  );
                  if (isCommentOnly) continue;
                } catch (_) {
                  // Se nao conseguir buscar o base, trata como violacao (safe default).
                }
              }
              violacoes.push(f);
            }
            if (violacoes.length > 0) {
              const lista = violacoes.map((f) => f.filename).join('\n  - ');
              core.setFailed(
                'Este PR edita o CONTEUDO de uma migration que ja existe, com o '
                + 'mesmo nome ou renomeada (regra 7 da secao 1 do CLAUDE.md — '
                + 'statements no ledger e o SQL real e completo; um arquivo ja '
                + 'aplicado nao pode mudar depois):\n  - '
                + lista
                + '\n\nSe o objetivo e corrigir algo ja aplicado, crie um NOVO '
                + 'arquivo com version maior contendo a correcao (nunca edite o '
                + 'antigo). Renomear um arquivo que nunca foi registrado/aplicado '
                + 'continua permitido.',
              );
            }

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # O guard de subscriptions usa a API AST do TypeScript para rejeitar
      # nomes de tabela dinamicos sem recorrer a regex permissiva. O checkout
      # limpo do runner nao possui essa devDependency ate o install frozen.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Cache do Bun (instalacao)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Instalar dependencias do guard AST
        run: bun install --frozen-lockfile --ignore-scripts

      # O teste de integracao da V02 fala com um PostgREST real e e escrito em
      # Deno, como os testes da edge. Mesma action e mesmo SHA pinado do ci.yml
      # (o guard nao instala Deno em nenhum outro passo).
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      - name: Validar .from() e .rpc() contra o catalogo
        run: node scripts/db-audit/supabase-usage-guard.mjs

      - name: Validar subscriptions contra a publicacao Realtime
        run: node scripts/db-audit/check-realtime-subscriptions.mjs

      - name: Testar comparadores de catalogo, manifesto e migrations
        run: |
          testes_db=()
          for teste_db in scripts/db-audit/*.test.mjs; do
            [[ "$teste_db" == "scripts/db-audit/talkx-engine-window-contract.test.mjs" ]] && continue
            testes_db+=("$teste_db")
          done
          node --test "${testes_db[@]}"

      # O contrato Talk X sobe seu proprio PostgreSQL. Em paralelo com a suite
      # acima, outros contratos tambem iniciam containers e podem derrubar o
      # socket durante o bootstrap; rode-o isolado e repita somente falhas de
      # bootstrap, nunca erros SQL/assertions.
      - name: Provar contrato Talk X de janela de envio em PostgreSQL descartavel
        env:
          TALKX_WINDOW_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          POSTGREST_TEST_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh node --test scripts/db-audit/talkx-engine-window-contract.test.mjs

      # E47: instala o docker-shim no PATH antes do primeiro step que usa docker.
      # A partir daqui, `docker` aponta para o shim que roteia run/exec/rm para
      # o serviço postgres compartilhado. SKIP_DOCKER_SHIM=1 no step do PostgREST
      # (abaixo) desvia o shim e usa o docker real para subir o container PostgREST.
      - name: Instalar docker-shim (E47)
        run: |
          mkdir -p "$HOME/.local/bin"
          cp scripts/db-audit/docker-shim "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # E47: SKIP_DOCKER_SHIM=1 — este test cria dois bancos (db_a, db_b) no
      # mesmo container e roda DDL identico em cada um. O shim mapeia um
      # container a um unico banco; -d db_a e -d db_b roteariam para o mesmo
      # banco, causando "already exists" na segunda iteracao. O test acessa
      # postgres via docker exec (socket Unix interno), nao via localhost:5432,
      # entao nao colide com o servico compartilhado.
      - name: Validar SQL de catalogo e manifesto no PostgreSQL 17
        env:
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/catalog-manifest.test.sh

      - name: Provar politica confiavel do rate limit do catalogo
        env:
          CATALOG_RATE_LIMIT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/catalog-rate-limit-policy-pinned.test.sh
      - name: Simular politica confiavel do rate limit do catalogo
        env:
          CATALOG_RATE_LIMIT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/catalog-rate-limit-policy-pinned.test.sh

      - name: Testar normalizacao deterministica dos tipos gerados
        run: bash scripts/db-audit/gen-types.test.sh

      # Sem DESTINO_URL: valida nomes, duplicatas e conteudo local das
      # migrations, mas nao consulta schema_migrations.
      - name: Validar migrations localmente
        run: node scripts/db-audit/check-migration-drift.mjs

      # Assinaturas de e-mail (email_signatures): o contrato de RLS e lido/escrito
      # como os papeis reais (authenticated/anon), nunca como postgres.
      - name: Simular contrato de acesso das assinaturas de e-mail (email_signatures)
        env:
          EMAIL_SIGNATURES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/email-signatures-rls.test.sh
      # Auto-reconexao de conexoes WhatsApp: o contrato de RLS/ACL do historico
      # (reconnection_logs) e da view whatsapp_connections_safe e lido/escrito
      # como os papeis reais (authenticated/anon/service_role), nunca como postgres.
      - name: Simular contrato de acesso da auto-reconexao de conexoes
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/auto-reconnect-logs.test.sh

      # Harness descartavel na mesma major do banco oficial. Exercita o SQL real e
      # prova que cada regressao de ACL/contrato encerra com codigo nao zero.
      - name: Simular regressões do contrato mcp_exec
        env:
          ACL_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-mcp-exec-acl.test.sh

      - name: Simular regressões da ACL de webhook failures
        env:
          WEBHOOK_ACL_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-webhook-failures-acl.test.sh

      # SEC-RLS_CONTATOS_MENSAGENS-05 (P2 defesa em profundidade): 17 tabelas de
      # contatos/mensagens concediam a `anon` os 8 privilegios de tabela (inclusive
      # TRUNCATE, que ignora RLS). O harness reproduz a ACL legada, aplica a migration
      # real e prova anon=0 com authenticated/service_role intactos; SKIP_DOCKER_SHIM=1
      # porque o teste cria os papeis anon/authenticated/service_role (globais no
      # cluster) e inicia container proprio, incompativel com o shim do E47.
      - name: Simular revogacao dos privilegios de anon nas 17 tabelas de contatos/mensagens (SEC-RLS_CONTATOS_MENSAGENS-05)
        env:
          ANON_PRIVS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/anon-privileges-contact-messages.test.sh

      # M-DB-02: nenhuma SECURITY DEFINER de public com EXECUTE para PUBLIC/anon
      # (a T26 abriu uma assim por create or replace com parametro novo).
      - name: Simular SECURITY DEFINER aberta para PUBLIC/anon
        env:
          SECDEF_EXEC_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-secdef-public-execute.test.sh

      # M-DB-05 / item 474: as 13 SECURITY DEFINER de public executaveis por qualquer
      # usuario logado sem checagem do chamador vazam papel/permissao/config. A prova
      # aplica o arquivo inteiro da migration 20261007004545 no PostgreSQL descartavel;
      # a guarda acima (M-DB-02) so olha EXECUTE para PUBLIC/anon,
      # que nao cobre `authenticated`.
      - name: Simular chamador ausente nas SECURITY DEFINER expostas
        env:
          SECD_CALLER_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/secd-caller-check.test.sh

      # Guarda geral dos invariantes do banco vivo (nao vacua, nao frouxa): RLS em toda
      # tabela de public, security_invoker em toda view, matview exposta a anon/authenticated,
      # search_path em SECURITY DEFINER, policy de escrita aberta e referencia pendurada em
      # funcao/RPC e em comando de cron. A prova monta cada violacao, exige o bloqueio,
      # desfaz e exige verde.
      - name: Simular violações dos invariantes gerais do banco vivo
        env:
          LIVE_INVARIANTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-live-invariants.test.sh

      - name: Provar remoção do token legado da API pública
        env:
          PUBLIC_API_DISABLE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/public-api-disable.test.sh

      - name: Simular concorrência e integridade da fila CRM
        env:
          CRM_OUTBOX_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/crm-sync-outbox-behavior.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp_v2_inbox_authz_test_<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular autorização canônica do Inbox
        env:
          INBOX_AUTHZ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/inbox-contact-authorization.test.sh

      - name: Simular exclusão, status e grants canônicos de Contatos
        env:
          CONTACTS_F1_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/contacts-soft-delete-and-status.test.sh

      - name: Simular contatos legados fora por padrão (include_legacy)
        env:
          CONTACTS_F5_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/contacts-legacy-visibility.test.sh

      - name: Simular autorização de status de conversa e etiquetas de WhatsApp
        env:
          WA_TAG_AUTHZ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/wa-tag-and-status-authorization.test.sh

      - name: Simular escopo por conexão das etiquetas de WhatsApp (item 22 / TRA-006)
        env:
          WA_LABEL_SCOPE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/wa-label-connection-scope.test.sh

      - name: Simular autorização do INSERT em análises de conversa
        env:
          ANALYSES_AUTHZ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/conversation-analyses-authorization.test.sh

      - name: Simular autorização da LEITURA de análises/etiquetas por fila (L8)
        env:
          AI_READ_QUEUE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/ai-read-policies-queue-scope.test.sh

      - name: Simular autorização do notify_due_tasks (RPC sem guarda)
        env:
          NOTIFY_DUE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/notify-due-tasks-authorization.test.sh

      - name: Provar rearme de alarme quando remind_at muda
        env:
          TASKS_REARM_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/tasks-rearm-on-remind-change.test.sh
      # Item 72 (R2-AUTH-006): pedido anônimo de reset resolve a identidade no
      # servidor (auth.users), conta inexistente não grava nem revela, e o rate
      # limit anônimo responde igual ao caminho sem limite (silencioso).
      - name: Simular pedido anônimo de recuperação de senha (item 72)
        env:
          RECUPERACAO_ANONIMA_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/recuperacao-anonima-pedido-reset.test.sh

      # Item 265 (R2-AUTH-041): a consulta de custo do painel de IA recebia fim
      # nulo (janela aberta) e `created_at < NULL` eliminava todas as chamadas —
      # o relatório zerava enquanto o resumo de tokens mostrava os registros.
      - name: Simular janela aberta (fim nulo) na consulta de custo de IA (item 265)
        env:
          AI_USAGE_COST_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/ai-usage-cost-window-open.test.sh

      # DASH-ACCEPTANCE-001: as suítes supabase/tests/*.sql rodam como
      # service_role (BYPASSRLS) — nunca provam enforcement. Aqui as RPCs do
      # Dashboard rodam sob roles reais anon/authenticated (sem BYPASSRLS) com
      # fixtures determinísticas: EXECUTE negado a anon, RLS de leitura direta,
      # trava de p_agent em kpi/hourly, escopo RLS em counts, reconciliação
      # acima do cap de 1000 linhas e edge cases da E44 contra o código real.
      - name: Simular fronteira RLS das RPCs do Dashboard (DASH-091/092)
        env:
          DASH_RLS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/dashboard-rls-authorization.test.sh

      # L5 da matriz IA-004: os jobs do pg_cron autenticavam com a ANON KEY do projeto
      # (credencial pública, no bundle do front). O fixture cria STUBS de Vault/pg_cron
      # no container, aplica as duas migrations e prova: segredos dedicados de 32 bytes
      # gerados in-db, RPCs SECURITY DEFINER devolvendo o valor exato de cada segredo,
      # EXECUTE fechado para PUBLIC/anon/authenticated e aberto só para service_role,
      # jobs com o schedule original, sem Bearer e com x-cron-secret lido por subquery
      # do Vault — mais o BLOCO C, que remove o REVOKE numa cópia temporária da migration
      # (o arquivo do repo não é tocado) e exige que a asserção de ACL falhe.
      - name: Simular credencial dedicada de cron no Vault (L5)
        env:
