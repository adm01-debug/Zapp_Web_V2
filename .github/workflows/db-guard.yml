          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/email-rls-sem-ramo-admin.test.sh
      # DASHBOARD-03 (12/10/2026 · paridade V3 -> V2, doc 02-features-batch1): a
      # RPC public.dashboard_daily_series(p_days) devolve a serie diaria de
      # atividade (mensagens recebidas/enviadas, contatos novos, conversas
      # abertas/resolvidas, contatos ativos e mediana de resposta) no fuso de
      # America/Sao_Paulo. O contrato sobe postgres:17-alpine proprio, aplica a
      # migration REAL e prova: numeros batem com a contagem manual, admin e
      # supervisor leem, agente comum leva 42501, anon/PUBLIC sem EXECUTE,
      # service_role le, p_days limitado a 90 (piso 1), dia sem movimento com
      # mediana NULL, idempotencia e o Rollback remove a funcao. SKIP_DOCKER_SHIM
      # porque o readiness usa `docker logs` e as roles anon/authenticated/
      # service_role sao globais ao cluster (colidiriam com o shim do E47).
      - name: Provar a serie diaria de KPIs do dashboard (DASHBOARD-03)
        env:
          DASHBOARD_DAILY_SERIES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/dashboard-daily-series.test.sh

      # N-136 (P2 · banco, roteiro de recriacao): o runbook docs/runbooks/recriar-banco-local.md
      # documenta o comando para recriar o banco local do zero. O teste prova que o arquivo
      # existe, cita os caminhos corretos (replay-local.sh, supabase/migrations), nao menciona
      # o banco de producao e confere que os arquivos citados existem no repo.
      - name: Provar o runbook de recriacao do banco local (N-136)
        run: bash scripts/db-audit/recriar-banco-local.test.sh

      # N-142 (P3): message_reactions.user_id guarda public.profiles.id, nao auth.users.id.
      # O harness executa a migration real, valida o vermelho sem ela, o verde com
      # get_profile_id_for_user(auth.uid()) e os dois formatos de rollback executavel.
      # SKIP_DOCKER_SHIM=1 porque o teste cria roles globais anon/authenticated/service_role.
      - name: Provar leitura de reacoes pelo profile_id (N-142)
        env:
          N142_REACTIONS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/n142-message-reactions-select-user-id.test.sh
      # N-142 (P3 · seguranca): message_reactions.user_id guarda profiles.id, mas a
      # policy message_reactions_select_policy comparava com auth.uid() (auth user
      # uuid) — o autor nunca via a propria reacao. O teste aplica a migration real
      # num PostgreSQL 17 descartavel e prova com papel authenticated real: o autor
      # ve a propria reacao, estranho sem vinculo nao ve, admin ve tudo e o ramo
      # contact_id continua intacto; o -- Rollback: executa e restaura o corpo
      # anterior. Inicia container proprio e roda CREATE ROLE
      # anon/authenticated/service_role — as roles sao globais ao cluster, entao o
      # docker-shim do E47 colidiria com as do shim.
      - name: Provar leitura de reacoes pelo id certo do usuario (N-142)
        env:
          N142_REACTIONS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/n142-message-reactions-select-user-id.test.sh

      # X041: atribuicao de conversao ao ULTIMO toque do Talk X dentro da janela de atribuicao.
      - name: Provar atribuicao de conversao Talk X ao ultimo toque (X041)
        env:
          TALKX_ATTRIBUTION_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-attribution.test.sh

      # R2-API-036: defaults internos de currency/occurred_at quando o endpoint manda NULL explicito.
      - name: Provar defaults de conversao Talk X com NULL explicito (R2-API-036)
        env:
          TALKX_CONVERSION_DEFAULTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-conversion-defaults.test.sh

      # X040: calculo de recencia, frequencia, valor e segmento RFM a partir de contact_purchases.
      - name: Provar calculo RFM das compras locais Talk X (X040)
        env:
          TALKX_RFM_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-rfm.test.sh

      # TC-001 (#54): contrato de banco da midia do team chat — bucket, mensagem e renderizacao.
      - name: Provar contrato de banco da midia do team chat (TC-001)
        env:
          TEAM_CHAT_MEDIA_CONTRACT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/team-chat-media-contract.test.sh

      # Item 55 (P1): prova a garantia de banco contra criacao concorrente de conversa direta.
      - name: Provar corrida de criacao de conversa direta no team chat (item 55)
        env:
          TEAM_DIRECT_CONV_RACE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/team-direct-conversation-race.test.sh

      # SEC-...-06/-09: autorizacao dos INSERTs de conversation_tasks e conversation_events.
      - name: Provar autorizacao de INSERT de conversation_tasks e conversation_events
        env:
          CONV_TASKS_EVENTS_AUTH_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/conversation-tasks-events-insert-authorization.test.sh

      # TC-008 (item 163, P2): contrato de convites e vocabulario de auditoria do team chat.
      - name: Provar contrato de convites e vocabulario de auditoria do team chat (TC-008)
        env:
          DEPT_INVITE_VOCAB_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/department-invite-contract-audit-vocabulary.test.sh

      # IA-TIMEOUT-001 (item 44): outbox duravel do log essencial de IA.
      - name: Provar outbox duravel do log de uso de IA (IA-TIMEOUT-001)
        env:
          IA_USAGE_OUTBOX_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/ia-usage-outbox-duravel.test.sh
      # N-011 (P2 · banco, inventario A4): dedup de policies de leitura e exclusao
      # em storage.objects para avatar, figurinha, meme e emoji. A origem
      # (20260511233306) cria dois pares com USING identico em avatars e uma
      # policy por verbo em stickers, audio-memes e custom-emojis; o contrato
      # aplica os ARQUIVOS de migration reais num PostgreSQL 17 descartavel e
      # prova uma policy por bucket+verbo, o acesso efetivo por papel (dono
      # apaga o proprio, outro nao apaga o alheio, anonimo barrado) e o rollback.
      # Inicia container proprio e roda CREATE ROLE anon/authenticated — as roles
      # sao globais ao cluster, entao o docker-shim do E47 colidiria com as do shim.
      - name: Provar dedup de policies de avatar em storage (N-011)
        env:
          N011_AVATAR_DEDUP_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/n011-storage-avatar-policies-dedup.test.sh

      # n-148 (P3 · banco, SEC-RLS_TAREFAS_EMAIL_LIGACOES-07): o audit achou
      # is_admin_or_supervisor e get_own_gmail_accounts (ambas SECURITY DEFINER) com
      # search_path = public e sem pg_temp. O teste aplica as migrations REAIS num
      # PostgreSQL 17 descartavel, roda como o papel authenticated com request.jwt.claims,
      # e prova que temp tables hostis (user_roles/gmail_accounts) nao shadowam o resultado.
      - name: Provar search_path com pg_temp em is_admin_or_supervisor e get_own_gmail_accounts (n-148)
        env:
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/search_path_pg_temp_is_admin_get_own_gmail.test.sh

  # Gate do replay COMPLETO das migrations (cartao t_b6f4e82d). O replay-local.sh
  # existia e era provado so por harness offline; nenhum workflow o chamava, entao
  # nenhuma PR provava que o conjunto das migrations ainda aplica do zero. Aqui ele
  # roda de verdade, mas SO quando o PR toca supabase/migrations/**: aplicar as ~831
  # migrations num PostgreSQL 17 descartavel leva minutos e nao interessa a um PR que
  # nao mexeu em migration.
  #
  # Sem docker-shim: o shim do E47 FINGE o docker (roteia para o postgres do service)
  # para acelerar ~48 contratos. O replay precisa de um docker DE VERDADE, porque o
  # replay-local.sh sobe a imagem publica do Supabase e aplica arquivo por arquivo.
  replay-migrations:
    name: Replay local das migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 para o `git diff` achar o merge-base do PR.
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar mudanca em supabase/migrations
        id: mudou
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # So o PR olha o diff: push na main e merge_group ja passaram pelo gate na PR.
          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- supabase/migrations | grep -q .; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          fi

      # O ECR limita pull anonimo; sem este passo um 429 do registry apareceria como
      # "exit 2" do replay e confundiria infraestrutura com drift de migration.
      - name: Pre-baixar a imagem do replay
        if: steps.mudou.outputs.mudou == 'true'
        run: |
          img=$(grep -m1 -oE 'public\.ecr\.aws/supabase/postgres:[0-9.]+@sha256:[a-f0-9]{64}' scripts/db-audit/replay-local.sh)
          if [ -z "$img" ]; then
            echo "nao achei a imagem fixada por digest em scripts/db-audit/replay-local.sh"
            exit 2
          fi
          echo "imagem do replay: $img"
          for tentativa in 1 2 3; do
            if docker image inspect "$img" >/dev/null 2>&1 || docker pull "$img"; then break; fi
            echo "pull falhou (tentativa $tentativa); aguardando antes de repetir"
            sleep $((tentativa * 20))
          done
          docker image inspect "$img" >/dev/null

      # 0 = verde, 1 = migration fora do allowlist (o script NOMEIA a culpada), 2 = setup.
      - name: Aplicar as migrations em PostgreSQL 17 descartavel
        if: steps.mudou.outputs.mudou == 'true'
        run: bash scripts/db-audit/replay-local.sh

      # Log e TSV existem no verde e no vermelho; e o que deixa o revisor ver a
      # migration culpada sem baixar o repo (o upload so roda se o diff tocou migration).
      - name: Publicar o log e os erros do replay
        if: always() && steps.mudou.outputs.mudou == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-migrations
          path: |
            replay.log
            replay-erros.tsv
          if-no-files-found: warn
          retention-days: 7

      # X176 (TL-164): as três RPCs de leitura da supressão (listagem paginada, KPIs e
      # atividade) não existiam — a tela lia a tabela inteira e somava em memória. O passo
      # aplica a migration real em PostgreSQL 17 descartável e executa como os papéis reais:
      # prova o supervisor como papel real pelo JWT (authenticated) lendo listagem, KPIs e
      # atividade; service_role NÃO tem EXECUTE nas três por REVOKE nominal (o default do
      # Supabase concede EXECUTE explicitamente) e o anon também fica sem EXECUTE. Ainda
      # prova o 42883 antes, o 42501 do agente depois, os KPIs (opt-outs do período,
      # suprimidos ativos sem expirado nem removido, protegidas), a paginação com total
      # constante, os filtros e a busca por nome/e-mail/dígitos de telefone, a entrada
      # inválida (22023), a atividade lida dos eventos de entidade e o rollback executado a
      # partir do próprio arquivo da migration.
      - name: Provar as RPCs de leitura da supressão do Talk X (X176)
        env:
          TALKX_SUPPRESSION_READ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-suppression-read-rpcs.test.sh
      # N-009 (P3 · storage, SEC-DEFINER_GRANTS_STORAGE-06): os buckets publicos
      # de figurinhas (stickers) e audios-meme (audio-memes) aceitavam qualquer
      # tipo e tamanho de arquivo. O contrato aplica a migration real num
      # PostgreSQL 17 descartavel e prova: file_size_limit e allowed_mime_types
      # exatos, text/html recusado e image/webp (stickers) / audio/mpeg
      # (audio-memes) aceitos pelo comportamento (ANY) como authenticated,
      # rollback do cabecalho restaurando NULLs e reaplicacao idempotente.
      - name: Provar limites de storage em stickers e audio-memes (N-009)
        env:
          STICKERS_MEMES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/storage-limits-stickers-audio-memes.test.sh
      # N-135 (Talk X): talkx_help_views + talkx_help_top_topics.
      # Prova em Postgres descartável: RED (tabela/RPC não existem), GREEN
      # (migration aplica, ranking agrega sem user_id, RLS isola,
      # reaplicar é no-op), rollback executável e reexecutável.
      - name: Provar talkx_help_views + ranking dos mais vistos (N-135)
        env:
          TALKX_HELP_TOP_TOPICS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-help-top-topics.test.sh
      # N-072 (P1 banco, chat interno): cursor da paginacao de get_team_messages_page
      # empatava em created_at e p_limit <= 0 passava silencioso. O contrato aplica a
      # migration 20261010064729 num PostgreSQL 17 descartavel e prova: paginacao sem
      # duplicata nem lacuna com created_at igual, invalid_limit em 0/negativo/NULL,
      # guardas not_member/not_authenticated, teto de 200 e ACL preservados. Inicia
      # container proprio e roda CREATE ROLE anon/authenticated — as roles sao globais
      # ao cluster, entao o docker-shim do E47 colidiria com as do shim.
      - name: Provar cursor tiebreak e limite minimo de get_team_messages_page (N-072)
        env:
          TEAM_CHAT_PAGE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/team-messages-page-cursor-tiebreak.test.sh
      # SEC-DEFINER_GRANTS_STORAGE-06/08 (auditoria SEGURANCA_DEFINER_GRANTS_STORAGE_2026-10-07):
      # os buckets publicos `stickers`/`audio-memes` nasciam sem file_size_limit nem allowed_mime_types
      # (texto arbitrario servido sem JWT) e, em team-chat-files, SELECT/DELETE comparavam a pasta com
      # auth.uid() enquanto o INSERT grava a pasta com current_profile_id() (o dono nao via/apagava o
      # proprio envio). Inicia container proprio e roda CREATE ROLE anon/authenticated/service_role —
      # as roles sao globais ao cluster, entao SKIP_DOCKER_SHIM=1 como nos vizinhos.
      - name: Provar limites dos buckets e a identidade de team-chat-files (SEC-DEFINER_GRANTS_STORAGE-06/08)
        env:
          BUCKETS_CHAT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/buckets-stickers-team-chat-files.test.sh
      # t_d3c1981f (auditoria de paridade V3->V2, achado chat-2): RLS de
      # scheduled_messages/whisper_messages nao olhava a visibilidade do contato nem a
      # permissao de envio. O teste aplica a migration real num PostgreSQL 17 descartavel,
      # prova a brecha (RED) antes, a recusa (contato invisivel, sem send_messages,
      # contact_id/created_by trocados) e o passe do supervisor depois, com anon sem ver
      # nada e as linhas existentes intactas. Inicia container proprio e roda CREATE ROLE
      # anon/authenticated/service_role — roles sao globais ao cluster, entao
      # SKIP_DOCKER_SHIM evita a colisao do docker-shim do E47.
      - name: Provar RLS de agendamento e sussurro por contato visível e permissão (t_d3c1981f)
        env:
          SCHEDULED_WHISPER_RLS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/scheduled-whisper-visibility-rls.test.sh
      # R2-API-058 (#230, P2): o alerta mensal de custo do autocomplete repetia o E-MAIL em cada
      # execução diária do cron. O job rodava notify_searchbox_budget() e net.http_post(...)
      # INCONDICIONALMENTE todo dia, e a edge searchbox-budget-alert não tem ledger de envio:
      # o canal app deduplicava por mês, o e-mail não. O harness roda o comando REAL do cron.job
      # num PostgreSQL 17 descartável — BLOCO A (defeito: 2 POSTs no mesmo mês), BLOCO B (ledger
      # próprio do canal de e-mail, PK = mês, decisão atômica antes do envio: 1 POST por mês;
      # falha confirmada retenta, 'sent'/'pending'/'uncertain' não reenviam) e BLOCO C (as linhas
      # `-- Rollback:` da migration são extraídas e executadas; o job volta ao comando anterior).
      # Só usa docker run/exec/rm com psql, então roda sob o docker-shim (E47), sem SKIP.
      - name: Provar a identidade mensal do alerta de custo do autocomplete (R2-API-058)
        env:
          SEARCHBOX_ALERT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/searchbox-budget-alert-monthly-idempotency.test.sh
      # SEC-Y25-01 (P0, SEC-RLS_TAREFAS_EMAIL_LIGACOES-01): o INSERT de deal_activities,
      # calls e conversation_tasks validava só o AUTOR, nunca o ALVO. O teste sobe um
      # PostgreSQL descartável, aplica o helper real de visibilidade de contato, reproduz
      # o ataque como papel real (agent) antes da correção, e prova o bloqueio depois —
      # mais anon negado pelo RLS e service_role liberado. SKIP_DOCKER_SHIM=1: o teste cria
      # os papéis anon/authenticated/service_role, que são globais ao cluster.
      - name: Simular amarração do alvo no INSERT de atividades, chamadas e tarefas (SEC-Y25-01)
        env:
          SEC_Y25_INSERT_ALVO_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/sec-y25-01-insert-alvo.test.sh
      # t_35d5aa82: paridade V3 -> V2 do remetente de grupo — public.messages ganha
      # t_313f15cd: paridade V3 -> V2 do remetente de grupo — public.messages ganha
      # sender_participant_jid e sender_display_name (aditivas, anulaveis, sem backfill).
      # Aplica as migrations REAIS do caminho de leitura + a desta tarefa num PostgreSQL 17
      # descartavel e prova como PAPEL REAL (authenticated/anon) que a visibilidade de leitura
      # nao muda, que outsider/anon seguem barrados e que o rollback derruba as colunas.
      # Inicia container proprio e roda CREATE ROLE anon/authenticated/service_role
      # (globais ao cluster) -> SKIP_DOCKER_SHIM="1", como os blocos vizinhos.
      - name: Provar o remetente de grupo em messages (t_35d5aa82)
        env:
          MESSAGES_GROUP_SENDER_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/messages-group-sender.test.sh
      - name: Provar o remetente de grupo em messages (t_313f15cd)
        env:
          MESSAGES_GROUP_SENDER_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/messages-group-sender.test.sh

