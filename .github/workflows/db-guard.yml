        env:
          MULTIPLIX_RLS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/multiplix-delivery-leases.test.sh

      # R2-DB-007 (#78): as duas rotinas de conclusão de dispatch drenado do Multiplix
      # precisam atribuir status com cast explícito para public.multiplix_dispatch_status;
      # sem isso o CASE vira text e o UPDATE falha com 42804 no enum real.
      - name: Simular conclusão drenada do Multiplix gravando status enum
        env:
          MULTIPLIX_RLS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/multiplix-drain-enum-cast.test.sh
      # N-144: prova que a migration 20261010101613 revoga EXECUTE de PUBLIC,
      # anon e authenticated na função de gatilho
      # multiplix_audiences_validate_shared_roles (só postgres/service_role
      # conservam), que a chamada direta recebe `permission denied`, que o
      # INSERT como authenticated continua funcionando e que o rollback
      # restaura o estado anterior.
      - name: Simular revogação de EXECUTE público do gatilho Multiplix (N-144)
        env:
          MULTIPLIX_REVOKE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/multiplix-revoke-execute-public.test.sh

      # F24 do plano do Multiplix: prova que a edge multiplix-audience deriva o
      # escopo do JWT (matriz F25) e IGNORA escopo forjado no corpo. O bloco
      # estatico roda sempre; o bloco ao vivo PULA e sai 0 sem credenciais
      # (ZAPP_SUPABASE_URL/ANON + EXTERNAL_SUPABASE_* + contas em ~/.secrets),
      # entao o CI offline nao quebra — quando as credenciais existirem no
      # runner, a prova roda contra a edge e o Singu reais.
      - name: Provar escopo da audiencia Multiplix (F24)
        run: bash scripts/db-audit/multiplix-scope.test.sh

      # R2-DB-003 (cartao t_c1431127): executa multiplix_resolve_recipients de
      # verdade em PostgreSQL 17 descartavel — a funcao e extraida verbatim do
      # arquivo versionado em _foreign/singu e as linhas fora do escopo/
      # inativas precisam sair so com company_id + elegibilidade (metadados
      # NULL). Empresa elegivel sai inteira.
      - name: Simular redacao fora do escopo do resolve Multiplix (R2-DB-003)
        env:
          MULTIPLIX_RESOLVE_ESCOPO_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/multiplix-resolve-escopo.test.sh

      # N-017 (inventario de melhorias de 07/10, item A4): o runner de mutacao do
      # worker do Multiplix existia no disco e nunca rodava no CI — a prova de que
      # os testes do envio pegam erro de verdade ficava dependendo de alguem rodar
      # a mao. Aqui ele passa a rodar de verdade: reescreve
      # supabase/functions/multiplix-send/index.ts com os mutantes listados no
      # proprio runner, roda a suite Deno (index.test.ts) a cada mutante e sai
      # NAO-ZERO se algum sobreviver — ou se a ancora de um mutante sumir (o
      # runner e fail-closed: mutante que nao se aplica e erro, nunca "morto").
      # O Deno ja esta no PATH deste job (setup acima) e o runner usa
      # scripts/ci/deno.json com `--frozen`. Sem filtro de caminhos: este job ja
      # roda em todo PR (o nome do check precisa existir em todo PR — ver o topo
      # deste arquivo), e o passo custa a mesma ordem dos testes Deno vizinhos.
      - name: Provar por mutação os testes do worker do Multiplix (N-017)
        run: python3 scripts/db-audit/multiplix-send-mutation.py

      - name: Simular estados e audiencia canônicos do Talk X
        env:
          TALKX_CAMPAIGN_STATE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-campaign-state-transitions.test.sh

      - name: Simular transições concorrentes de campanha Talk X
        env:
          TALKX_CAMPAIGN_TRANSITIONS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-campaign-transitions.test.sh

      # X010: trava por campanha (worker lease), start idempotente (sending ->
      # sending sem tocar started_at), fila do worker em RPC e segredo de cron
      # dedicado do Talk X.
      - name: Simular trava por campanha, fila do worker e segredo de cron do Talk X (X010)
        env:
          TALKX_CAMPAIGN_WORKER_LEASE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-campaign-worker-lease.test.sh

      # N-095: lista paginada dos destinatários da campanha (talkx_campaign_recipients_page).
      # Prova paginacao com rows/next_cursor/total, filtros por status/segmento/busca,
      # recusa para quem nao e criador nem admin/supervisor, e ausencia do campo source.
      - name: Provar a RPC de paginacao de destinatarios da campanha Talk X (N-095)
        env:
          TALKX_RECIPIENTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/talkx-campaign-recipients-page.test.sh

      # X014: exigir papel admin/supervisor no banco para criar, agendar e alterar
      # campanha (RPCs, policies de talkx_campaigns, gatilho de agendamento, revoke
      # de anon em talkx_settings, policy de talkx_blacklist e ramo admin em
      # link_clicks).
      - name: Simular portões de papel do Talk X (X014)
        env:
          TALKX_ROLE_GATES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-role-gates.test.sh

      # X016: RPC unica de audiencia (talkx_resolve_audience) com a funcao interna
      # talkx_audience_query — whitelist de campo/operador, elegibilidade
      # (deleted_at/LID/telefone/visibilidade), supressao por id ou telefone
      # normalizado e paginacao keyset.
      - name: Simular a RPC unica de audiencia do Talk X (X016)
        env:
          TALKX_AUDIENCE_RPC_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-audience-rpc.test.sh

      # N-111: tabela oficial de campos/operadores de segmento do Talk X
      # (talkx_segment_fields) + funcao de compilacao (talkx_compile_segment_rules).
      # Recusa (22023) valor malicioso no ramo de data (in_last_days/not_in_last_days)
      # antes de compor SQL, aplica a migration 2x (idempotencia) e prova os
      # predicados contra contatos reais, tudo com papel authenticated.
      - name: Simular a tabela e funcao de segmentos do Talk X (N-111)
        env:
          TALKX_SEGMENT_FIELDS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-segment-fields.test.sh

      # X017: geracao de destinatarios no servidor a partir do rascunho salvo
      # (snapshot_talkx_campaign_audience) — colunas respect_suppression/
      # audience_snapshot_at, criterio de elegivel no replace e recusa de
      # respect_suppression=false (22023) ate a decisao N12.
      - name: Simular o snapshot de audiencia do Talk X (X017)
        env:
          TALKX_AUDIENCE_SNAPSHOT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-audience-snapshot.test.sh

      # N-103: pesos das variantes do Talk X somam 100 e atribuicao
      # estavel (constraint trigger talkx_template_variants_weight_sum).
      - name: Provar constraint de pesos de variantes do Talk X (N-103)
        env:
          TALKX_AB_WEIGHTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-ab-weights.test.sh
      - name: Saude de segmento (N-116)
        env:
          TALKX_SEGMENT_HEALTH_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-segment-health.test.sh

      # Auditoria: correção de DUAS regressões vivas por recriação de função —
      # save_talkx_campaign_draft perdeu template_version_id (V26) e
      # transition_talkx_campaign não gravava launched_by/launched_at no start
      # (V21). O harness aplica a CADEIA COMPLETA das migrations Talk X (do zero,
      # ordem de versão) e confere RED (perda reproduzida) → GREEN (correção
      # restaura).
      - name: Simular a correção das regressões do Talk X (cadeia completa)
        env:
          TALKX_REGRESSOES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-regressoes-chain.test.sh

      # X012: o tick do motor — reaper (lease vencido após o POST vira
      # outcome_unknown), conclusão de campanha drenada, fan-out de no máximo 1
      # campanha 'sending' por conexão com x-cron-secret e timeout de 30s, e a
      # troca (alter_job, sem job novo) do command do 'talkx-scheduler-1min'.
      # Aplica de verdade as dependências já mergeadas (X010 e a RPC de conclusão)
      # e troca net.http_post por uma tabela de captura.
      - name: Simular o tick do motor Talk X (X012)
        env:
          TALKX_ENGINE_TICK_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-engine-tick.test.sh

      # O teste existente acima monta o fixture aplicando SO a migration de
      # 20260911150000 (um overload), e por isso nunca viu a ambiguidade que
      # existe em producao quando a versao de 3 args de 20260916210000 tambem
      # esta viva. Este passo sobe PostgREST de verdade e chama a RPC por HTTP,
      # sem mock: HTTP 300 PGRST203 antes da migration, 200 e o ciclo completo
      # depois.
      # E47: SKIP_DOCKER_SHIM=1 — este step precisa do docker real para subir
      # o container PostgREST; o shim não intercepta este step.
      - name: Provar ambiguidade do overload de transition_talkx_campaign no PostgREST
        env:
          TALKX_TRANSITION_POSTGREST_PG_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          TALKX_TRANSITION_POSTGREST_IMAGE: ${{ env.POSTGREST_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-transition-overload-postgrest.test.sh

      # V11: o contrato de eventos recusava os tipos que o servidor e a trilha
      # de supressão precisam gravar, e campaign_id era NOT NULL (evento de
      # entidade não tinha como existir). O fixture espelha a definição viva,
      # inclusive as policies — que tiveram de ser recriadas, porque o EXISTS em
      # talkx_campaigns nunca é verdadeiro com campaign_id nulo.
      - name: Provar o contrato de eventos do Talk X
        env:
          TALKX_EVENTS_CONTRACT_PG_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-events-contract.test.sh

      # X021: escrita de links (UTM/created_by/rótulo único), leitura de cliques e
      # conversões (admin/supervisor + dono), deduplicação de conversão, teto de valor
      # e investimento por campanha — prova em PostgreSQL descartável.
      - name: Provar escrita de links, leitura de cliques/conversões e investimento (X021)
        env:
          TALKX_LINKS_CONV_PG_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-links-conversions.test.sh

      # X024: delta de ciclo de vida — start->pause->resume->cancel grava 4 eventos em
      # ordem com ator e motivo; retomada sem ator grava resumed_auto; cancel fecha a
      # fila (pendentes viram cancelled, leases soltas); cancelado não vira completed;
      # conclusão drenada grava 1 completed com resumo.
      - name: Provar o ciclo de vida com ator/motivo e o fechamento da fila (X024)
        env:
          TALKX_LIFECYCLE_EVENTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-lifecycle-events.test.sh

      # X026: contadores íntegros (replied_count/skipped_count no guard de
      # enforce_talkx_campaign_mutability), destinatário pulado entra em
      # skipped_count, lançar com template não conta use_count em dobro, checklist
      # de retomada com ator, duplicar/excluir por RPC no banco e policy de INSERT
      # de eventos limitada a note|checklist|segments_reviewed. Harness RED→GREEN
      # em PostgreSQL 17 descartável.
      - name: Provar contadores, checklist, duplicar/excluir e policy de eventos (X026)
        env:
          TALKX_COUNTERS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-counters-integrity.test.sh

      # X027: recibos de leitura idempotentes e atribuição de resposta no banco —
      # read sem delivered preenche delivered_at/read_at e sobe delivered_count/read_count
      # uma única vez; record_talkx_recipient_delivered vira invólucro; attribute_talkx_reply
      # atribui por contact_id OU telefone normalizado na janela de reply_window_hours;
      # talkx_campaign_reply_stats devolve replied/avg/median; read_at na publicação realtime.
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar recibos de leitura, atribuicao de resposta e tempo de resposta (X027)
        env:
          TALKX_RECEIPTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-receipts-replies.test.sh

      # X031: reenvio manual em lote (failed/skipped, teto de 3, revalida supressão e
      # elegibilidade) e resolução de outcome_unknown (mark_sent|mark_failed|retry) por
      # RPC admin/supervisor com trilha; campanha completed reabre para sending.
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar reenvio manual e resolucao de outcome_unknown com trilha (X031)
        env:
          TALKX_X031_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-retry-resolve.test.sh

      # X032: LGPD no motor — consentimento no lancamento (revoked fora da audiencia,
      # require_granted_consent opcional, start/agendar recusam sem confirmacao, opt-out
      # automatico marca consent_status=revoked) e expurgo por prazo 1x/dia via
      # purge_talkx_expired_data (texto/midia de campanha terminal vencida, ua/ip_hash,
      # linhas de teste e de IA) sem tocar blacklist, contadores ou eventos.
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar consentimento no lancamento e expurgo por prazo (X032)
        env:
          TALKX_X032_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-lgpd.test.sh

      # X033: log por destinatario (sem telefone/texto, expurgo de 30 dias), view de
      # saude talkx_engine_health (security_invoker) e alertas com deduplicacao por
      # tipo/campanha e fechamento automatico (stalled_campaign, cron_degraded).
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar log por destinatario, saude do motor e alertas (X033)
        env:
          TALKX_X033_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-engine-health.test.sh

      # M-DB-03/R3-DELTA-002: helper SECURITY DEFINER talkx_engine_cron_runs
      # continua executavel por authenticated para admin/supervisor, mas nega
      # authenticated comum no corpo; service_role e chamadores internos seguem
      # funcionando. Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar gate de papel nas leituras do cron do motor Talk X (M-DB-03)
        env:
          TALKX_CRON_GATE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-engine-cron-runs-role-gate.test.sh

      # M-DB-01: o tick do motor nao aborta no expurgo LGPD (storage.protect_delete
      # FOR EACH STATEMENT levanta 42501 em DELETE direto; a fixture recria o gatilho).
      # Manifesto talkx_storage_purge_queue, alerta purge_failed com espera de 1 h,
      # gate diario e outcome_unknown alinhado ao CHECK. Harness RED→GREEN em PostgreSQL 17.
      - name: Provar que o tick nao aborta no expurgo (M-DB-01)
        env:
          TALKX_MDB01_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-tick-expurgo.test.sh

      # Item 33 / R3-DELTA-001: a view emite outcome_unknown_24h, mas o alerta
      # gravado precisa usar o kind canonico outcome_unknown aceito pelo CHECK.
      # Harness RED→GREEN em PostgreSQL 17: antes abortava o INSERT..SELECT inteiro
      # e o lote nao gravava nem os outros alertas da rodada. SKIP_DOCKER_SHIM=1
      # porque o harness aguarda readiness com `docker logs`, subcomando fora do shim.
      - name: Provar lote de alertas Talk X com outcome_unknown_24h (item 33)
        env:
          TALKX_LOTE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-alerts-outcome-unknown-lote.test.sh

      # #130 (R3-DELTA-015): o expurgo LGPD do Talk X apagava ai_jobs de outros modulos.
      # ai_jobs e a fila DURAVEL COMPARTILHADA (IA-045): a IA enfileira 'ai.generate' e o
      # inbox (message-delivery) enfileira 'reconcile:message.send:<id>'. O passo 4 do
      # expurgo passa a exigir o namespace do Talk X ('reconcile:talkx.%'); os jobs dos
      # outros modulos ficam intactos e o job terminal vencido do proprio Talk X continua
      # saindo. Harness RED→GREEN em PostgreSQL 17 descartavel (inclui rollback e ACL).
      - name: Provar que o expurgo nao apaga ai_jobs de outros modulos (#130)
        env:
          TALKX_ESCOPO_AI_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-expurgo-escopo-ai-jobs.test.sh

      # Item 33 / R3-DELTA-001: a view emite outcome_unknown_24h, mas o alerta
      # gravado precisa usar o kind canonico outcome_unknown aceito pelo CHECK.
      # Harness RED→GREEN em PostgreSQL 17: antes abortava o INSERT..SELECT inteiro
      # e o lote nao gravava nem os outros alertas da rodada. SKIP_DOCKER_SHIM=1
      # porque o harness aguarda readiness com `docker logs`, subcomando fora do shim.
      - name: Provar lote de alertas Talk X com outcome_unknown_24h (item 33)
        env:
          TALKX_LOTE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-alerts-outcome-unknown-lote.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp-message-phase1-<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular primitivas atômicas de mensagens e encerramento
        env:
          MESSAGE_DELIVERY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/message-delivery-phase1-behavior.test.sh

      # R2-INB-003: prova o transporte canônico de mensagens interativas (botões,
      # lista e CTA URL) sobre as migrations da fila atômica + a migration nova.
      # SKIP_DOCKER_SHIM=1 porque o harness aguarda readiness com `docker logs`.
      - name: Simular transporte canônico de mensagens interativas (botões/lista)
        env:
          MESSAGE_DELIVERY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/interactive-buttons-list-behavior.test.sh

      - name: Simular contrato de dados da Telefonia v2
        env:
          CALLS_TELEFONIA_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/calls-telefonia-contract.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp-notification-atomicity-<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular notificações atômicas de chamadas e sentimento
        env:
          NOTIFICATION_ATOMICITY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/notification-delivery-atomicity.test.sh

      # Guarda o contrato runtime generico do db-migrate: se ele deixar de
      # detectar alguma forma de DDL, um apply poderia ser autorizado sobre um
      # schema alterado entre o dry-run e a aplicacao.
      - name: Simular contrato runtime generico de migration
        env:
          GENERIC_RUNTIME_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          # E47: SKIP_DOCKER_SHIM=1 — o contrato verifica proof.database === 'postgres'.
          # Com o shim o banco criado e shim_zapp_generic_runtime_test_<PID> e
          # current_database() devolve esse nome, quebrando a assercao.
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/generic-migration-runtime.test.sh

      - name: Simular reconciliação segura do ledger
        env:
          LEDGER_RECONCILE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-reconcile-ledger-drift.test.sh

      - name: Simular auditoria somente-leitura de configuracao runtime
        env:
          # E47: SKIP_DOCKER_SHIM=1 — o readiness check usa `docker logs` para aguardar
          # "PostgreSQL init process complete; ready for start up." — o shim devolve saida
          # vazia nesse subcomando, fazendo o loop de 45s falhar por timeout.
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/runtime-config.test.sh

