# ==================================================================
# ZAPP-WEB · Guardas de banco OFFLINE
# ==================================================================
# Este workflow nunca recebe DESTINO_URL e pode executar codigo de PRs.
# Consultas ao banco oficial ficam isoladas em db-live-guard.yml, que nao
# possui gatilho pull_request e so aceita refs/heads/main.
# ==================================================================

name: DB Guard (offline)

on:
  # Sem filtro de paths: o nome do check precisa existir em todo PR para poder
  # ser exigido pela branch protection sem bloquear diffs apenas de docs.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-guard-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    name: Contrato DB offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validar .from() e .rpc() contra o catalogo
        run: node scripts/db-audit/supabase-usage-guard.mjs

      - name: Testar comparadores de catalogo, manifesto e migrations
        run: node --test scripts/db-audit/*.test.mjs

      - name: Validar SQL de catalogo e manifesto no PostgreSQL 17
        run: bash scripts/db-audit/catalog-manifest.test.sh

      - name: Testar normalizacao deterministica dos tipos gerados
        run: bash scripts/db-audit/gen-types.test.sh

      # Sem DESTINO_URL: valida nomes, duplicatas e conteudo local das
      # migrations, mas nao consulta schema_migrations.
      - name: Validar migrations localmente
        run: node scripts/db-audit/check-migration-drift.mjs

      # Harness descartavel na mesma major do banco oficial. Exercita o SQL real e
      # prova que cada regressao de ACL/contrato encerra com codigo nao zero.
      - name: Simular regressões do contrato mcp_exec
        env:
          ACL_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/check-mcp-exec-acl.test.sh

      - name: Simular regressões da ACL de webhook failures
        env:
          WEBHOOK_ACL_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/check-webhook-failures-acl.test.sh

      - name: Provar remoção do token legado da API pública
        env:
          PUBLIC_API_DISABLE_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/public-api-disable.test.sh

      - name: Simular concorrência e integridade da fila CRM
        env:
          CRM_OUTBOX_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/crm-sync-outbox-behavior.test.sh

      - name: Simular autorização canônica do Inbox
        env:
          INBOX_AUTHZ_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/inbox-contact-authorization.test.sh

      - name: Simular histórico atômico de templates Talk X
        env:
          TALKX_HISTORY_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: |
          TALKX_HISTORY_PRECREATE_RUNTIME=false bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true TALKX_HISTORY_INVALID_PRESTATE=true bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true TALKX_HISTORY_INVALID_LIVE_PRESTATE=true bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true TALKX_HISTORY_INVALID_VARIANT_PRESTATE=true bash scripts/db-audit/talkx-template-history-behavior.test.sh

      - name: Simular correção forward-only da FK saved_by do Talk X
        env:
          TALKX_HISTORY_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: |
          TALKX_HISTORY_FK_PRESTATE=NO_ACTION bash scripts/db-audit/talkx-history-saved-by-fk.test.sh
          TALKX_HISTORY_FK_PRESTATE=SET_NULL bash scripts/db-audit/talkx-history-saved-by-fk.test.sh
          TALKX_HISTORY_FK_PRESTATE=ORPHAN bash scripts/db-audit/talkx-history-saved-by-fk.test.sh

      - name: Simular reconciliação forward-only da policy Talk X blacklist
        env:
          TALKX_BLACKLIST_POLICY_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/talkx-blacklist-policy-forward-only.test.sh

      - name: Simular snapshot atômico de destinatários Talk X
        env:
          TALKX_DRAFT_RECIPIENTS_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/talkx-draft-recipients.test.sh

      - name: Simular leases de entrega concorrente do Talk X
        env:
          TALKX_DELIVERY_LEASES_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/talkx-delivery-leases.test.sh

      - name: Simular estados e audiencia canônicos do Talk X
        env:
          TALKX_CAMPAIGN_STATE_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/talkx-campaign-state-transitions.test.sh

      - name: Simular primitivas atômicas de mensagens e encerramento
        env:
          MESSAGE_DELIVERY_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/message-delivery-phase1-behavior.test.sh

      - name: Simular reconciliação segura do ledger
        env:
          LEDGER_RECONCILE_TEST_POSTGRES_IMAGE: postgres:17-alpine
        run: bash scripts/db-audit/check-reconcile-ledger-drift.test.sh
