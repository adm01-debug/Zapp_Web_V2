# docs:
#   gatilho: pull_request, push na main, merge_group e dispatch
#   prova: guardas OFFLINE do banco (nunca recebe DESTINO_URL, roda codigo de PR)
#   falha: PR fica vermelho; nenhum codigo de PR alcanca o banco de producao
#   avisa: autor do PR e revisor
# ==================================================================
# ZAPP-WEB · Guardas de banco OFFLINE
# ==================================================================
# Este workflow nunca recebe DESTINO_URL e pode executar codigo de PRs.
# Consultas ao banco oficial ficam isoladas em db-live-guard.yml, que nao
# possui gatilho pull_request e so aceita refs/heads/main.
# ==================================================================

name: DB Guard (offline)

on:
  # Sem filtro de paths: o nome do check precisa existir em todo PR para poder
  # ser exigido pela branch protection sem bloquear diffs apenas de docs.
  # E23: 'develop' removido — branch nao existe no repo (so main).
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Fila de merge: sem este gatilho o check required nunca reportaria no merge
  # group e a fila travaria todos os merges do repo.
  merge_group:
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: db-guard-offline-${{ github.event.pull_request.number || github.ref }}
  # E21 (auditoria de GitHub Actions, 2026-09-26): cancelava TODO push na
  # main, inclusive comparado a um commit anterior ja em analise — igual ao
  # ci.yml, so cancela push NOVO na MESMA PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-contract:
    name: Contrato DB offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # E47: um PostgreSQL 17 compartilhado para todos os ~48 testes de contrato.
    # O docker-shim intercepta `docker run/exec/rm` e roteia cada teste para
    # um banco isolado (CREATE/DROP DATABASE por invocação) no mesmo serviço,
    # eliminando o overhead de inicialização individual de containers.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: shim_test_password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_IMAGE: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      POSTGREST_TEST_IMAGE: public.ecr.aws/supabase/postgrest:v14.5@sha256:bb289d00570b569525e1e22fb77c49cd17c17ca3f41da9ee2b4351a35027551b
      # E47: coordenadas do serviço compartilhado, lidas pelo docker-shim.
      POSTGRES_SERVICE_HOST: localhost
      POSTGRES_SERVICE_PORT: "5432"
      POSTGRES_SERVICE_USER: postgres
      POSTGRES_SERVICE_PASS: shim_test_password
      DOCKER_SHIM_STATE_DIR: /tmp/docker-shim-state
    permissions:
      contents: read
      # pull-requests: read apenas para o passo de imutabilidade abaixo (lista
      # os arquivos do PR via API).
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # E49 (auditoria de GitHub Actions, 2026-09-26): ataca a causa raiz dos
      # drifts documentados no CLAUDE.md (02/09, 04/09, 24-26/09) — um arquivo
      # em supabase/migrations/ editado DEPOIS de já ter sido aplicado em
      # produção (ou já mergeado) nunca deveria voltar a mudar; a regra 7 da
      # seção 1 do CLAUDE.md já manda isso, mas nada impedia um PR de violá-la
      # antes deste guard. Só roda em pull_request (a API de arquivos do PR
      # não existe em push/schedule/dispatch).
      - name: Rejeitar edicao de migration ja existente
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const arquivos = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            // So bloqueia 'modified' (conteudo mudou, MESMO nome de arquivo) —
            // e exatamente o padrao do incidente de 26/09 (arquivo editado
            // depois de aplicado, drift entre ledger e disco). 'renamed' fica
            // de fora de proposito: e uso legitimo e documentado no CLAUDE.md
            // (ex.: PRs #856/#860, renomear para a version real do ledger
            // antes de qualquer aplicacao); 'removed' tambem fica de fora
            // (mudanca para _foreign/_superseded, arquivo morto).
            // Mas um 'renamed' com additions/deletions > 0 e o MESMO gap por
            // outra porta: o conteudo mudou junto com o nome, disfarcado de
            // rename puro (achado da auditoria de 5 agentes de 2026-09-27).
            const candidatas = arquivos.filter(
              (f) => /^supabase\/migrations\/\d{14}_.*\.sql$/.test(f.filename)
                && (f.status === 'modified'
                  || (f.status === 'renamed' && ((f.additions || 0) > 0 || (f.deletions || 0) > 0))),
            );
            // Excecao 1: promocao de stub comment-only para SQL real e permitida.
            // Ocorre quando uma migration foi aplicada via MCP diretamente (sem
            // passar pelo fluxo arquivo->PR), criando um stub em main com apenas
            // comentarios. O db-live-guard exige que o arquivo corresponda ao
            // ledger, entao o stub precisa ser promovido. Um arquivo e
            // comment-only quando cada linha nao-vazia comeca com '--'.
            //
            // Excecao 2: arquivo com kind='ledger-only/name-and-file-pinned' no
            // migration-evidence.json — esses arquivos existem apenas como
            // documentacao de DDL aplicado via MCP sem SQL executavel no ledger.
            // Correcoes de documentacao (ex.: nome de tabela errado no arquivo)
            // sao permitidas porque nao ha SQL historico imutavel a preservar.
            // O drift checker (check-migration-drift.mjs) ainda valida que o
            // file_sha256 no evidence bate com o arquivo corrigido.
            const evidenceRaw = require('fs').readFileSync('scripts/db-audit/migration-evidence.json', 'utf8');
            const evidence = JSON.parse(evidenceRaw);
            const baseSha = context.payload.pull_request.base.sha;
            const violacoes = [];
            for (const f of candidatas) {
              // Excecao 2: kind ledger-only/name-and-file-pinned no evidence
              const basename = f.filename.split('/').pop();
              const entry = (evidence.exceptions || []).find(e => e.filename === basename);
              if (entry && entry.kind === 'ledger-only/name-and-file-pinned') continue;
              if (f.status === 'modified') {
                try {
                  const resp = await github.rest.repos.getContent({
                    owner, repo, path: f.filename, ref: baseSha,
                  });
                  const text = Buffer.from(resp.data.content, 'base64').toString('utf-8');
                  // Excecao 1: comment-only
                  const isCommentOnly = text.split('\n').every(
                    (l) => l.trim() === '' || l.trim().startsWith('--'),
                  );
                  if (isCommentOnly) continue;
                } catch (_) {
                  // Se nao conseguir buscar o base, trata como violacao (safe default).
                }
              }
              violacoes.push(f);
            }
            if (violacoes.length > 0) {
              const lista = violacoes.map((f) => f.filename).join('\n  - ');
              core.setFailed(
                'Este PR edita o CONTEUDO de uma migration que ja existe, com o '
                + 'mesmo nome ou renomeada (regra 7 da secao 1 do CLAUDE.md — '
                + 'statements no ledger e o SQL real e completo; um arquivo ja '
                + 'aplicado nao pode mudar depois):\n  - '
                + lista
                + '\n\nSe o objetivo e corrigir algo ja aplicado, crie um NOVO '
                + 'arquivo com version maior contendo a correcao (nunca edite o '
                + 'antigo). Renomear um arquivo que nunca foi registrado/aplicado '
                + 'continua permitido.',
              );
            }

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # O guard de subscriptions usa a API AST do TypeScript para rejeitar
      # nomes de tabela dinamicos sem recorrer a regex permissiva. O checkout
      # limpo do runner nao possui essa devDependency ate o install frozen.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Instalar dependencias do guard AST
        run: bun install --frozen-lockfile --ignore-scripts

      # O teste de integracao da V02 fala com um PostgREST real e e escrito em
      # Deno, como os testes da edge. Mesma action e mesmo SHA pinado do ci.yml
      # (o guard nao instala Deno em nenhum outro passo).
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      - name: Validar .from() e .rpc() contra o catalogo
        run: node scripts/db-audit/supabase-usage-guard.mjs

      - name: Validar subscriptions contra a publicacao Realtime
        run: node scripts/db-audit/check-realtime-subscriptions.mjs

      - name: Testar comparadores de catalogo, manifesto e migrations
        run: node --test scripts/db-audit/*.test.mjs

      # E47: instala o docker-shim no PATH antes do primeiro step que usa docker.
      # A partir daqui, `docker` aponta para o shim que roteia run/exec/rm para
      # o serviço postgres compartilhado. SKIP_DOCKER_SHIM=1 no step do PostgREST
      # (abaixo) desvia o shim e usa o docker real para subir o container PostgREST.
      - name: Instalar docker-shim (E47)
        run: |
          mkdir -p "$HOME/.local/bin"
          cp scripts/db-audit/docker-shim "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # E47: SKIP_DOCKER_SHIM=1 — este test cria dois bancos (db_a, db_b) no
      # mesmo container e roda DDL identico em cada um. O shim mapeia um
      # container a um unico banco; -d db_a e -d db_b roteariam para o mesmo
      # banco, causando "already exists" na segunda iteracao. O test acessa
      # postgres via docker exec (socket Unix interno), nao via localhost:5432,
      # entao nao colide com o servico compartilhado.
      - name: Validar SQL de catalogo e manifesto no PostgreSQL 17
        env:
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/catalog-manifest.test.sh

      - name: Testar normalizacao deterministica dos tipos gerados
        run: bash scripts/db-audit/gen-types.test.sh

      # Sem DESTINO_URL: valida nomes, duplicatas e conteudo local das
      # migrations, mas nao consulta schema_migrations.
      - name: Validar migrations localmente
        run: node scripts/db-audit/check-migration-drift.mjs

      # Harness descartavel na mesma major do banco oficial. Exercita o SQL real e
      # prova que cada regressao de ACL/contrato encerra com codigo nao zero.
      - name: Simular regressões do contrato mcp_exec
        env:
          ACL_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-mcp-exec-acl.test.sh

      - name: Simular regressões da ACL de webhook failures
        env:
          WEBHOOK_ACL_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-webhook-failures-acl.test.sh

      # M-DB-02: nenhuma SECURITY DEFINER de public com EXECUTE para PUBLIC/anon
      # (a T26 abriu uma assim por create or replace com parametro novo).
      - name: Simular SECURITY DEFINER aberta para PUBLIC/anon
        env:
          SECDEF_EXEC_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-secdef-public-execute.test.sh

      - name: Provar remoção do token legado da API pública
        env:
          PUBLIC_API_DISABLE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/public-api-disable.test.sh

      - name: Simular concorrência e integridade da fila CRM
        env:
          CRM_OUTBOX_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/crm-sync-outbox-behavior.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp_v2_inbox_authz_test_<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular autorização canônica do Inbox
        env:
          INBOX_AUTHZ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/inbox-contact-authorization.test.sh

      - name: Simular exclusão, status e grants canônicos de Contatos
        env:
          CONTACTS_F1_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/contacts-soft-delete-and-status.test.sh

      - name: Simular contatos legados fora por padrão (include_legacy)
        env:
          CONTACTS_F5_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/contacts-legacy-visibility.test.sh

      - name: Simular autorização de status de conversa e etiquetas de WhatsApp
        env:
          WA_TAG_AUTHZ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/wa-tag-and-status-authorization.test.sh

      - name: Simular autorização do INSERT em análises de conversa
        env:
          ANALYSES_AUTHZ_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/conversation-analyses-authorization.test.sh

      - name: Simular autorização da LEITURA de análises/etiquetas por fila (L8)
        env:
          AI_READ_QUEUE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/ai-read-policies-queue-scope.test.sh

      - name: Simular autorização do notify_due_tasks (RPC sem guarda)
        env:
          NOTIFY_DUE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/notify-due-tasks-authorization.test.sh

      # L5 da matriz IA-004: os jobs do pg_cron autenticavam com a ANON KEY do projeto
      # (credencial pública, no bundle do front). O fixture cria STUBS de Vault/pg_cron
      # no container, aplica as duas migrations e prova: segredos dedicados de 32 bytes
      # gerados in-db, RPCs SECURITY DEFINER devolvendo o valor exato de cada segredo,
      # EXECUTE fechado para PUBLIC/anon/authenticated e aberto só para service_role,
      # jobs com o schedule original, sem Bearer e com x-cron-secret lido por subquery
      # do Vault — mais o BLOCO C, que remove o REVOKE numa cópia temporária da migration
      # (o arquivo do repo não é tocado) e exige que a asserção de ACL falhe.
      - name: Simular credencial dedicada de cron no Vault (L5)
        env:
          CRON_SECRET_L5_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          # E47: SKIP_DOCKER_SHIM=1 — o teste usa docker exec bash (BLOCO C/D),
          # não suportado pelo shim (apenas psql é interceptado; exit 1 silencia o FAIL).
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/cron-secret-l5-contract.test.sh

      - name: Simular escopo das 14 policies TO public -> authenticated
        env:
          PUBLIC_POLICY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/scope-public-policies-authenticated.test.sh

      - name: Simular permissao send_messages imposta na RPC de envio (L9)
        env:
          SEND_MESSAGES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/send-messages-permission-authorization.test.sh

      - name: Simular escopo de fila na escolha da conexao de envio (L7)
        env:
          ENQUEUE_SCOPE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/enqueue-connection-scope.test.sh

      - name: Simular vinculo de time na reacao em mensagem (#1265)
        env:
          TEAM_REACTION_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/team-reaction-membership.test.sh

      - name: Simular drop do indice redundante de messages.external_id (perf)
        env:
          DROP_EXTID_INDEX_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/drop-redundant-messages-external-id-index.test.sh

      - name: Simular fila, autorização e aceite concorrente do TALK ME
        env:
          TALK_ME_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talk-me-queue-contract.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp_talkx_history_<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular histórico atômico de templates Talk X
        env:
          TALKX_HISTORY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: |
          TALKX_HISTORY_PRECREATE_RUNTIME=false bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true TALKX_HISTORY_INVALID_PRESTATE=true bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true TALKX_HISTORY_INVALID_LIVE_PRESTATE=true bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-template-history-behavior.test.sh
          TALKX_HISTORY_PRECREATE_RUNTIME=true TALKX_HISTORY_INVALID_VARIANT_PRESTATE=true bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-template-history-behavior.test.sh

      - name: Simular correção forward-only da FK saved_by do Talk X
        env:
          TALKX_HISTORY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: |
          TALKX_HISTORY_FK_PRESTATE=NO_ACTION bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-history-saved-by-fk.test.sh
          TALKX_HISTORY_FK_PRESTATE=SET_NULL bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-history-saved-by-fk.test.sh
          TALKX_HISTORY_FK_PRESTATE=ORPHAN bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-history-saved-by-fk.test.sh

      - name: Simular reconciliação forward-only da policy Talk X blacklist
        env:
          TALKX_BLACKLIST_POLICY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-blacklist-policy-forward-only.test.sh

      - name: Simular edição de limites de campanha via RPC Talk X (V09)
        env:
          TALKX_UPDATE_LIMITS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-update-limits-rpc.test.sh

      - name: Simular correção da janela de envio via RPC Talk X (V09b)
        env:
          TALKX_UPDATE_LIMITS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-update-limits-send-window.test.sh

      - name: Simular endurecimento de casts na RPC Talk X (V09c)
        env:
          TALKX_UPDATE_LIMITS_CASTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-update-limits-casts.test.sh

      - name: Simular correção do vazamento 22009 na RPC Talk X (V09e)
        env:
          TALKX_UPDATE_LIMITS_22009_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-update-limits-22009.test.sh

      - name: Simular autenticação do escape hatch de limites Talk X (V09d)
        env:
          TALKX_ESCAPE_HATCH_AUTH_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-escape-hatch-auth.test.sh

      - name: Simular guards fail-closed do Talk X (MAPA)
        env:
          TALKX_GUARDS_FAIL_CLOSED_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-guards-fail-closed.test.sh

      - name: Simular replay idempotente do talkx_settings (R2-01)
        env:
          TALKX_SETTINGS_REPLAY_IDEMPOTENT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-settings-replay-idempotent.test.sh

      - name: Simular teto de send_interval_max em 24h (A2)
        env:
          TALKX_SEND_INTERVAL_TETO_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-send-interval-teto-24h.test.sh

      - name: Simular limites de ritmo por minuto/dia/conexão e perfis de velocidade (X018)
        env:
          TALKX_SEND_BUDGET_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-send-budget.test.sh

      - name: Simular eventos do ciclo de vida gravados no servidor (V12)
        env:
          TALKX_V12_LIFECYCLE_EVENTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-v12-lifecycle-events.test.sh

      - name: Simular guard de replied_count e remoção da RPC de use_count (V15)
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-v15-replied-count-guard.test.sh

      - name: Simular série horária contando sent + delivered (V16)
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-v16-time-series.test.sh

      - name: Simular READ marcando read_at + read_count (V17)
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-v17-read-at.test.sh

      - name: Simular retry manual de destinatário terminal (V19)
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-v19-retry-recipient.test.sh

      - name: Simular flags de lançamento persistidas (V21)
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-v21-launch-flags.test.sh

      - name: Simular supressão de contato idempotente nos eixos phone e contact_id (V07b)
        env:
          TALKX_SUPPRESS_PHONE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-suppress-phone-axis.test.sh

      - name: Simular vazamento e correção da view de métricas Talk X
        env:
          TALKX_METRICS_INVOKER_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-metrics-view-invoker.test.sh

      - name: Simular snapshot atômico de destinatários Talk X
        env:
          TALKX_DRAFT_RECIPIENTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-draft-recipients.test.sh

      - name: Simular identidade e revisão otimista de rascunhos Talk X
        env:
          TALKX_DRAFT_SAVE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-draft-save.test.sh

      - name: Simular leases de entrega concorrente do Talk X
        env:
          TALKX_DELIVERY_LEASES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-delivery-leases.test.sh

      - name: Simular snapshot imutável de mensagem e variante Talk X
        env:
          TALKX_MESSAGE_SNAPSHOT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-message-snapshot.test.sh

      # F20 do plano do Multiplix: replay limpo das 10 migrations do modulo +
      # as desta tarefa, e assercao negativa do contrato de acesso (anon fora,
      # FORCE RLS, policies TO authenticated, guarda de mutabilidade, criacao
      # transacional idempotente com teto, fila e scheduler).
      - name: Simular contrato de acesso e fila do Multiplix
        env:
          MULTIPLIX_RLS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/multiplix-rls.test.sh

      # F57 do plano do Multiplix: prova a fila de entrega por ITEM — claim com lease, ordem por
      # bloco, heartbeat e cancelamento — e trava o defeito em que o cancel encerrava apenas os
      # destinatarios, deixando item pending na fila para o worker enviar depois do cancel.
      - name: Simular a fila de entrega por item do Multiplix
        env:
          MULTIPLIX_RLS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/multiplix-delivery-leases.test.sh

      # F24 do plano do Multiplix: prova que a edge multiplix-audience deriva o
      # escopo do JWT (matriz F25) e IGNORA escopo forjado no corpo. O bloco
      # estatico roda sempre; o bloco ao vivo PULA e sai 0 sem credenciais
      # (ZAPP_SUPABASE_URL/ANON + EXTERNAL_SUPABASE_* + contas em ~/.secrets),
      # entao o CI offline nao quebra — quando as credenciais existirem no
      # runner, a prova roda contra a edge e o Singu reais.
      - name: Provar escopo da audiencia Multiplix (F24)
        run: bash scripts/db-audit/multiplix-scope.test.sh

      - name: Simular estados e audiencia canônicos do Talk X
        env:
          TALKX_CAMPAIGN_STATE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-campaign-state-transitions.test.sh

      - name: Simular transições concorrentes de campanha Talk X
        env:
          TALKX_CAMPAIGN_TRANSITIONS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-campaign-transitions.test.sh

      # X010: trava por campanha (worker lease), start idempotente (sending ->
      # sending sem tocar started_at), fila do worker em RPC e segredo de cron
      # dedicado do Talk X.
      - name: Simular trava por campanha, fila do worker e segredo de cron do Talk X (X010)
        env:
          TALKX_CAMPAIGN_WORKER_LEASE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-campaign-worker-lease.test.sh

      # X014: exigir papel admin/supervisor no banco para criar, agendar e alterar
      # campanha (RPCs, policies de talkx_campaigns, gatilho de agendamento, revoke
      # de anon em talkx_settings, policy de talkx_blacklist e ramo admin em
      # link_clicks).
      - name: Simular portões de papel do Talk X (X014)
        env:
          TALKX_ROLE_GATES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-role-gates.test.sh

      # X016: RPC unica de audiencia (talkx_resolve_audience) com a funcao interna
      # talkx_audience_query — whitelist de campo/operador, elegibilidade
      # (deleted_at/LID/telefone/visibilidade), supressao por id ou telefone
      # normalizado e paginacao keyset.
      - name: Simular a RPC unica de audiencia do Talk X (X016)
        env:
          TALKX_AUDIENCE_RPC_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-audience-rpc.test.sh

      # X017: geracao de destinatarios no servidor a partir do rascunho salvo
      # (snapshot_talkx_campaign_audience) — colunas respect_suppression/
      # audience_snapshot_at, criterio de elegivel no replace e recusa de
      # respect_suppression=false (22023) ate a decisao N12.
      - name: Simular o snapshot de audiencia do Talk X (X017)
        env:
          TALKX_AUDIENCE_SNAPSHOT_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-audience-snapshot.test.sh

      # Auditoria: correção de DUAS regressões vivas por recriação de função —
      # save_talkx_campaign_draft perdeu template_version_id (V26) e
      # transition_talkx_campaign não gravava launched_by/launched_at no start
      # (V21). O harness aplica a CADEIA COMPLETA das migrations Talk X (do zero,
      # ordem de versão) e confere RED (perda reproduzida) → GREEN (correção
      # restaura).
      - name: Simular a correção das regressões do Talk X (cadeia completa)
        env:
          TALKX_REGRESSOES_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-regressoes-chain.test.sh

      # X012: o tick do motor — reaper (lease vencido após o POST vira
      # outcome_unknown), conclusão de campanha drenada, fan-out de no máximo 1
      # campanha 'sending' por conexão com x-cron-secret e timeout de 30s, e a
      # troca (alter_job, sem job novo) do command do 'talkx-scheduler-1min'.
      # Aplica de verdade as dependências já mergeadas (X010 e a RPC de conclusão)
      # e troca net.http_post por uma tabela de captura.
      - name: Simular o tick do motor Talk X (X012)
        env:
          TALKX_ENGINE_TICK_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-engine-tick.test.sh

      # O teste existente acima monta o fixture aplicando SO a migration de
      # 20260911150000 (um overload), e por isso nunca viu a ambiguidade que
      # existe em producao quando a versao de 3 args de 20260916210000 tambem
      # esta viva. Este passo sobe PostgREST de verdade e chama a RPC por HTTP,
      # sem mock: HTTP 300 PGRST203 antes da migration, 200 e o ciclo completo
      # depois.
      # E47: SKIP_DOCKER_SHIM=1 — este step precisa do docker real para subir
      # o container PostgREST; o shim não intercepta este step.
      - name: Provar ambiguidade do overload de transition_talkx_campaign no PostgREST
        env:
          TALKX_TRANSITION_POSTGREST_PG_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          TALKX_TRANSITION_POSTGREST_IMAGE: ${{ env.POSTGREST_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-transition-overload-postgrest.test.sh

      # V11: o contrato de eventos recusava os tipos que o servidor e a trilha
      # de supressão precisam gravar, e campaign_id era NOT NULL (evento de
      # entidade não tinha como existir). O fixture espelha a definição viva,
      # inclusive as policies — que tiveram de ser recriadas, porque o EXISTS em
      # talkx_campaigns nunca é verdadeiro com campaign_id nulo.
      - name: Provar o contrato de eventos do Talk X
        env:
          TALKX_EVENTS_CONTRACT_PG_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-events-contract.test.sh

      # X021: escrita de links (UTM/created_by/rótulo único), leitura de cliques e
      # conversões (admin/supervisor + dono), deduplicação de conversão, teto de valor
      # e investimento por campanha — prova em PostgreSQL descartável.
      - name: Provar escrita de links, leitura de cliques/conversões e investimento (X021)
        env:
          TALKX_LINKS_CONV_PG_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-links-conversions.test.sh

      # X024: delta de ciclo de vida — start->pause->resume->cancel grava 4 eventos em
      # ordem com ator e motivo; retomada sem ator grava resumed_auto; cancel fecha a
      # fila (pendentes viram cancelled, leases soltas); cancelado não vira completed;
      # conclusão drenada grava 1 completed com resumo.
      - name: Provar o ciclo de vida com ator/motivo e o fechamento da fila (X024)
        env:
          TALKX_LIFECYCLE_EVENTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-lifecycle-events.test.sh

      # X026: contadores íntegros (replied_count/skipped_count no guard de
      # enforce_talkx_campaign_mutability), destinatário pulado entra em
      # skipped_count, lançar com template não conta use_count em dobro, checklist
      # de retomada com ator, duplicar/excluir por RPC no banco e policy de INSERT
      # de eventos limitada a note|checklist|segments_reviewed. Harness RED→GREEN
      # em PostgreSQL 17 descartável.
      - name: Provar contadores, checklist, duplicar/excluir e policy de eventos (X026)
        env:
          TALKX_COUNTERS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-counters-integrity.test.sh

      # X027: recibos de leitura idempotentes e atribuição de resposta no banco —
      # read sem delivered preenche delivered_at/read_at e sobe delivered_count/read_count
      # uma única vez; record_talkx_recipient_delivered vira invólucro; attribute_talkx_reply
      # atribui por contact_id OU telefone normalizado na janela de reply_window_hours;
      # talkx_campaign_reply_stats devolve replied/avg/median; read_at na publicação realtime.
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar recibos de leitura, atribuicao de resposta e tempo de resposta (X027)
        env:
          TALKX_RECEIPTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-receipts-replies.test.sh

      # X031: reenvio manual em lote (failed/skipped, teto de 3, revalida supressão e
      # elegibilidade) e resolução de outcome_unknown (mark_sent|mark_failed|retry) por
      # RPC admin/supervisor com trilha; campanha completed reabre para sending.
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar reenvio manual e resolucao de outcome_unknown com trilha (X031)
        env:
          TALKX_X031_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-retry-resolve.test.sh

      # X032: LGPD no motor — consentimento no lancamento (revoked fora da audiencia,
      # require_granted_consent opcional, start/agendar recusam sem confirmacao, opt-out
      # automatico marca consent_status=revoked) e expurgo por prazo 1x/dia via
      # purge_talkx_expired_data (texto/midia de campanha terminal vencida, ua/ip_hash,
      # linhas de teste e de IA) sem tocar blacklist, contadores ou eventos.
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar consentimento no lancamento e expurgo por prazo (X032)
        env:
          TALKX_X032_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-lgpd.test.sh

      # X033: log por destinatario (sem telefone/texto, expurgo de 30 dias), view de
      # saude talkx_engine_health (security_invoker) e alertas com deduplicacao por
      # tipo/campanha e fechamento automatico (stalled_campaign, cron_degraded).
      # Harness RED→GREEN em PostgreSQL 17 descartável.
      - name: Provar log por destinatario, saude do motor e alertas (X033)
        env:
          TALKX_X033_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-engine-health.test.sh

      # M-DB-01: o tick do motor nao aborta no expurgo LGPD (storage.protect_delete
      # FOR EACH STATEMENT levanta 42501 em DELETE direto; a fixture recria o gatilho).
      # Manifesto talkx_storage_purge_queue, alerta purge_failed com espera de 1 h,
      # gate diario e outcome_unknown alinhado ao CHECK. Harness RED→GREEN em PostgreSQL 17.
      - name: Provar que o tick nao aborta no expurgo (M-DB-01)
        env:
          TALKX_MDB01_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/talkx-tick-expurgo.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp-message-phase1-<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular primitivas atômicas de mensagens e encerramento
        env:
          MESSAGE_DELIVERY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/message-delivery-phase1-behavior.test.sh

      - name: Simular contrato de dados da Telefonia v2
        env:
          CALLS_TELEFONIA_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/calls-telefonia-contract.test.sh

      # E47: SKIP_DOCKER_SHIM=1 — o contrato runtime inclui proof.database === 'postgres'.
      # Com o shim o banco criado é shim_zapp-notification-atomicity-<PID> e
      # current_database() devolve esse nome, quebrando a asserção.
      - name: Simular notificações atômicas de chamadas e sentimento
        env:
          NOTIFICATION_ATOMICITY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/notification-delivery-atomicity.test.sh

      # Guarda o contrato runtime generico do db-migrate: se ele deixar de
      # detectar alguma forma de DDL, um apply poderia ser autorizado sobre um
      # schema alterado entre o dry-run e a aplicacao.
      - name: Simular contrato runtime generico de migration
        env:
          GENERIC_RUNTIME_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          # E47: SKIP_DOCKER_SHIM=1 — o contrato verifica proof.database === 'postgres'.
          # Com o shim o banco criado e shim_zapp_generic_runtime_test_<PID> e
          # current_database() devolve esse nome, quebrando a assercao.
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/generic-migration-runtime.test.sh

      - name: Simular reconciliação segura do ledger
        env:
          LEDGER_RECONCILE_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/check-reconcile-ledger-drift.test.sh

      - name: Simular auditoria somente-leitura de configuracao runtime
        env:
          # E47: SKIP_DOCKER_SHIM=1 — o readiness check usa `docker logs` para aguardar
          # "PostgreSQL init process complete; ready for start up." — o shim devolve saida
          # vazia nesse subcomando, fazendo o loop de 45s falhar por timeout.
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/runtime-config.test.sh

      - name: Provar transporte libpq com cliente e PostgreSQL reais
        env:
          # E47: SKIP_DOCKER_SHIM=1 — o readiness check conecta sem -U, usando o usuario
          # OS (root no container), causando "role root does not exist" no servico compartilhado.
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh node scripts/db-audit/psql-environment.integration.mjs

      - name: Simular ambiguidade da RPC e recursao da policy do team chat (#1266)
        env:
          TEAM_CHAT_RPC_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/team-chat-rpc-ambiguity.test.sh

      # L11 da matriz IA-004 (IA-004-matriz-autorizacao.md:297): a ACL de ESCRITA de
      # public.departments. O INSERT/UPDATE de NIVEL DE TABELA (privilegio default do schema
      # public) nunca tinha sido revogado -- e um REVOKE por coluna NAO remove grant de tabela,
      # entao qualquer usuario autenticado podia GRAVAR o segredo do WhatsApp pelo PostgREST.
      # O harness reproduz o grant de TABELA + os grants de COLUNA medidos no banco canonico e
      # prova: o furo ANTES (authenticated pode INSERT/UPDATE nas 2 colunas de segredo), o
      # estado DEPOIS (has_column_privilege false nas 2 colunas de segredo e true nas colunas
      # seguras) e a MUTACAO que remove o REVOKE de TABELA (o contrato tem de encerrar nao-zero).
      - name: Simular ACL de escrita de departments (L11)
        env:
          L11_DEPARTMENTS_ACL_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          # E47: SKIP_DOCKER_SHIM=1 — o readiness check usa `docker logs` para aguardar
          # "PostgreSQL init process complete; ready for start up." — o shim devolve saida
          # vazia nesse subcomando, fazendo o loop de 90s falhar por timeout.
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/l11-departments-acl-escrita.test.sh

      # Auditoria Onda 3, achado 2: a RPC de recibo de leitura e SECURITY DEFINER e nao checava
      # vinculo — gravava recibo cross-team por RPC enquanto o insert direto era barrado pela RLS.
      # Bloco A prova o defeito no mesmo container, aplica a migration e o bloco B prova a correcao.
      - name: Simular vinculo obrigatorio no recibo de leitura do team chat (auditoria Onda 3)
        env:
          TEAM_RECEIPTS_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/team-receipts-membership.test.sh

      # E76 (plano MAPA Fase 7), ajuste (b) da decisao 20261002-063721: o contrato da
      # RPC `search_contacts` (8 campos de endereco, ACL sem anon/PUBLIC e trigger de
      # auditoria) vive aqui porque este workflow tem gatilho `pull_request` (linha 17) —
      # entao o contrato passa a BARRAR o PR; o db-live-guard nao roda em pull_request por
      # design. Alinha ao E50 do PLANO_GITHUB_ACTIONS_100_ETAPAS_2026-10-01.md e a
      # AUDITORIA-W3-REPLAY.md:229. De bonus, a imagem fica pinada por digest: o valor
      # vem de POSTGRES_TEST_IMAGE, como nos passos vizinhos.
      - name: Provar contrato de endereco da RPC search_contacts (mapa F1)
        env:
          MAPA_F1_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/mapa-f1-address-contract.test.sh

      # E50 (auditoria de GitHub Actions, 2026-10-02): promove 3 testes que estavam
      # na ALLOWLIST de check-test-inventory.mjs para passos efetivos do db-guard.
      # Todos iniciam containers Docker próprios (docker run -d) e são incompatíveis
      # com o docker-shim do E47 — SKIP_DOCKER_SHIM="1" em cada um.
      - name: Provar contrato de vocabulário de IA — backfill e reversão (IA-030)
        env:
