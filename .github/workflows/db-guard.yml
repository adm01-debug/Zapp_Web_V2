      - name: Provar a RPC canônica de política de rede (R2-AUTH-022)
        env:
          NETWORK_POLICY_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/network-policy-rpc.test.sh

      # R2-AUTH-004 (05/10/2026): o passo falhou UMA vez no runner com exit 2 silencioso
      # e passou na repetição. Diagnóstico local: 6/6 execuções verdes e o exit 2 é
      # inalcançável por esta trilha — o teste só emite exit 1 e o wrapper só
      # propaga 0/1 (ou 64 de uso, sem argumento). Falha transitória da infraestrutura
      # do runner, não do contrato. A flag `-x` de diagnóstico (commit 5143f0381)
      # nunca chegou a esta base; o passo permanece sem o `-x`.
      - name: Provar revogação de sessões Auth por migration (R2-AUTH-004)
        env:
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/revoke-auth-sessions.test.sh

      # N-008: rotina diaria encerra user_sessions vencidas (container proprio, readiness por docker exec).
      - name: Provar encerramento diario de sessoes vencidas (N-008)
        env:
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/user-sessions-expire.test.sh
      # SEC-Y25-01 (P0, SEC-RLS_TAREFAS_EMAIL_LIGACOES-01): o INSERT de deal_activities,
      # calls e conversation_tasks validava só o AUTOR, nunca o ALVO. O teste sobe um
      # PostgreSQL descartável, aplica o helper real de visibilidade de contato, reproduz
      # o ataque como papel real (agent) antes da correção, e prova o bloqueio depois —
      # mais anon negado pelo RLS e service_role liberado. SKIP_DOCKER_SHIM=1: o teste cria
      # os papéis anon/authenticated/service_role, que são globais ao cluster.
      - name: Simular amarração do alvo no INSERT de atividades, chamadas e tarefas (SEC-Y25-01)
        env:
          SEC_Y25_INSERT_ALVO_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/sec-y25-01-insert-alvo.test.sh

      # N-002 (P1 · seguranca, inventario A4b): a trava que impede um usuario comum de
      # virar admin em public.profiles (gatilho prevent_privilege_escalation, corrigido
      # pela migration 20260830161547) existia sem nenhum teste. O contrato aplica os
      # ARQUIVOS de migration reais num PostgreSQL 17 descartavel e prova: agente e
      # supervisor recusados nos campos protegidos, admin trocando o papel de outro e o
      # sync interno (user_roles -> profiles, auth.uid() nulo) preservado. Inicia
      # container proprio e roda CREATE ROLE anon/authenticated/service_role — as roles
      # sao globais ao cluster, entao o docker-shim do E47 colidiria com as do shim.
      - name: Provar a trava de escalada de privilegio em profiles (N-002)
        env:
          PROFILES_ESCALATION_TEST_POSTGRES_IMAGE: ${{ env.POSTGRES_TEST_IMAGE }}
          SKIP_DOCKER_SHIM: "1"
        run: bash scripts/db-audit/retry-disposable-postgres-test.sh bash scripts/db-audit/profiles-role-escalation-guard.test.sh

      # N-147 (P3 · banco, limpeza de RLS): o ramo `OR is_admin_or_supervisor` das
      # policies SELECT/UPDATE de email_threads e email_messages (migration
      # 20260403105341) era inerte — o SELECT de gmail_accounts mostra a conta
      # so ao dono, entao o EXISTS nunca decide nada para admin de outra conta.
      # A migration 20261010120000 remove o ramo sem mudar quem enxerga o que
      # (so o dono ve/atualiza). O teste aplica as migrations reais num
      # PostgreSQL 17 descartavel e prova: dono ve/atualiza, admin e supervisor
      # de outra conta nao veem nem atualizam, antes e depois; sem a migration
      # o bloco B falha (vermelho), com ela passa (verde), e o rollback devolve
      # o texto anterior. Inicia container proprio e roda CREATE ROLE
      # anon/authenticated/service_role — as roles sao globais ao cluster, entao
      # o docker-shim do E47 colidiria com as do shim.
      - name: Provar a remocao do ramo admin inerte do RLS de email (N-147)
