# docs:
#   gatilho: pull_request, push na main e dispatch
#   prova: checagem de tipos, testes de unidade e build do app
#   falha: o run fica vermelho (a main nao tem branch protection: nada e bloqueado)
#   avisa: autor do PR, via checks do GitHub
# =================================================
# CI minimo (16/10/2026, decisao do Joaquim): tipos + testes de unidade + build.
# Guardas de banco, E2E, auditorias e contratos de workflow sairam do CI por PR.
# =================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # E69 (08/10/2026): `test`, `security`, `e2e` e `mutation-mapa` NÃO têm `needs`
  # do lint — eles rodam em PARALELO com o `lint-and-typecheck`, então o tempo de
  # parede do PR passa a ser max(lint, test, security, e2e) em vez da soma. O
  # `build` continua atrás do lint E do `test` (gate de fato antes de empacotar).
  # Trava contra regressão: scripts/ci/workflow-contracts.unit.mjs (casos E69).
  # ===========================================
  # JOB 1: Lint & Type Check
  # ===========================================
  lint-and-typecheck:
    name: 🔍 Lint & TypeCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟩 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # "tsc --noEmit" e no-op neste tsconfig (so "references"); o ratchet roda
      # "tsc -b --force" e falha so se surgir erro de tipo novo.
      - name: 🔎 Run TypeScript debt ratchet
        run: node scripts/ci/typecheck-ratchet.mjs

  unit-tests:
    name: 🧪 Unit Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run Vitest shard ${{ matrix.shard }}/3
        run: bun vitest run --shard=${{ matrix.shard }}/3
        env:
          CI: true

      # Config dedicado (vitest.contracts.config.ts): reescreve o import Deno
      # "https://esm.sh/zod@3.23.8" de schemas.ts para o alias npm "zod3"
      # (zod@3.23.8, ja no bun.lock). O vitest.config.ts principal nao tem
      # esse rewrite e quebra em 3 dos 6 arquivos (Node nao resolve URL https
      # no loader ESM padrao) — por isso a suite roda num config separado.
      - name: 🧪 Run Edge Function contract tests (tests/contracts)
        run: bun run test:contracts
        env:
          CI: true

      - name: 📊 Upload coverage report
        # E72 (G-32): a cobertura so sobe da main. Num PR ninguem consome o
        # relatorio (o piso de cobertura e verificado pelo proprio vitest) e cada
        # PR deixava um artifact de varios MB — 2.333 acumulados em 01/10/2026.
        # `always()` mantem o upload quando a suite falha na main, que e' justo
        # quando a cobertura serve para diagnosticar; 7 dias pelo plano (E72).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [typecheck, unit-tests]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build for production
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CRM_INTEGRATION_ENABLED: 'true'

      # E72 (G-32): o artifact de dist/ so sai em workflow_dispatch (build manual,
      # para inspecionar o bundle). Em PR ninguem consome; em push para main o
      # deploy e feito pela Vercel. Medido em 01/10/2026: 2.333 artifacts
      # acumulados, 41.6k GigabyteHours de storage so em agosto.
      - name: 📦 Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

      - name: 📏 Enforce initial bundle budget (performance-budget.json)
        run: node scripts/ci/bundle-budget.mjs

      # O budget olha o TAMANHO do bundle; esta guarda olha o CONTEUDO: decodifica
      # o payload de cada JWT ("eyJ...") dos .js/.mjs/.cjs do dist/ e reprova
      # role=service_role (incidente de 20/08). Tambem reprova qualquer JWT em
      # .env.production cujo role nao seja anon.
      - name: 🔑 Guard que o bundle dist/ não expõe a chave service_role
        run: node scripts/ci/check-bundle-secrets.mjs

      - name: 📐 Report bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "====================="
          du -sh dist/
          echo ""
          echo "JS Files:"
          find dist -name "*.js" -exec du -h {} \;
          echo ""
          echo "CSS Files:"
          find dist -name "*.css" -exec du -h {} \;

  # ===========================================
  # JOB 4: Security Audit
  # ===========================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Um unico "bun audit": o relatorio completo (inclui devDependencies) sai sempre,
      # e o gate bloqueante le o mesmo arquivo em vez de consultar o registry de novo.
      # O status do coletor vai para audit-status.txt em vez de ser neutralizado com
      # `|| true`: `bun audit` sai com 1 tanto para advisory quanto para falha de
      # registry, e o gate confere o codigo E o relatorio (R2-INF-009).
      - name: 🔎 Audit completo (informativo, inclui devDependencies)
        run: |
          set -euo pipefail
          status=0
          bun audit --audit-level=low > audit-report.txt 2>&1 || status=$?
          echo "$status" > audit-status.txt
          cat audit-report.txt

      - name: 🔒 Audit bloqueante (HIGH/CRITICAL em dependencias de producao)
        run: node scripts/ci/audit-prod.mjs --level high --input audit-report.txt --status audit-status.txt

      - name: 🔍 Detect secrets introduced in commits
        # v3 roda em Node 24. O action calcula o intervalo do evento e falha
        # fechado para segredos novos, sem reabrir findings históricos já
        # inventariados. Não recebe secrets privilegiados em pull_request.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

      - name: 🛡️ Guarda src/ nao lê VITE_SUPABASE_URL/PUBLISHABLE_KEY
        run: node scripts/ci/check-supabase-url-import-meta.mjs

  # ===========================================
  # JOB 5: E2E Tests (Playwright)
  # ===========================================
  e2e:
    name: 🎭 E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧄 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # E68 (auditoria de GitHub Actions, 2026-10-01): o download dos browsers
      # domina o tempo deste job. `~/.cache/ms-playwright` é estável para uma
      # dada versão do Playwright, então o cache evita baixar Chromium/Firefox/
      # WebKit a cada run. A chave carrega o hash do bun.lock (o Playwright é
      # devDependency e a versão está no lock) e o CONJUNTO de browsers: um cache
      # salvo por job que instala só Chromium não pode satisfazer este, que
      # precisa dos três.
      - name: 💾 Cache dos browsers Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-cfw-${{ hashFiles('bun.lock') }}-${{ runner.os }}

      - name: 🎭 Install Playwright (Chromium, Firefox, WebKit)
        # Só em cache miss. Versao exata resolvida no bun.lock (SonarCloud
        # githubactions:S8543: `bunx playwright` sem versao puxaria um release
        # nao verificado).
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.63.0 install --with-deps chromium firefox webkit

      - name: 🔧 Dependências de sistema do Playwright (cache quente)
        # O cache guarda os browsers, não os pacotes do apt: com o cache quente
        # as bibliotecas do sistema ainda precisam ser instaladas.
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright@1.63.0 install-deps chromium firefox webkit

      # Projeto "chromium" exercita auth.spec.ts deslogado (sem
      # E2E_TEST_EMAIL/E2E_TEST_PASSWORD). Workflows de PR não podem referenciar
      # esses secrets (scripts/ci/check-pr-workflow-secrets.mjs), então o login real
      # roda em .github/workflows/e2e-logado.yml, depois do merge na main.
      # E88: firefox-auth/webkit-auth (a MESMA auth.spec.ts nos engines alternativos)
      # SAÍRAM daqui e foram para o e2e-logado.yml. Os dois são deslogados (sem `setup`
      # nem `storageState`), mas cobertura cross-browser de auth não precisa bloquear
      # todo PR: o PR fica só com Chromium e o e2e-logado.yml — que já instala os 3
      # engines — segue provando a tela de login no Firefox e no WebKit.
      # Travado em scripts/ci/ci-e2e-projects.unit.mjs.
      # chromium-mapa (E71/E72 picker, E73 cadastro, E74 mapa/pino) entra AQUI também:
      # ele já roda no e2e-logado.yml (pós-merge), mas é deslogado — o projeto não
      # declara `setup` nem `storageState`; as specs autenticam por sessão FALSA
      # (installFakeSession) com REST/RPC e Mapbox mockados, logo executam sem secret
      # algum. Sem esta linha os PRs passavam com E2E VERDE sem rodar spec alguma do
      # mapa (#463 / E75).
      - name: 🧪 Run Playwright E2E (chromium + firefox + webkit, sem autenticação)
        run: bun run test:e2e -- --project=chromium --project=chromium-theme --project=chromium-mapa --project=chromium-contacts-visual --project=chromium-a11y --project=chromium-email-navy --project=firefox-email-navy --project=webkit-email-navy
        env:
          CI: true

      - name: 📊 Upload Playwright report
        # E72 (G-32): o report so sobe quando o E2E falha. Num PR verde ele nao
        # serve para ninguem e so engorda o storage do repo (2.333 artifacts em
        # 01/10/2026). O caminho sensivel ja e' excluido logo abaixo.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          # Exclui o snapshot de falha e os traces: sao os unicos arquivos do
          # report que podem conter valor digitado em campo de formulario.
          path: |
            playwright-report/
            !playwright-report/**/error-context.md
            !playwright-report/**/*.zip
            !test-results/**/error-context.md
          retention-days: 3
          if-no-files-found: ignore

  # ===========================================
  # JOB 6: Mutação do mapa (E70, não bloqueante)
  # ===========================================
  # E70: roda o runner de mutação do módulo do mapa (E69,
  # `scripts/mutation/run-mapa.mjs`) quando um PR toca `src/lib/mapbox*` ou
  # `src/components/inbox/location-picker/**`. `continue-on-error: true` mantém o
  # job INFORMATIVO: um mutante sobrevivente nunca trava o merge (não é required).
  #
  # O GitHub Actions não oferece `paths:` por job — o filtro `paths` só existe no
  # gatilho do workflow, e usá-lo aqui restringiria TODOS os jobs do ci.yml. Para
  # não alterar os jobs existentes, o filtro de caminhos roda em STEP
  # (`git diff --name-only` contra a base do PR), a alternativa prevista na
  # auditoria de GitHub Actions (E64).
  mutation-mapa:
    name: 🧬 Mutação do mapa (não bloqueante)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico completo: o filtro de caminhos compara com a base do PR
          # (`origin/<base>...HEAD`), o que exige o ancestral comum.
          fetch-depth: 0

      # Filtro de caminhos (E70): só o módulo do mapa justifica a rodada.
      - name: 🔎 Detectar mudança no módulo do mapa (paths filter)
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            # push/dispatch/merge_group: sem base de PR, roda (fail-open).
            echo "map_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          printf 'Arquivos alterados no PR:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/lib/mapbox|src/components/inbox/location-picker/)'; then
            echo "map_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "map_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧄 Setup Bun
        if: steps.paths.outputs.map_changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        if: steps.paths.outputs.map_changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        if: steps.paths.outputs.map_changed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧬 Rodar mutação do mapa (E69)
        if: steps.paths.outputs.map_changed == 'true'
        run: bun run mutation:mapa

  # ===========================================
  # JOB: Mutação do multiplix-send (bloqueante)
  # ===========================================
  # Roda o runner de mutação do worker do Multiplix (N-017) quando
  # um PR toca supabase/functions/multiplix-send/. Fail-closed:
  # sai 1 se algum mutante sobreviver (teste decorativo naquele
  # ponto). Seguindo o padrão mutation-mapa (E70): paths filter
  # em step, sem continue-on-error (bloqueante).
  mutation-multiplix-send:
    name: 🧬 Mutação do multiplix-send
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Filtro de caminhos (E70): só o módulo multiplix-send justifica a rodada.
      - name: 🔎 Detectar mudança no módulo multiplix-send (paths filter)
        id: paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            # push/dispatch/merge_group: sem base de PR, roda (fail-open).
            echo "multiplix_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          printf 'Arquivos alterados no PR:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^supabase/functions/multiplix-send/'; then
            echo "multiplix_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "multiplix_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🦕 Setup Deno
        if: steps.paths.outputs.multiplix_changed == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.5'

      - name: 🧄 Setup Bun
        if: steps.paths.outputs.multiplix_changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: 🗃️ Cache do Bun (instalação)
        if: steps.paths.outputs.multiplix_changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - name: 📚 Install dependencies
        if: steps.paths.outputs.multiplix_changed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧬 Rodar mutação do multiplix-send
        if: steps.paths.outputs.multiplix_changed == 'true'
        run: python3 scripts/db-audit/multiplix-send-mutation.py
